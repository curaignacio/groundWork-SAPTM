  { u:"s14", q:"In BRFplus, what is the input of a rule called", o:["Result", "Catalog", "Action", "Context"], a:3, e:"H15, Use. The rule input is known as context and the rule output is called result; both consist of data objects of type element, structure or table." },
  { u:"s14", q:"What results in BRFplus when an element data object rather than a structure is assigned to a table data object", o:["A deeply nested structure of fields", "A one-column table, a simple list", "A table without any defined fields", "A table made of exactly two elements"], a:1, e:"H15, Data Objects and Types. If an element is assigned to a table instead of a structure, the result is a one-column table, that is a simple list." },
  { u:"s14", q:"How does a BRFplus decision table expression evaluate its rows at runtime", o:["Row by row from the top, stopping at the first fully true row", "All rows in parallel, returning the result of the last matching row found", "Row by row from the bottom, stopping at the most general matching row", "Only the first row, falling back to a default result when it does not match"], a:0, e:"H15, Decision Table Expression. Rows are processed sequentially from the first row; when all cells in a row are true, evaluation stops and that row's result is returned. Hence the most specific conditions should come first." },
  { u:"s14", q:"What is the purpose of a catalog in BRFplus", o:["To store the trace of every function execution", "To transport active objects between systems as XML", "To generate web services for the calling application", "To filter the repository for business users"], a:3, e:"H15, Catalog. A catalog simplifies rule maintenance by hiding the repository and displaying only the relevant objects; it serves as a filter for all objects in the repository." },
  { u:"s15", q:"Which set lists the five dimensions of core described in MCC100", o:["Processes, extensions, applications, integrations, users", "Processes, extensions, data, interfaces, hardware", "Processes, modifications, data, integrations, operations", "Processes, extensions, data, integrations, operations"], a:3, e:"MCC100, Analyzing Clean Core Components. By core the course means the dimensions Processes, Extensions, Data, Integrations and Operations; SL_RISE419 lists the same five." },
  { u:"s15", q:"How does MCC100 describe a newly provisioned SAP Cloud ERP system with regard to clean core", o:["It is clean by definition, so the goal is to keep it clean", "It must first pass a dedicated cleansing project before it counts as clean", "It is clean only after all existing custom code has been migrated", "It is clean only if it is provisioned as the private edition"], a:0, e:"MCC100, Clean Core Components. A newly provisioned SAP Cloud ERP system is clean per definition, and the goal for the customer in that case is to keep the core clean." },
  { u:"s15", q:"Which implementation approach is NOT possible for SAP S/4HANA Cloud Public Edition according to MCC100", o:["Greenfield implementation as a new installation", "Starting with a clean slate in a provisioned system", "Brownfield implementation as a system conversion", "Designing processes on current best practices"], a:2, e:"MCC100, Describing Implementation Types and Clean Core. A brownfield implementation upgrades an existing system to private edition or on-premise; the public edition cannot be chosen in the context of a brownfield approach." },
  { u:"s15", q:"Which statement does MCC100 give as a misconception about clean core", o:["Clean core also affects data, integration and operations", "SAP BTP is the only way to keep the core clean", "Clean core contributes to a reduction of TCO", "Tier 1 extensibility also keeps the core clean"], a:1, e:"MCC100, Some Misconceptions About Clean Core. SAP BTP is needed for side-by-side extensions, but key user and developer extensibility on stack are also possible with SAP Cloud ERP." },
  { u:"s15", q:"In MCC100, where are type 3 extensions created", o:["As key user extensions inside SAP S/4HANA Cloud", "As developer extensions inside SAP S/4HANA Cloud", "As classic ABAP modifications of delivered code", "As side-by-side extensions on SAP BTP"], a:3, e:"MCC100, Extensions Don't Break Upgrades. On-stack extensions are Key User (type 1) or Developer (type 2); side-by-side extensions are created within SAP BTP (type 3)." },
  { u:"s15", q:"In the Clean Core Level Concept, which extensions belong to Level B", o:["Those using an unreleased API that SAP deems stable", "Those using only publicly released and stable interfaces", "Those using APIs with a changelog because they may change", "Those using explicitly non-recommended objects or techniques"], a:0, e:"MCC100, Clean Core Level Concept. Level B uses an unreleased API (like a BAPI) deemed by SAP to be stable and upgrade safe; Level A uses released interfaces, Level C relies on APIs with a changelog, Level D is not considered clean." },
  { u:"s15", q:"According to MCC100, which SAP solution best addresses data privacy compliance through automated archiving and retention", o:["SAP Master Data Governance for central hubs", "SAP Datasphere for data warehousing", "SAP Information Lifecycle Management", "SAP Information Steward for data analysis"], a:2, e:"MCC100, Data Privacy Compliance. Data privacy compliance is best addressed through SAP Information Lifecycle Management, which automates data archiving and retention and decommissioning of legacy systems." },
  { u:"s15", q:"How does MCC100 treat RFC and IDoc for integrations", o:["As the preferred technologies for all integrations", "As recommended only if absolutely necessary", "As required for event-based scenarios", "As replaced entirely by SAP Event Mesh"], a:1, e:"MCC100, Avoid Legacy APIs And Their Legacy Extension Options. RFC and IDoc are only recommended if absolutely necessary; OData and SOAP align better with clean core principles." },
  { u:"s15", q:"What are the three core components of the RISE with SAP Methodology", o:["Discovery toolkit, quality gates and dashboards for each phase", "Roadmap viewer, success plan and runbook for every project team", "Onboarding calls, handover artifacts and partner workshops", "Standardized framework, integrated toolchain, expert guidance"], a:3, e:"SL_RISE419, The RISE with SAP Methodology. The core components are a standardized framework, an integrated toolchain and expert guidance through end-to-end engagement." },
  { u:"s15", q:"How many personalized onboarding sessions does SAP's Onboarding Advisor host in the Prepare phase", o:["Four", "Two", "Three", "Six"], a:0, e:"SL_RISE419, Standardized Framework and Prepare Phase. SAP's Onboarding Advisor hosts four personalized sessions, from Get Started with SAP to reviewing the Clean Core Quality Gate assessment." },
];
</script>

<header class="mast">
  <h1 id="m-title"></h1>
  <p class="sub" id="m-sub"></p>
  <p class="lede" id="m-lede"></p>
</header>

<div class="filters" id="filters" role="group" aria-label="Filter by session"></div>

<div class="bar">
  <span class="pos" id="pos"></span>
  <label><input type="checkbox" id="shuffle"> <span id="shuffle-label">Shuffle</span></label>
  <span class="score" id="score"></span>
</div>
<div class="track"><i id="track"></i></div>

<div id="stage"></div>

</div>
<script>
(function(){
  "use strict";
  var F = document.getElementById("filters");
  var stage = document.getElementById("stage");
  var posEl = document.getElementById("pos");
  var scoreEl = document.getElementById("score");
  var trackEl = document.getElementById("track");
  var shuffleEl = document.getElementById("shuffle");

  var filter = "all", list = [], i = 0, answers = {}, order = null;

  var L = { questionnaire:"Questionnaire", filter:"Filter by session", shuffle:"Shuffle",
            empty:"No questions compiled yet.", correct:"correct", complete:"Complete",
            question:"Question {n} of {total}", right:"Correct", wrong:"Not quite",
            back:"Back", skip:"Skip", next:"Next", results:"See results",
            summary:"{right} of {done} answered correctly", skipped:"{n} skipped",
            revisit:"Worth revisiting", retry:"Retry the missed ones", restart:"Start over" };
  if (typeof LABELS === "object" && LABELS){
    for (var lk in LABELS){ if (LABELS[lk]) L[lk] = String(LABELS[lk]); }
  }
  function fmt(s, v){ return s.replace(/\{(\w+)\}/g, function(m, k){ return k in v ? v[k] : m; }); }
  F.setAttribute("aria-label", L.filter);
  document.getElementById("shuffle-label").textContent = L.shuffle;

  function filled(v){ return (v && !/^\{.*\}$/.test(v)) ? v : ""; }
  var heading = filled(SUBJECT) ? filled(SUBJECT) + " — " + L.questionnaire : L.questionnaire;
  document.title = heading;
  document.getElementById("m-title").textContent = heading;
  document.getElementById("m-sub").textContent = filled(QUIZ_SUBTITLE) || filled(DOMAIN);
  document.getElementById("m-lede").textContent = filled(QUIZ_LEDE);

  function esc(t){
    return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function key(q){ return q.u + "|" + BANK.indexOf(q); }

  FILTER_DEFS.forEach(function(f){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = f.label;
    b.setAttribute("aria-pressed", f.k === filter ? "true" : "false");
    b.addEventListener("click", function(){
      if (filter === f.k) return;
      filter = f.k; order = null; i = 0; build(); render();
    });
    F.appendChild(b);
  });

  shuffleEl.addEventListener("change", function(){ order = null; i = 0; build(); render(); });

  function build(){
    list = BANK.filter(function(q){ return filter === "all" || q.u === filter; });
    if (shuffleEl.checked){
      if (!order){
        order = list.map(function(_, n){ return n; });
        for (var n = order.length - 1; n > 0; n--){
          var r = Math.floor(Math.random() * (n + 1)), t = order[n];
          order[n] = order[r]; order[r] = t;
        }
      }
      list = order.map(function(n){ return list[n]; });
    }
    var btns = F.querySelectorAll("button");
    FILTER_DEFS.forEach(function(f, n){
      btns[n].setAttribute("aria-pressed", f.k === filter ? "true" : "false");
    });
  }

  function answered(){
    return list.filter(function(q){ return answers[key(q)] !== undefined; });
  }
  function correctCount(){
    return list.filter(function(q){ return answers[key(q)] === q.a; }).length;
  }

  function render(){
    if (!list.length){
      posEl.textContent = ""; scoreEl.textContent = ""; trackEl.style.width = "0";
      stage.innerHTML = '<p class="empty">' + esc(L.empty) + '</p>';
      return;
    }
    var done = answered().length;
    scoreEl.innerHTML = "<b>" + correctCount() + "</b> / " + done + " " + esc(L.correct);
    trackEl.style.width = (done / list.length * 100) + "%";

    if (i >= list.length){ posEl.textContent = L.complete; return summary(); }

    posEl.textContent = fmt(L.question, { n: i + 1, total: list.length });

    var q = list[i], picked = answers[key(q)], accent = UNIT_ACCENT[q.u] || "";
    var html = '<div class="card" style="--unit:' + accent + '">' +
      '<p class="unit">' + esc(UNITS[q.u] || q.u) + '</p>' +
      '<p class="stem">' + esc(q.q) + '</p><div class="opts">';

    q.o.forEach(function(opt, n){
      var cls = "";
      if (picked !== undefined){
        if (n === q.a) cls = "correct";
        else if (n === picked) cls = "wrong";
        else cls = "muted";
      }
      html += '<button type="button" class="' + cls + '" data-pick="' + n + '"' +
              (picked !== undefined ? " disabled" : "") + '>' +
              '<span class="k">' + "ABCD".charAt(n) + '</span><span>' + esc(opt) + '</span></button>';
    });
    html += "</div>";

    if (picked !== undefined){
      var good = picked === q.a;
      html += '<div class="verdict ' + (good ? "good" : "poor") + '">' +
        '<b>' + esc(good ? L.right : L.wrong) + '</b>' + esc(q.e) + '</div>';
    }

    html += '<div class="nav">' +
      '<button type="button" data-nav="prev"' + (i === 0 ? " disabled" : "") + '>' + esc(L.back) + '</button>' +
      '<div class="right">' +
      (picked !== undefined
        ? '<button type="button" class="primary" data-nav="next">' +
          esc(i === list.length - 1 ? L.results : L.next) + '</button>'
        : '<button type="button" data-nav="skip">' + esc(L.skip) + '</button>') +
      '</div></div></div>';

    stage.innerHTML = html;
    wire();
  }

  function wire(){
    stage.querySelectorAll("[data-pick]").forEach(function(b){
      b.addEventListener("click", function(){
        answers[key(list[i])] = parseInt(b.getAttribute("data-pick"), 10);
        render();
      });
    });
    stage.querySelectorAll("[data-nav]").forEach(function(b){
      b.addEventListener("click", function(){
        var d = b.getAttribute("data-nav");
        if (d === "prev") i = Math.max(0, i - 1);
        else i = i + 1;
        render();
        window.scrollTo(0, 0);
      });
    });
    stage.querySelectorAll("[data-act]").forEach(function(b){
      b.addEventListener("click", function(){
        var a = b.getAttribute("data-act");
        if (a === "restart"){ answers = {}; order = null; i = 0; build(); }
        if (a === "review"){
          var missed = list.filter(function(q){ return answers[key(q)] !== undefined && answers[key(q)] !== q.a; });
          if (missed.length){ list = missed; answers = {}; i = 0; }
        }
        render();
        window.scrollTo(0, 0);
      });
    });
  }

  function summary(){
    var done = answered(), right = correctCount();
    var missed = list.filter(function(q){ return answers[key(q)] !== undefined && answers[key(q)] !== q.a; });
    var pct = done.length ? Math.round(right / done.length * 100) : 0;

    var html = '<div class="summary">' +
      '<p class="big">' + pct + '%</p>' +
      '<p class="of">' + esc(fmt(L.summary, { right: right, done: done.length })) +
      (done.length < list.length ? " · " + esc(fmt(L.skipped, { n: list.length - done.length })) : "") + '</p>';

    if (missed.length){
      html += "<h2>" + esc(L.revisit) + "</h2><ol>";
      missed.forEach(function(q){ html += "<li>" + esc(q.q) + "</li>"; });
      html += "</ol>";
    }

    html += '<div class="acts">' +
      (missed.length ? '<button type="button" class="primary" data-act="review">' + esc(L.retry) + '</button>' : "") +
      '<button type="button" data-act="restart">' + esc(L.restart) + '</button>' +
      '</div></div>';

    stage.innerHTML = html;
    wire();
  }

  build();
  render();
})();
</script>
</body>
</html>
