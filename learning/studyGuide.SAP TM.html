rt station STA-DLS is the <strong>collect agreement party</strong>. H09 gives the reason for the second choice: the business unit closest to the external customer settles with the external customer, so the ship-to party in Dallas pays the sales organization in Dallas.</p><p>The money then flows as follows (H09, Incoterms; Forwarding Settlements; Freight Settlements):</p><ul><li>The Nuremberg export station pays the carrier for the pre-carriage (Carrier 1 invoices USD 400) and bills the shipper USD 500 through a forwarding settlement document.</li><li>The Rotterdam gateway pays the ocean carrier for the main carriage (USD 2000) and settles internally with the Nuremberg export station.</li><li>The Nuremberg export station recovers the main-carriage cost from the Dallas import station (billing document USD 2200).</li><li>The Dallas import station pays Carrier 3 for on-carriage (USD 400) and bills the ship-to party USD 2800 for main carriage and on-carriage.</li></ul><h2>Internal settlement based on agreed internal rates or on actual carrier costs: the gateway pays its carrier USD 2000 and bills the export station USD 2200 on internal rates (USD 200 profit), or bills USD 2000 on actual costs (no profit)</h2><p>The gateway CFS-RTM receives a carrier invoice of USD 2000 for the main carriage. Two ways to settle internally (H09, Internal Settlements):</p><ul><li><strong>Agreed internal rates.</strong> The gateway bills the export station USD 2200 based on the rates agreed between the organizations. The gateway makes USD 200 profit.</li><li><strong>Actual costs.</strong> The internal settlement document is based on the carrier's actual cost. The gateway bills USD 2000 and makes no profit.</li></ul><p>H09 states both options as possible and does not recommend one over the other. The profit versus pass-through difference is the practical distinction: rates give the gateway a margin, actual cost passes cost through unchanged.</p><h2>Consolidated shipment: the gateway sends an internal settlement document for the main-carriage cost to each internal export organization, based on agreed internal rates (standard agreed rate) or on the cost of execution; for cost-based settlement it uses cost distribution to determine each forwarding order's share of the freight booking cost</h2><p>A consolidated scenario differs from the single shipment: the Rotterdam gateway consolidates several forwarding orders from different organizations in the company, moves them to the Newark import container freight station, which deconsolidates, and the import stations deliver to the ship-to parties. The gateway then sends an internal settlement document for the main-carriage cost to each internal export organization (H09, Consolidated Shipment). Two bases are possible:</p><ul><li><strong>Agreed rates.</strong> The gateway uses a standard agreed rate to settle the cost of each forwarding order it consolidates and ships (see Standard Charge Calculation in the source).</li><li><strong>Freight costs.</strong> The gateway must work out each organization's share of the overall execution cost. It uses cost distribution to distribute the freight booking cost down to the forwarding order level, then uses those distributed costs to create the settlement. H09 refers to Cost Pull for transferring distributed costs from the freight side to the forwarding side.</li></ul><h2>Internal settlement for resources: intercompany settlement (different company codes, posted to SD) versus intracompany settlement (same company code, posted to financial accounting, Intracompany Settlement checkbox on the Org. Data tab), and the prerequisites of an internal agreement with Resource specified and a freight order type enabled for internal settlements</h2><p>This is the fourth business requirement: settling the cost of your own resources (trucks, trailers) used in a freight order. H09's example has a sales organization SALES_1, a resource organization RESOURCE_1 that owns a trailer, a purchasing organization PUR_1 and a carrier CARRIER_1 who provides the truck. The documents are:</p><ul><li>the sales organization's forwarding settlement document for each customer's forwarding order, posted to SD;</li><li>an internal settlement by the purchasing organization against the sales organization, to recover the truck and trailer cost;</li><li>an internal settlement by the resource organization against the purchasing organization, to recover the trailer cost;</li><li>a freight settlement document by the purchasing organization against the carrier, posted to MM and later checked against the carrier's invoice.</li></ul><p><strong>Intercompany versus intracompany.</strong> If the organizations belong to different company codes, the internal settlement is intercompany and is posted to SD, which creates a billing document. If they belong to the same company code, it is intracompany and is posted to financial accounting, which reposts the primary costs to an internal order or cost center. For intracompany settlement you select the <strong>Intracompany Settlement</strong> checkbox on the Org. Data tab page of the company organization (transaction PPOCE) (H09, Internal Settlement).</p><p><strong>Prerequisites for resources (H09, Internal settlement for resources).</strong> The freight order type is enabled for internal settlements, with the internal settlement document type assigned to it. The resource is defined (transaction /SCMTMS/RES01 or the Define Resources app) with its organizational unit set as a sales organization, sales group, sales office or forwarding house. There is an internal agreement between that organizational unit and the business partner of the purchasing organization or group of the freight order, with <strong>Resource</strong> specified in the Resource field on the General Data tab of the internal agreement. The general internal settlement prerequisites also apply. H09 marks these resource features as not yet released.</p><h2>The forwarding settlement document (FWSD): posted to SD to request an invoice, created individually for one forwarding order (FWO) or collectively for several, with tabs General Data, Business Partner, Charges, Orders, Document Flow and Application Log</h2><p>H09 (Forwarding Settlement Document) defines the FWSD as a document posted to SD to request the creation of an invoice for a customer. TM calculates the charges based on a forwarding order (FWO), and posting the FWSD makes SD create the invoice. You can create an individual FWSD for one FWO or a collective FWSD for several FWOs. Credit memos are also triggered from TM and created in SD.</p><p>The FWSD data comes from the FWOs and is organized in tab pages:</p><table><thead><tr><th>Tab</th><th>What it shows</th></tr></thead><tbody><tr><td>General Data</td><td>Invoice date, sales organization, payment terms, total amount, document currency</td></tr><tr><td>Business Partner</td><td>Sold-to party, bill-to party and payer by default; business partner determination fills gaps</td></tr><tr><td>Charges</td><td>Charges per FWSD item, which is an FWO or an FWO item depending on the calculation level in the calculation profile</td></tr><tr><td>Orders</td><td>The FWOs or FWO items being settled</td></tr><tr><td>Document Flow</td><td>Predecessor and successor documents, including the SD billing documents created on posting</td></tr><tr><td>Application Log</td><td>Error and warning messages from posting to internal SD</td></tr></tbody></table><p>Prerequisites include FWSD types and number range intervals, and a forwarding settlement profile assigned to the charges profile of the sales organization used in the forwarding order (H09, Forwarding Settlement).</p><h2>FWSD life cycle statuses (In Process, Ready for Posting, Posted, Posting Started, Cancellation Requested, Canceled, Canceled by Credit Memo) and confirmation statuses (Not Yet Posted, Posting Successful, Posting Failed, Cancellation Successful, Cancellation Failed, Posting Started)</h2><p>The life cycle status shows where the FWSD is in the business process. The confirmation status mainly tracks the integration with SD and shows the result of the last interaction between TM and SD (H09, Forwarding Settlement Document).</p><table><thead><tr><th>Life cycle status</th><th>Meaning</th></tr></thead><tbody><tr><td>In Process</td><td>Information is incomplete or missing</td></tr><tr><td>Ready for Posting</td><td>Ready to post to SD</td></tr><tr><td>Posting Started</td><td>Posted to SD, posting not yet finished</td></tr><tr><td>Posted</td><td>SD successfully created the billing document</td></tr><tr><td>Cancellation Requested</td><td>Cancellation requested from SD, not yet finished</td></tr><tr><td>Canceled</td><td>FWSD and its SD billing document canceled</td></tr><tr><td>Canceled by Credit Memo</td><td>A credit memo for the full FWSD amount was created and posted</td></tr></tbody></table><table><thead><tr><th>Confirmation status</th><th>Meaning</th></tr></thead><tbody><tr><td>Not Yet Posted</td><td>Not yet posted to SD</td></tr><tr><td>Posting Started</td><td>Transferred to SD, SD status not yet known</td></tr><tr><td>Posting Successful</td><td>SD created the billing document</td></tr><tr><td>Posting Failed</td><td>SD failed to create it; you must check why manually</td></tr><tr><td>Cancellation Successful</td><td>SD canceled the billing document</td></tr><tr><td>Cancellation Failed</td><td>SD failed to cancel the billing document</td></tr></tbody></table><p>Reading them together: a life cycle status of Ready for Posting with confirmation Not Yet Posted is a document waiting for you. Posted with Posting Successful is finished. A document stuck in Posting Started with a confirmation of Posting Failed needs investigation.</p><h2>The forwarding settlement process: create the FWSD, review it (invoice preview, deviating bill-to address), transfer with Save and Post, SD confirms billing document creation; cancellation can be requested at any time; failed posting is checked in the Application Log tab or, for external SD, in transaction SXI_MONITOR</h2><p>H09 (Forwarding Settlement, Process) gives four steps:</p><ol><li><strong>Create the FWSD.</strong> Individually or collectively, from the personal worklist, the Forwarding Order Management Overview or the Forwarding Settlement Overview. The system creates it from the FWO data and calculates the charges. FWOs with Incoterms or freight terms are covered. In a collective creation, split criteria can lead to more than one FWSD. Batch creation is available with the Creation and Transfer of Forwarding Settlement Documents function.</li><li><strong>Review.</strong> You can preview the invoice as it would appear in SD, including tax information determined from SD. The preview works at any life cycle status except Posting Started, Posted, Cancellation Requested and Canceled, and the document must be Consistent. You can overwrite the automatically determined address of the bill-to party on the Business Partner tab of the FWO or FWSD, and the SD billing document then carries that deviating address.</li><li><strong>Transfer to SD.</strong> Choose <strong>Save and Post</strong>. With SD on an external SAP S/4HANA or SAP ERP system, the system posts through enterprise services.</li><li><strong>SD confirms billing document creation.</strong> The life cycle status changes to Posted. If it failed, the confirmation status shows posting failed. For an internal SD, check the <strong>Application Log</strong> tab. For an external SD, check the enterprise service message log in transaction <strong>SXI_MONITOR</strong>.</li></ol><p>Cancellation can be requested at any time, even when the status is Posted. If SD cancels the billing document the FWSD becomes Canceled, otherwise it shows the confirmation status Cancellation Failed. You can also create an FWSD for a canceled FWO to recover costs already incurred, by adding charges manually.</p><h2>Manual changes and follow-up FWSDs: changes to payment terms, notes and attachments, charges, invoice date, service date, payer or a deviating bill-to address flag the document as manually changed; a follow-up FWSD proposes the charge amount minus amounts already invoiced and is Inconsistent if the result is zero or negative</h2><p><strong>Manual changes.</strong> If you change an individual FWSD or internal settlement document by hand, the system flags it as manually changed. H09 counts changes to payment terms, notes and attachments, charges, invoice date, service date, payer, and a deviating address for a bill-to business partner. The flag is visible in the personal object worklist for FWSDs. The worklist also shows the <strong>creation method</strong>: Manual, Background Processing, or Change and Background Processing (H09, Forwarding Settlement).</p><p><strong>Follow-up FWSDs.</strong> You can create a second or later FWSD after one already exists. The system:</p><ol><li>copies the charges from the forwarding order (all charge lines as they are, or fixed charges with the rest recalculated, depending on the calculation option in the settlement profile);</li><li>for each charge line, subtracts the amounts already invoiced in earlier, non-canceled FWSDs, and proposes the result as the invoiced amount.</li></ol><p>If the result is negative (customer over-invoiced) or zero (completely invoiced), the follow-up document gets consistency status <strong>Inconsistent</strong>, which blocks transfer to SD until the zero or negative amount is removed. Ways forward: run the background function (program /SCMTMS/CFIR_CREATE_BATCH) if automatic change management is enabled, cancel the existing document and replace it (the FWO must not be Completed), or create a credit memo manually for the over-invoiced amount.</p><h2>Execution-based settlement and the Settlement Basis field of an agreement item: by default TM settles per individual forwarding order; with a settlement basis (route-based, trailer-unit-based, or buyer's consolidation as a variant) the settlement item is the execution document, and its charges are calculated only in the forwarding settlement document</h2><p>By default TM settles per individual forwarding order. An LSP may instead need to settle on how the order was executed. H09 (Execution-Based Settlement) names three criteria: buyer's consolidation, route, and trailer unit. You choose them in the <strong>Settlement Basis</strong> field of the agreement item (route-based and trailer-unit-based) and, for buyer's consolidation, through the BCO setting described in the next item.</p><table><thead><tr><th></th><th>Execution-based settlement</th><th>Forwarding-order-based settlement</th></tr></thead><tbody><tr><td>Settlement item</td><td>Execution document, such as trailer unit or container</td><td>Forwarding order</td></tr><tr><td>Resolution base grouping rule</td><td>Across forwarding orders in the execution document, for execution stages</td><td>In the forwarding order</td></tr><tr><td>Data source (stages, quantities)</td><td>Execution document, such as freight booking item or trailer unit</td><td>As specified in the settlement profile</td></tr></tbody></table><p>In the FWSD the settlement items become the container item of the booking (buyer's consolidation), the trailer unit, or the freight order (route-based). Creating an FWSD for an FWO with an execution-based basis produces one FWSD for all FWOs in the execution document for one customer. Constraints: the forwarding settlement settings are in place, the right basis is on the forwarding agreement item, and the charges for the execution-based stages are calculated only in the FWSD, not in the individual FWO.</p><p><strong>Worked example (H09).</strong> Seven forwarding orders are delivered on one trailer unit. With Trailer Unit empty in Settlement Basis, TM rates and settles each of the seven individually and creates one FWSD with seven line items, even for a collective settlement. With Trailer Unit in the field, you settle on one rate for the trailer unit covering all seven.</p><p>Route-based use case: a customer who wants one agreed rate for the full journey of a truck picking up at several places and delivering to several, not a price per forwarding order.</p><h2>Buyer's consolidation settlement: the BCO setting in the Buyer's or Shipper's Consolidation field, a separate calculation sheet in the agreement item, one consolidated settlement for all forwarding orders in the container item, and a fallback to an agreement line with shipping type FCL</h2><p>In a buyer's consolidation the LSP loads goods from several suppliers of one customer into one container before the main carriage, so it does not charge an LCL rate and passes on the FCL rate for main carriage and on-carriage (H09, Buyer's Consolidation Settlement).</p><p>Prerequisites:</p><ul><li>BCO in the <strong>Buyer's or Shipper's Consolidation</strong> field of the forwarding order on the export side;</li><li>an agreement item for the buyer's consolidated main carriage and on-carriage with a <strong>separate calculation sheet</strong> and BCO in the same field.</li></ul><p>Behavior:</p><ul><li>It is a variant of execution-based settlement: on the export side the main-carriage charges come from the freight booking container item.</li><li>If the container items in the freight booking carry BCO, the system creates <strong>one consolidated settlement for all forwarding orders in the container item</strong> for the main carriage.</li><li><strong>Fallback:</strong> the system looks for an agreement line item with BCO; if none, it looks for an agreement line with shipping type <strong>FCL</strong>.</li></ul><p>Example in H09 (Incoterm EXW): with three pickup locations there are three forwarding orders on the export side. The export business unit bills the import business unit for each pickup and one single FWSD for the main carriage. On the import side, the system copies the forwarding order with a reference to the container item, and the import unit bills the ship-to party for pickups, main carriage and delivery.</p><h2>The freight settlement document (FSD): created for freight orders, freight bookings and service orders (or consignment orders); posting it to MM creates a purchase order for services and a service entry sheet (SES), books accruals, and is the basis for invoice verification or evaluated receipt settlement (ERS, self-billing)</h2><p>H09 (Freight Settlement Document) defines the FSD as the document used for posting freight cost accruals and the basis of invoice verification in MM for freight documents. It can be created for freight orders, freight bookings and service orders (H09 and S4TM3 also mention consignment orders for settlement). Settlement of service orders needs Freight Settlement Integration using MM External Services Management (H09).</p><p><strong>What posting does in MM.</strong> Posting the FSD creates a <strong>purchase order for services</strong> and a <strong>service entry sheet (SES)</strong> with the values of the TM charge lines. The SES confirmation is done at the same time, which creates the financial entries for the freight cost, that is, the accruals. When the carrier invoice arrives, logistics invoice verification in MM (transaction MIRO) checks it against this data. In evaluated receipt settlement (ERS, self-billing) the automatically generated invoice is built from the same data (H09; S4TM3).</p><p>S48600 and S4TM3 add that the purchase order and SES are used for technical purposes, to post accruals, and form the working list for invoice verification. In stage-level charge calculation the PO has as many items as the freight order has stages, and one SES per PO item (S4TM3). The PO and SES can be opened through ME23N or the TM document flow (S4TM3).</p><p>The FSD tabs mirror the FWSD: General Data (document type, settlement date, <strong>procuring company code</strong>, purchasing organization and group, payment terms, <strong>net amount</strong>, currency, <strong>verified invoice amount</strong>), Business Partner (carrier, invoicing party, payee), Charges, Orders, Document Flow (including the PO, SES and invoice in MM), Application Log.</p><h2>The freight settlement process steps: create the FSD (individual, collective, or mass creation with /SCMTMS/SFIR_CREATE_BATCH), review it until it is Consistent and Ready for Accruals, then post it to MM; the settlement date defaults to today's date and the posting runs asynchronously</h2><p>H09 (Freight Settlement, Process) with the exercise E05:</p><ol><li><strong>Create the FSD.</strong> Individually, collectively (several freight orders, service orders or freight bookings), or with <strong>mass creation</strong>: transaction /SCMTMS/SFIR_CREATE (report /SCMTMS/SFIR_CREATE_BATCH). S4TM3 lists /SCMTMS/SFIR_TRANSFER_BATCH as the report for posting FSDs to MM. Separate FSDs can be created per stage of freight orders with non-linear stages, per invoicing carrier in a rail freight order, and per additional agreement party. The <strong>settlement date defaults to today's date</strong>; you can override it through a BAdI or by entering a date in the mass creation function.</li><li><strong>Review.</strong> Check and edit details. After saving, an automatic consistency check runs. If it succeeds, the consistency status becomes <strong>Consistent</strong> and the life cycle status becomes <strong>Ready for Accruals</strong>.</li><li><strong>Post to MM.</strong> Choosing Post sends the data to MM, including source and destination location for each stage so MM can determine tax rates. The posting runs <strong>asynchronously</strong>. The settlement date becomes the document date of the purchase order and the posting date of the SES.</li></ol><p><strong>What you see in the exercise (E05, Create and Post a Freight Settlement Document and Verify the Invoice).</strong> The FSD for freight order 200000109 shows Ready for Accruals and confirmation Not Posted. After Post, the life cycle status goes to Posting Started with confirmation Not Confirmed, and after Refresh to Posted and Confirmed. The Document Flow shows freight order, freight unit, outbound deliveries and sales orders before the FSD, and the purchase order and SES after it. The carrier invoice is then posted in transaction MIRO (company code 1010, invoice date, freight order number, tax code V1, amount 1961,62 EUR, with a remaining balance of 0,05 EUR). After posting, the FSD shows <strong>Invoice Verified</strong>.</p><h2>FSD life cycle and confirmation statuses (In Process, Ready for Accruals, Posting Started, Posted, Invoice Verified, Cancellation Requested, Canceled, Reversal Requested, Reversed, Credit Memo Created; Not Posted, Not Confirmed, Confirmed, Posting Failed and the specific failure statuses)</h2><p>From H09 (Freight Settlement Document):</p><table><thead><tr><th>Life cycle status</th><th>Meaning</th></tr></thead><tbody><tr><td>In Process</td><td>Not yet ready to post to MM</td></tr><tr><td>Ready for Accruals</td><td>Ready for you to post accruals in MM</td></tr><tr><td>Posting Started</td><td>Posting initiated, not yet complete</td></tr><tr><td>Posted</td><td>Posted successfully; PO and SES created in MM</td></tr><tr><td>Invoice Verified</td><td>At least one invoice has been posted against the FSD in MM</td></tr><tr><td>Cancellation Requested</td><td>Cancellation requested, not yet complete</td></tr><tr><td>Canceled</td><td>You canceled the FSD</td></tr><tr><td>Reversal Requested</td><td>Reversal requested, posting of the reversal not complete</td></tr><tr><td>Reversed</td><td>Reversed in MM</td></tr><tr><td>Credit Memo Created</td><td>A credit memo posted against a reversed FSD in MM</td></tr></tbody></table><table><thead><tr><th>Confirmation status</th><th>Meaning</th></tr></thead><tbody><tr><td>Not Posted</td><td>Not yet posted to MM</td></tr><tr><td>Not Confirmed</td><td>Posting initiated, not complete</td></tr><tr><td>Confirmed</td><td>Posted successfully to MM</td></tr><tr><td>Posting Failed</td><td>Posting to MM not successful</td></tr><tr><td>No Confirmation</td><td>Posted but MM status not yet known</td></tr><tr><td>Cancellation Posting Failed, Reversal Failed</td><td>Cancellation or reversal posting failed</td></tr><tr><td>Purchase Order Creation Failed, SES Creation Failed</td><td>The failed step when posting; see the Application Log tab</td></tr><tr><td>SES Cancellation Failed, Purchase Order Cancellation Failed, SES Reversal failed</td><td>The failed step when canceling or reversing</td></tr><tr><td>Cost distribution document creation failed, cancellation failed, reversal failed</td><td>The settlement management documents with cost distribution data could not be created, canceled or reversed</td></tr></tbody></table><p>Note that S48600 and the carrier-invoice conditions text refer to the FSD status as <strong>Accruals Posted</strong>, while H09 names the status <strong>Posted</strong>; read them as the same state.</p><h2>Prerequisites for freight settlement: FSD types and number range intervals, and a freight settlement profile assigned to the business partner (carrier role) and purchasing organization; the procuring company code books the accruals and the plant is needed for the service purchase order</h2><p>H09 (Freight Settlement, Prerequisites) and S48600 (Freight Settlement Document Creation - Configuration):</p><ul><li><strong>FSD types and number range intervals</strong> are defined in Customizing. When FSD creation is triggered for a freight order or freight booking, its document type determines the FSD type (S48600).</li><li><strong>A freight settlement profile</strong>, assigned to the business partner (BP role Carrier, Vendor Org. Data for the relevant purchasing organization, Additional Settings, FSD Profile ID) and to the charges profile of the purchasing organization. When a freight order is created the system checks first the business partner of the purchasing organization, then the charges profile. If no profile is found in either, an error is shown when you create the freight order. The purchasing organization in the freight document determines the settlement profile (S48600).</li></ul><p><strong>Company code and plant (H09, Company Code and Plant in Posting Freight Settlements).</strong> The company code books the freight accruals to financial accounting. The plant is required to create the service purchase order during posting.</p><ul><li>The <strong>procuring company code</strong> is responsible for procuring the transportation service. It is taken from the freight document (General Data, Organizational Data), and is determined automatically if a unique company code is assigned to the purchasing organization. It is determined only when the order type is relevant for subcontracting and subcontracting checks are set. It then carries over to the FSD.</li><li>For the <strong>plant</strong>, the system uses (in order) the plant from the FSD type Customizing (Assign Purchasing Information for Posting), the unique plant of the underlying orders and deliveries from the linked freight units, or the default plant for the company code. When the procuring company code is mandatory for subcontracting, SAP recommends not specifying the plant in Assign Purchasing Information for Posting, so company code and plant can be determined more flexibly.</li></ul><h2>Reversing an FSD and changes after posting: reversal is only possible in life cycle status Invoice Verified and ends with a credit memo through transaction MRRL; added or changed charges lead to Partially Invoiced (new FSD) or Over Invoiced (credit memo or reverse and repost)</h2><p><strong>Reversal (H09, Reversing a Freight Settlement Document).</strong> The typical case: you use self-billing (ERS) with a close carrier, accrued the cost and created a self-billing invoice, and then the carrier does not deliver (for example a vehicle breakdown) or TM holds incorrect prices. You can only reverse the FSD when its life cycle status is <strong>Invoice Verified</strong>.</p><table><thead><tr><th>Step</th><th>Module</th><th>Result</th><th>FSD status</th></tr></thead><tbody><tr><td>Choose Reverse Document in the FSD</td><td>TM</td><td>Reversal initiated; an SES with a returns flag for the full FSD value is created</td><td>Reversal Requested</td></tr><tr><td>MM creates the reversal posting</td><td>MM</td><td>Reversal posting of the accruals with a returns indicator on the SES</td><td>Reversed</td></tr><tr><td>Run transaction MRRL (ERS with Logistics Invoice Verification), entering the TM freight order number</td><td>MM</td><td>Credit memo reverses the previously posted invoice</td><td>Credit Memo Created</td></tr></tbody></table><p>TM then sets the invoicing status of the freight order to <strong>Not Invoiced</strong>, and you can create a new FSD for it.</p><p><strong>Changes after posting accruals (H09, Changes After You Post Accruals; S48600, Freight Settlement - Updates).</strong> You can add or change charge amounts directly in the existing freight order, freight booking or service order after accruals are posted, and transfer them to MM. S48600 gives the business reason: accruals are posted when liability is known, but diversions, lost cargo, detention, demurrage, tolls and similar may only become known later or at invoicing.</p><ul><li>With <strong>automatic change management</strong> enabled, the background function Creation and Transfer of Freight Settlement Documents (/SCMTMS/SFIR_CREATE_BATCH) creates, changes and posts FSDs that contain the changes.</li><li>Without it: if the amount makes the invoicing status <strong>Partially Invoiced</strong>, create a new FSD for the delta. If it becomes <strong>Over Invoiced</strong>, create a credit memo in TM to send the changed amounts to MM, or cancel the existing FSD (possible only when its status is not Invoice Verified, and the freight order is not Completed) and create a new one with the full amount. Posting the new FSD or credit memo creates a new PO and SES.</li><li>A follow-up FSD works like the follow-up FWSD: charges are copied, previously accrued amounts subtracted, and a zero or negative result gives consistency status <strong>Inconsistent</strong>, blocking posting.</li></ul><p><strong>Source difference.</strong> S48600 says the FSD change process is configured in the settlement profile and that, when an order changes and the invoicing status becomes Over Invoiced, the system automatically applies a <strong>reverse and repost</strong> strategy. H09 describes the credit memo or cancel-and-replace options when automatic change management is off. Both can be true under different settings, but the material does not reconcile them in one place.</p><p>Further H09 rules: you cannot change or delete a charge line with invoicing status Invoice Verified, and for Invoice Verified documents a new charge line produces a new FSD, PO and SES only for the delta. Under the lean services integration the previous FSD, PO and SES are canceled and a new FSD with the updated amount is posted.</p><h2>Cost distribution for shippers: freight cost is distributed to the order or delivery item level when the FSD is created and posted; MM gets one purchase order and SES for the net amount while a settlement management document carries the distributed amounts</h2><p>H09 (Cost Distribution for Shippers): the shipper's orders and deliveries create freight units, planned in freight orders, and an FSD posts the transportation cost to MM for accruals and invoice matching. The distribution must be at the level of order/delivery item in the FSD, and the system does it when the FSD is created and posted.</p><p><strong>Worked example (H09).</strong> A freight order with two deliveries has a net amount of USD 1000, distributed USD 700 to product 1 (delivery 1) and USD 300 to product 2 (delivery 2). On posting the system:</p><ol><li>creates one purchase order for <strong>USD 1000</strong> and one SES for USD 1000;</li><li>creates a <strong>settlement management document</strong> with each product as an item carrying its distributed amount, USD 700 and USD 300.</li></ol><p>Settlement management uses the underlying sales order and delivery information to find the cost object to post against. For an outbound delivery linked to a sales order, it copies references and the linked delivery items, copies product and quantity, copies the account assignments (cost center, profit center, CO-PA segment or internal order) from the sales order item, and copies the distributed amounts.</p><p>H09 also describes the same pattern in the Posting of Allocated Freight Costs section with USD 1845 split into 800 and 1045. There, the SES posts the total to an intermediate freight clearing account (offset key GBB), while the freight cost allocation document allocates to material valuation (inbound) or a general ledger expense account (outbound). The apps Manage Freight Cost Allocation Documents and Monitor Freight Cost Allocation Document Items let you review them, and the system normally releases the documents to accounting automatically.</p><p>S4TM3 and S48600 summarize the flow as: deliveries create freight units, freight orders are planned, charges are distributed to delivery items, the FSD is created, and posting creates PO and SES for invoice verification plus a settlement document for CO-PA, CO or material valuation.</p><h2>Cost distribution configuration: enabled in the document type, distribution profiles assigned through the charges profile, methods Direct and Hierarchical, rule basis Gross Weight, Gross Volume, Net Weight or Distance times Weight, and viewing of posted data with WLFLTM2</h2><p>S48600 (Cost Distribution) gives the configuration summary:</p><ul><li>Cost distribution is <strong>enabled in the document type</strong> Customizing.</li><li>A <strong>distribution profile</strong> (method, rule, level) is assigned to the organizational unit through the <strong>charges profile</strong> (H09 adds: and the charges profile is assigned to the purchasing organization on the Org. Data tab in the organizational model).</li><li><strong>Methods:</strong> <em>Direct</em> distributes charges to the line items by the chosen rule regardless of packaging hierarchy, normally when all charges can be distributed to delivery line items by gross weight or volume. <em>Hierarchical</em> works step by step through each packaging level, used when the resolution base includes containers or rail cars, so other charges go to the container level first and then to the line item level.</li><li><strong>Rule basis:</strong> Gross Weight, Gross Volume, Net Weight, Distance times Weight.</li><li><strong>Distribution level:</strong> the target level, forwarding order or order/delivery item.</li><li><strong>Viewing posted data:</strong> transaction <strong>WLFLTM2</strong> or Display Cost Distribution Documents, searchable by FSD number.</li></ul><p>H09 adds limits: internal cost distribution cannot be enabled for a freight booking, and a document mixing forwarding order items and order/delivery items can only be distributed to one level. Charges can also be assigned directly (for example packaging and labeling of a specific product), in which case the rule has no influence (H09).</p><h2>Billing freight costs to customers: distributed costs per delivery item can be added to the SD billing document, which needs SD integrated with TM, one freight order for the delivery and one currency</h2><p>A seller who takes responsibility for delivery can pass transport costs on. TM is set up to distribute freight cost to delivery items, and the distributed cost per delivery item is added to the amount in the SD billing document (H09, Billing the Freight Cost in TM to a Customer in SD; S48600, Billing Freight Costs). It involves freight orders in TM and pricing and billing in SD.</p><p><strong>Conditions:</strong> SD must be integrated with an internal TM component, there is one freight order document for the delivery, and the freight order has only one currency for the cost.</p><p><strong>Worked example (H09).</strong> Freight order with two deliveries, gross weights 2,250 kg and 2,750 kg. Charges: base freight 1,000 and fuel surcharge 250 (both at Root), packaging 50 for product 1 and 100 for product 2. Distribution by gross weight gives delivery 1: 450 base freight + 112.50 fuel + 50 packaging = 612.50; delivery 2: 550 + 137.50 + 100 = 787.50. The SD billing document uses 612.50 and 787.50 USD for the two delivery items.</p><p><strong>In the exercise (E05):</strong> the Cost Distribution tab shows delivery 80000175 covers 390.15 EUR, the handling charge assigned fully to it and others allocated by gross weight. Creating the billing document with the Create Billing Document app shows pricing element FB00 representing freight charges of 390,15 EUR taken over from the freight order or FSD.</p><h2>Self-billing (ERS) versus invoice submission by the carrier, the automatic dispute case created for a carrier invoice that differs from the freight order, and the conditions for posting carrier invoices to MM</h2><p>H09 (Dispute Management for Freight Settlements) and S48600 describe two freight settlement processes between a shipper and a service provider:</p><ul><li><strong>Self-billing (ERS):</strong> the service provider does not submit an invoice; you settle automatically on the information in your freight order.</li><li><strong>Invoice submission:</strong> the provider submits an invoice and you pay the amount in it. In TM this uses enterprise services: the provider creates an invoice in its external system and sends it, and you use it to create a <strong>carrier invoice</strong> in TM.</li></ul><p>In both there can be differences between what you expect to pay and what the provider expects. In invoice submission TM evaluates the external invoice automatically. If values differ (unplanned costs, different charges, changed logistics data), TM <strong>creates a dispute case</strong> automatically, linked to the carrier invoice, and captures each charge difference as a dispute item. If nothing differs, no dispute case is created. As shipper you approve or reject the dispute case (Dispute Cases Worklist app). Approving updates the freight order's charge information such as rate and quantity, but <strong>not</strong> logistics information such as gross weight, gross volume or total distance. Benefits named: changes and unplanned costs go into one invoice, and payment is accurate.</p><p><strong>Typical steps (H09):</strong></p><ol><li>TM creates an FSD for a freight order and posts it to MM, creating the PO and SES.</li><li>The provider submits an invoice by enterprise services; TM creates the carrier invoice and, if needed, the dispute case.</li><li>You accept or reject. Rejecting the carrier invoice closes any open dispute case and sets the carrier invoice to Rejected; you can add a note with the reason.</li><li>Accepting the dispute case updates the freight order with the new charges, and the background function Creation and Transfer of Freight Settlement Documents moves the changes to MM.</li><li>The background function <strong>Posting of Carrier Invoices</strong> transfers ready carrier invoices to MM, creating an incoming invoice.</li></ol><p><strong>Conditions for posting a carrier invoice to MM:</strong></p><ul><li>no dispute case exists, or it has life cycle status <strong>Resolved</strong>;</li><li>the carrier invoice is not <strong>Rejected</strong>;</li><li>all associated freight orders have invoicing status <strong>Completely Invoiced</strong>;</li><li>all associated FSDs have reached the accrual-posted status (named Accruals Posted in the source);</li><li>the carrier invoice is <strong>Not Blocked</strong>;</li><li>the carrier invoice is <strong>Consistent</strong>.</li></ul><p>H09 also notes that dispute management applies a tolerance check configured in Customizing; a dispute case that fails the tolerance limits must be reviewed manually.</p><section class="practice"><h2>Practice</h2><p>Create a one-page settlement map for a shipper and an LSP in your own words. For each settlement document (forwarding, freight, internal) list who creates it, what it is based on, which module it is posted to, and the statuses that show it is finished. Add one worked example of a freight order with cost distribution, such as the USD 1000 split into USD 700 and USD 300.</p></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain to a finance controller, without notes, how a freight order becomes a freight settlement document, accruals and a verified carrier invoice, and when a forwarding or internal settlement document is used instead?</p></section>` },
  { n:"11", title:"Warehouse and Trade Integration (EWM, Advanced Shipping and Receiving, GTS)", html:`<h2>Overview</h2><p>Transportation does not start at the truck. Goods are picked and packed in a warehouse, trucks queue at a gate and use a door, customs clearance may be needed before the truck can leave, and the shipper wants to see where the cargo is. This session covers how TM connects to those worlds: Advanced Shipping and Receiving (Advanced SR) with Extended Warehouse Management (EWM) and the other warehouse components, SAP Event Management for tracking, and SAP Global Trade Services (GTS) for compliance and customs. The thread running through it is status: at each step one status changes, and the status tells you who is responsible for the cargo, TM or the warehouse (H11, E04).</p><h2>The integration landscape of TM: logistics integration of orders and deliveries, integration with settlement, Advanced Shipping and Receiving, Extended Warehouse Management (EWM), SAP Event Management (SAP EM) and SAP Global Trade Services (SAP GTS); Document Information Extraction extracts data from delivery documents attached to a consignment order</h2><p>H11 (Integration) lists what TM can be integrated with:</p><table><thead><tr><th>Application</th><th>Integration</th></tr></thead><tbody><tr><td>Logistics Integration</td><td>Integration of orders and deliveries</td></tr><tr><td>Settlement</td><td>Forwarding settlement and freight settlement (see Session 10)</td></tr><tr><td>Advanced Shipping and Receiving</td><td>Integrated end-to-end process to send, receive and transport products</td></tr><tr><td>Extended Warehouse Management</td><td>Integration with EWM</td></tr><tr><td>SAP Event Management</td><td>Tracking of execution status</td></tr><tr><td>SAP Global Trade Services</td><td>Customs processing and trade compliance</td></tr></tbody></table><p>H01 (Integration) adds the descriptions: SAP EM is used for event tracking to monitor the execution status of transportation; for SAP GTS you can request export declarations for freight orders or freight bookings, with data transferred by enterprise services. It also lists <strong>Document Information Extraction</strong>, a service that extracts data from delivery documents attached to a consignment order (H01 points to AI-Assisted Goods Receipt Analysis for details). H01 further notes that PS&amp;S Services support dangerous goods, and that TM can integrate with external systems through enterprise services, for example to create and confirm forwarding orders automatically from data received from ordering parties.</p><p><em>What the material does not establish:</em> H01 and H11 only name Document Information Extraction in one line; the corpus does not describe how it works.</p><h2>Advanced Shipping and Receiving (Advanced SR) is an integrated end-to-end process to send, receive and transport products, covering mixed and multi-warehouse scenarios in one freight order and the steps from the truck's arrival at the gate to the final goods receipt; it is also supported for rail freight orders</h2><p>H11 (Advanced Shipping and Receiving) describes Advanced SR as an integrated, end-to-end process that lets users send, receive and transport products. It supports <strong>mixed and multi-warehouse scenarios within one freight order</strong> and helps coordinate the steps from the arrival of the truck at the gate to the final goods receipt in the warehouse. A truck that has posted arrival at a checkpoint can do both loading and unloading at a location, or deliver goods at several warehouses at the same location. The process is also supported for rail freight orders.</p><p>In practice this means the freight order becomes the working document of the yard and the gate: check-in, door assignment, loading or unloading, goods movement, check-out, all reported on the freight order (see the end-to-end process below).</p><h2>Advanced SR connects TM, EWM, Stock Room Management (STRM), MM-IM and Logistics Execution (LE) through a harmonized data model, the EDIFACT standard for EDI messages and dedicated apps; MM and SD are needed to create transportation requirements</h2><p>H11 states that Advanced SR simplifies communication between TM, EWM, Stock Room Management (STRM), Inventory Management and Physical Inventory (MM-IM) and Logistics Execution (LE). Three means are named:</p><ol><li>a <strong>harmonized data model</strong>;</li><li>the <strong>EDIFACT standard</strong> applied to EDI messages;</li><li><strong>dedicated apps</strong>, plus expanded existing apps and RF transactions for shipping and receiving.</li></ol><p>Information moves between the components so users can see the status of the products during the process. <strong>Materials Management (MM) and Sales and Distribution (SD) are needed to create transportation requirements.</strong></p><h2>The warehouse management applications that can be integrated in the same system: Lean Warehouse Management (inventory at storage location level, needs a placeholder warehouse), Stock Room Management (small or low-complexity warehouses) and EWM; a freight order can contain EWM-managed and IM-managed storage locations</h2><p>H11 (Storage Location) says the freight order can contain both EWM-managed and IM-managed storage locations, for example at a production location, and the two storage locations can share a loading point. In Advanced SR you can integrate TM with three warehouse applications in the same system:</p><table><thead><tr><th>Application</th><th>Described in H11 as</th></tr></thead><tbody><tr><td>Lean Warehouse Management</td><td>A very simple warehouse where inventory management takes place solely at storage location level. You must create a <strong>placeholder warehouse</strong> that ensures the document flow in TM</td></tr><tr><td>Stock Room Management</td><td>For small warehouse operations and warehouse operations with low complexity</td></tr><tr><td>Extended Warehouse Management</td><td>Flexible, automated support for processing goods movements and managing stocks in a warehouse complex</td></tr></tbody></table><h2>Integration based on the freight order does not use the EWM transportation unit (TU) or the EWM vehicle; it can run in parallel with integration based on the EWM TU, and warehouse-driven outbound processes start in EWM</h2><p>H11 (Integration Based on Freight Order): the Advanced SR process is based on the <strong>freight order</strong> and does <strong>not</strong> use the EWM transportation unit (TU) or the EWM vehicle. The two integration approaches, based on the freight order and based on the EWM TU, <strong>can run in parallel</strong>. For warehouse-driven outbound processes, you start in EWM. The EWM-TU-based integration rests on two objects, the TU on the EWM side and the freight order on the TM side. H11 refers to SAP Note 3289977 for restrictions.</p><p><em>What the material does not establish:</em> the reason why Advanced SR chose the freight order over the EWM TU is not stated in the sources read, only the fact. The EWM-TU-based integration has its own sections in H11 that this session does not cover.</p><h2>Consignment orders group transportation requirements by criteria such as source and destination location, delivery date and time and business partner; they can be created from inbound messages or manually, serve as the basis of communication between partners, support subcontracting, charge calculation, settlement and tracking but not tendering, and can be assigned to only one freight order at a time</h2><p>H11 (Consignment Orders; Consignment Order):</p><ul><li><strong>What it groups.</strong> Transportation requirements (freight units or package units based on sales orders, scheduling agreements or deliveries) with the same source and destination location, the same delivery date and time, and the same business partners (shipper, consignee, carrier). It contains only one linear transportation stage and one shipper and one consignee.</li><li><strong>Role.</strong> The consignment order gets an ID that serves as a reference between partners, for example a supplier telling the ordering party what will be delivered where and when.</li><li><strong>What you can do with it.</strong> Subcontracting, charge calculation, settlement with the carrier and shipment tracking. <strong>Tendering is not possible</strong> based on a consignment order. You choose in Customizing (order types) whether such functions run on the freight order or the consignment order.</li><li><strong>Assignment.</strong> It can be assigned to only one freight order at a time and must be completely assigned. A freight order can contain several consignment orders. It can also be assigned to a transportation unit that contains a matching stage.</li><li><strong>Creation.</strong> Manually (Create Consignment Order app), from an inbound message such as an advanced shipping notification via EDI, or by automatic consignment building through the consignment building profile. Creation based on top-level packages gives one consignment order per handling unit, with grouping rule TOP_CARGO.</li></ul><h2>Decentralized EWM and TM: transportation logistics based solely on an outbound delivery from a sales order, embedded in S/4HANA, with the outbound delivery process either transport-driven or warehouse-driven; only the outbound process is supported, inbound features and Dangerous Goods integration are not, and SAP GTS can be integrated</h2><p>H11 (Advanced SR for Decentralized EWM and TM): this deployment option is outbound-delivery-based. It lets you conduct transportation logistics solely on the basis of an outbound delivery stemming from a sales order, and it is embedded in SAP S/4HANA. It requires integration between TM and EWM, and EWM integration with an ERP system. The outbound delivery process can be <strong>transport-driven or warehouse-driven</strong>. To manage foreign-trade activities and compliance, you can integrate with SAP GTS.</p><p><strong>Restriction (H11):</strong> only the outbound process is enabled. Inbound features in Advanced SR are not supported, and integration of Dangerous Goods is not supported. Supported ERP systems: SAP ERP 6.0 (EhP7 or higher) and SAP S/4HANA. A setup guide is in SAP note 3225241.</p><h2>Prerequisites and master data: the source or destination location (location type 1003, shipping point) must be flagged relevant for Advanced SR, a location of type 1200 (loading point) must be defined, STRM or Lean WM doors must be assigned to EWM doors or loading points when doors are shared (not needed for EWM-only scenarios), and Customizing is done under Integration</h2><p>H11 (Prerequisites for Advanced Shipping and Receiving) lists the master data you must have before a location can be used:</p><ol><li>In the location master data, <strong>activate Advanced SR</strong> by flagging the source or destination location (<strong>location type 1003, shipping point</strong>) as relevant for Advanced SR. Mandatory.</li><li><strong>Define a location of type 1200 (loading point).</strong> Mandatory.</li><li><strong>Assign STRM or Lean WM doors to EWM doors or loading points.</strong> Mandatory for all scenarios with shared doors and multiple warehousing components. Not needed when only EWM is used. For EWM-only scenarios, doors are assigned in the EWM app Assign Storage Bin to Door.</li><li>Customizing under Integration (for decentralized EWM and TM, under Integration, Logistics Integration, Decentralized EWM-TM Integration; related BAdIs are under Integration, Advanced Shipping and Receiving).</li></ol><h2>Detailed organization of loading and unloading: a loading point or unloading point is a location in the master data that represents a group of doors; the app Assign STRM Doors to EWM Doors or Loading Points replaces an STRM or Lean WM door with the assigned EWM door, with the stated restrictions</h2><p>A loading point or unloading point is defined in the master data as a location and represents a group of doors where goods are delivered or picked up. This gives more control over where trucks load or unload when a large warehouse has several points and doors and uses more than one warehousing component (H11).</p><p>The app <strong>Assign STRM Doors to EWM Doors or Loading Points</strong> (H11, Assignment of STRM Doors to EWM Doors or Loading Points):</p><ul><li>If an STRM or Lean WM warehouse and an EWM warehouse share a door in one building, assigning the STRM or Lean WM door to the EWM door makes the system use the EWM door as the main door and <strong>replace</strong> the STRM or Lean WM door with it in the warehouse loading or unloading stop details. If the EWM door already has a loading or unloading point, the EWM point overwrites any existing assignment.</li><li>You can change the assigned door only if it is shared by the same pair of EWM and STRM or Lean WM warehouses.</li><li>You can assign STRM or Lean WM doors to loading or unloading points if they are not already assigned to one.</li></ul><p><strong>Restrictions (H11):</strong> for Lean WM you need a placeholder warehouse with one loading or unloading point and one warehouse door; one STRM or Lean WM door can be assigned to only one EWM door, and one EWM door cannot be assigned to several STRM or Lean WM doors; one loading or unloading point can be assigned to only one STRM or Lean WM door.</p><h2>The end-to-end process between customer and supplier: scheduling agreement and schedule lines create freight units, a release sends a call off by IDoc, the supplier creates outbound deliveries and warehouse activities, plans a road freight order and consignment orders, checks the truck in, loads, posts goods movement and sends an advanced shipping notification (ASN); the customer's system creates a consignment order from the ASN and blocked inbound deliveries that are unblocked when the warehouse processing status is set to Ready for Warehouse Processing</h2><p>H11 (End-to-End Process (E2E) for Advanced Shipping and Receiving) is an example where both customer and supplier use TM. If the systems are not integrated, the inbound or outbound process can be used separately.</p><p><strong>Customer side, inbound, start.</strong></p><ol><li>Create a purchasing document in MM (purchase order or scheduling agreement). In the scheduling agreement item you can add a TM loading or unloading point.</li><li>Create schedule lines. For each schedule line the system creates one or more freight units in TM.</li><li>Create a scheduling agreement release. The system creates IDocs and sends a <strong>call off</strong> to the supplier's system.</li></ol><p><strong>Supplier side, outbound.</strong></p><ol><li>Create outbound deliveries in LE and EWM. The storage location in the delivery defines the kind of warehouse (for example EWM-managed). The TM Status tab of the delivery shows the assigned freight units.</li><li>Perform warehouse activities: picking and possibly packing, creating handling units or cross-delivery HUs (Load or Unload Freight Orders app). Then the TM process begins.</li><li>Create a road freight order (Create Road Freight Order or Transportation Cockpit app).</li><li>Create consignment orders, manually or automatically.</li><li><strong>Check-in at the gate</strong> in the freight order. After check-in, assign doors (loading point and warehouse door), load cargo, set the execution status and <strong>post goods movement</strong>, which updates the warehouse system whatever kind it is. The freight order shows an overall status overview on the Advanced SR tab.</li><li><strong>ASN.</strong> The system sends an advanced shipping notification, a web service based on the consignment order, from the supplier to the customer. The supplier can also inform the carrier.</li></ol><p><strong>Customer side, inbound.</strong></p><ol><li>When the ASN arrives, the customer's system creates a <strong>consignment order</strong> with a reference to the supplier's external order number. Freight units are assigned using criteria such as purchasing reference, supplier or material number.</li><li>The system can create <strong>inbound deliveries</strong> in LE and EWM; these are <strong>blocked</strong>.</li><li>Create a road freight order based on the consignment order stage (or automatically when the carrier sends the freight order as a load message). Set Set to Ready for Transportation Execution.</li><li>At the <strong>gate</strong>, compare the truck's transport documents with the freight order. Packages from EDI messages are fixed automatically (load plan status Finalized). Discrepancies can be corrected directly in the business document. Assign doors and unloading point.</li><li>After check-in is finished, set the <strong>warehouse processing status to Ready for Warehouse Processing</strong>. The EWM delivery is <strong>unblocked</strong> and warehouse activities such as unloading and goods movement can start.</li></ol><h2>Transport-driven versus warehouse-driven outbound process in decentralized EWM and TM: in the transport-driven process the outbound delivery order is blocked until planning is complete and is released when the freight order status changes from In Process to Ready for Warehouse Processing; in the warehouse-driven process warehouse activities come first and the status is set to Ready for Shipping in the EWM outbound delivery order after planning</h2><p>H11 (Decentralized EWM and TM Outbound Process and Integration; Transport-Driven Execution). Common start: the shipper creates an outbound delivery in LE from a sales order, the ERP system passes it to the decentralized system where EWM creates an <strong>outbound delivery order</strong>, and EWM replicates it to TM, which creates <strong>freight units</strong> from it. TM can then propose a plan. From there, one side leads.</p><table><thead><tr><th></th><th>Transport-driven</th><th>Warehouse-driven</th></tr></thead><tbody><tr><td>First step</td><td>Transportation planning</td><td>Warehouse activities (picking, packing)</td></tr><tr><td>State of the outbound delivery order</td><td>Blocked for processing until planning is complete</td><td>Not blocked; the warehouse proceeds on creation</td></tr><tr><td>What releases / hands over</td><td>You change the freight order status from In Process to <strong>Ready for Warehouse Processing</strong>; this releases the delivery order and TM tells EWM</td><td>EWM reports the delivery status to TM on completion; after planning you set <strong>Ready for Shipping</strong> in the EWM outbound delivery order</td></tr><tr><td>Execution</td><td>Same for both: set arrival and check-in, load in EWM, set Goods Movement to Goods Issued to report departure</td><td></td></tr></tbody></table><p>H11 (Transport-Driven Execution) adds that the transport-driven process is enabled automatically when a delivery meets the criteria defined in Customizing (warehouse number, shipping point, delivery type), and that the warehouse processing status must be set to Ready for Warehouse Processing manually. E04 states the principle: in the integration between warehousing and transportation one side must always lead the process.</p><h2>Warehouse loading stops and warehouse unloading stops: detailed stops with warehouse number, loading or unloading point and warehouse door, derived from predecessor documents or created manually, shown on the Overview tab and in the transportation cockpit, with items packed into different mixed packages when their warehouse number or point differs</h2><p>H11 (Delivering Goods to Several Warehouses Within a Location). In Advanced SR one road freight order can serve several warehouses at the same location. The detail is carried by the <strong>warehouse loading stop</strong> (source location) or <strong>warehouse unloading stop</strong> (destination location): the exact warehouse number, loading or unloading point and warehouse door the truck must drive to. This is why they are needed: at the gate the driver learns where to deliver, from predecessor documents or on the spot.</p><ul><li>They can be added to road freight orders, consignment orders, freight units and transportation units. All items of a road freight order must be assigned to one.</li><li>The system can <strong>derive</strong> them from predecessor documents (sales order, scheduling agreement), or you create or change them manually on the Loading Details or Unloading Details tab of the Overview. If the planned door is occupied you can enter a new one; the predecessor document is not updated.</li><li>A stop may have substops. You can update derived stops with the door actually used. The Advanced SR tab shows planned and actual details.</li><li>The transportation cockpit shows warehouse numbers, points and doors; with several substops it shows <strong>Multiple</strong>.</li><li><strong>Package building:</strong> items with different warehouse numbers or loading or unloading points, or none defined, go into different mixed packages.</li></ul><h2>Status management in Advanced SR: Warehouse Door Status (Arrived at Door, Departed from Door) and Warehouse Processing Status (Not Determined, Not Started, Ready for Warehouse Processing, In Process, Completed), whose meaning differs between inbound and outbound</h2><p>H11 (Explanation of Statuses).</p><p><strong>Warehouse Door Status</strong> shows whether a door is physically occupied. It is set manually or automatically at the level of the warehouse loading or unloading stop, and can be reversed if set wrongly.</p><ul><li><strong>Arrived at Door:</strong> the truck has reached the door, which is now occupied. It can be set only if the door is not occupied, for one stop at a time, and only if the <strong>handling execution status of the stop is Checked In</strong>. The event Arrival at Door is reported. With the Allow Multiple Door Assignments checkbox on a loading point, the occupancy check is skipped.</li><li><strong>Departed from Door:</strong> loading or unloading finished and the truck has left; the door is available again. It is set automatically if you set the handling execution status directly to Checked Out or Departed. The event Departure from Door is reported.</li></ul><p><strong>Warehouse Processing Status</strong> is from TM's perspective. In the inbound process it controls the <strong>handover of responsibility for the cargo from TM to the warehouse</strong>. In the outbound process it tracks whether cargo is ready to ship; once ready, TM can start loading or follow-on processes such as subcontracting and customs declarations.</p><table><thead><tr><th>Value</th><th>Inbound</th><th>Outbound</th></tr></thead><tbody><tr><td>Not Determined</td><td>Initial value</td><td>Initial value</td></tr><tr><td>Not Started</td><td>Truck documents not yet checked against system; warehouse inbound delivery is blocked</td><td>Optional, not relevant to TM; planning can start regardless, but waiting for Completed is recommended</td></tr><tr><td>Ready for Warehouse Processing</td><td>Documents match at the gate; set it to transfer responsibility from TM to the warehouse; the delivery is unblocked and changes to items in TM are limited</td><td>Optional; same recommendation</td></tr><tr><td>In Process</td><td>Optional; responsibility already handed over</td><td>The warehouse is working on the cargo; you can start cargo planning but cannot change items</td></tr><tr><td>Completed</td><td>Optional; warehouse activities such as repackaging are not relevant to transportation</td><td>The cargo is ready to ship; <strong>responsibility transfers from the warehouse to TM</strong></td></tr></tbody></table><p>There are also aggregated values at header level (Partially Ready for Warehouse Processing, Partially in Process, Partially Completed) and <strong>In Transit</strong>, relevant only to stock transport orders. Goods movement can be triggered from TM only after Ready for Warehouse Processing for inbound, and after Completed for outbound (H11, Statuses in the Goods Movement Process).</p><h2>The integrated warehouse and transportation execution steps in the Fiori exercise: Set to Ready for Warehouse Processing, create and confirm warehouse tasks, Set to Ready for Shipping, assign a door in the Load or Unload Freight Orders app, Set to Arrived at Door, Set Items to Loaded, Set Stop to Loading Completed, post goods movement, Set to Departed from Door</h2><p>E04 (Execute an Integrated Warehouse and Transportation Process) is a <strong>transportation-driven</strong> example. Freight order 20000109 has an EWM outbound delivery order (visible in the document flow). The steps and what each reports:</p><table><thead><tr><th>Step</th><th>App / action</th><th>What it reports</th></tr></thead><tbody><tr><td>1</td><td>Warehouse Monitor: outbound delivery order is <strong>blocked</strong> (red light)</td><td>Transport-driven: warehouse waits for TM</td></tr><tr><td>2</td><td>Freight order: <strong>Set to Ready for Transportation Execution</strong>, Save</td><td>Planning is complete</td></tr><tr><td>3</td><td>Items, Status Management, <strong>Set to Ready for Warehouse Processing</strong></td><td>Responsibility for warehouse handling is released; the block is removed (green light)</td></tr><tr><td>4</td><td>Warehouse Monitor: <strong>Create WT in Background</strong>, then <strong>Confirm WT in Background</strong></td><td>Warehouse tasks created and confirmed; packing optional</td></tr><tr><td>5</td><td><strong>Set to Ready for Shipping</strong></td><td>Warehouse process finished</td></tr><tr><td>6</td><td>Load or Unload Freight Orders app: select the warehouse loading stop, <strong>Assign Door</strong> (loading point ZLP_ZASR, door YD00)</td><td>Door assigned to the stop</td></tr><tr><td>7</td><td><strong>Set to Arrived at Door</strong> (Warehouse Door Status)</td><td>Truck is at the door</td></tr><tr><td>8</td><td><strong>Set Items to Loaded</strong></td><td>Item load status turns green; stop status still red</td></tr><tr><td>9</td><td><strong>Set Stop to Loading Completed</strong> (Execution Status)</td><td>Stop load status turns green</td></tr><tr><td>10</td><td>Goods Movement, <strong>Post</strong></td><td>Goods issue requested; asynchronous, so the posting status is not immediately green</td></tr><tr><td>11</td><td><strong>Set to Departed from Door</strong></td><td>Truck has left the door</td></tr></tbody></table><p>Afterwards the freight order's Execution tab shows arrival, loading and departure events and the Statuses tab shows the freight order <strong>In Execution</strong>, departed from the loading point but not yet checked out, with warehouse processing only partially completed because a second loading stop at another warehouse is still to come.</p><h2>Delivery split: TM can split deliveries across Lean WM, STRM and EWM by creating a new delivery with the relevant freight units; it is not possible while warehouse activities run, and at loading, handling units not loaded get a new freight unit and delivery when the stop is set to Loading Completed</h2><p>H11 (Delivery Split): TM can split deliveries across Lean WM, STRM and EWM in the same system. Splitting creates a new delivery and assigns the relevant freight units to it. If the delivery has only one freight unit, the freight unit is split as well.</p><ol><li><strong>Planning.</strong> If you reassign a freight unit from a delivery to a different freight order, a new delivery is needed for the new freight order.</li><li><strong>Warehouse activities.</strong> They can start once the status is Ready for Warehouse Processing, and <strong>a split is not possible while they run</strong>. When picking starts the freight unit changes to In Process; when picking, packing and staging are complete the status is <strong>Completed</strong> and a split is possible again.</li><li><strong>Loading.</strong> If the truck cannot take all handling units of a delivery, use Load or Unload Freight Orders to select the loaded handling units (Set Items to Loaded). When you <strong>Set Stop to Loading Completed</strong>, the system removes from the freight order every handling unit not loaded and creates <strong>a new freight unit</strong> to which it is assigned and <strong>a new delivery</strong>.</li></ol><h2>Delivery deletion in TM: available for LE deliveries in an embedded setup when freight units are delivery-based and unplanned, with 2-step stock transport orders, side-by-side setups and EWM delivery orders excluded</h2><p>H11 (Delivery Deletion): you can delete LE inbound and outbound deliveries in TM, for example unneeded deliveries in customer and supplier returns. Requirements: an <strong>embedded</strong> setup, deliveries originating in LE, and freight units that are <strong>delivery-based and unplanned</strong>. Excluded for technical and practical reasons: 2-step stock transport orders and side-by-side setups; scenarios with EWM delivery orders and EWM TU-based deliveries are not supported.</p><p>H11's scenario: inbound deliveries were created from an external delivery note number, the truck unloads, and a missing note is discovered that the supplier cannot supply. Procedure: in the Freight Units - Worklist app select all FUs of the delivery, choose Delete Delivery and confirm. If an FU is planned, first remove it from the freight order (edit, select the FU, Delete and Save).</p><h2>Late changes to capacity documents: items loaded or unloaded but not assigned can be added to the same warehouse stop even after departure; later additions create a document error, and unassignment after check-out requires the stop status Not Loaded and cancelled goods movement, export declaration and customs invoice</h2><p>H11 (Late Changes to Capacity Documents): a capacity document such as a road freight order can be changed even after execution at the stop has started or finished, to reflect what really happened (for example, an extra pallet was loaded). You add the requirement document to the same warehouse stop, even after the truck departs, for example for charge calculation or settlement with the carrier.</p><ul><li><strong>Adding.</strong> If the truck has arrived but processing has not started, the new items take the stop's statuses. If you add after loading or unloading, check-out or departure, the new item's statuses do not match the stop and the system creates a <strong>document error</strong> (Document Errors tab). You cannot revoke the stop's status but you can update the new items to match. Inbound example: set the item to Ready for Warehouse Processing (a delivery must be created first, Follow Up, Create Deliveries), set the handling execution status to Unloaded, and post goods movement. For a customs-relevant freight unit, enter the same external delivery note number as another item of the order.</li><li><strong>Unassigning</strong> after execution has started but before goods movement is posted is possible. After loading is completed and check-out reported, the <strong>stop must have handling execution status Not Loaded</strong>, goods movement postings must be <strong>cancelled</strong>, any export declaration requested or approved must be <strong>cancelled</strong>, and any customs invoice must be <strong>cancelled</strong>. The system then sets the items to Not Loaded and revokes their Loading and Unloading events.</li></ul><h2>SAP Event Management integration: tracking of freight units, freight orders, freight bookings, transportation units, resources and instructions; expected events (Scheduled, Loading Begin, Loading End, Departure, Arrival at Destination, Unloading Begin, Unloading End) can be reported from either side, and unexpected events (Delay, Damage) raise alerts in TM</h2><p>H11 (Integration with SAP Event Management; Tracking of Freight Units). Execution tracking can be done with or without SAP EM; connecting SAP EM adds visibility for shipper, dispatcher, ship-to party and carrier, and a proof of delivery reported by the ship-to party.</p><table><thead><tr><th>Tracked object</th><th>Expected events named in H11</th><th>Unexpected events</th></tr></thead><tbody><tr><td>Freight units</td><td>Scheduled, Loading Begin, Loading End, Departure, Arrival at Destination, Unloading Begin, Unloading End</td><td>Delay, Damage (alert to TM)</td></tr><tr><td>Freight orders and freight bookings</td><td>Loading Begin, Loading End, Proof of Pick-up, Departure, Clear Customs, Arrival at Destination, Unloading Begin, Unloading End, Proof of Delivery</td><td>Reported for an item (Discrepancies and Events tab); SAP EM issues an alert on delays</td></tr><tr><td>Transportation units</td><td>Loading Begin, Loading End, Coupling, Departure, Arrival at Destination, Decoupling, Unloading Begin, Unloading End</td><td>Delay</td></tr><tr><td>Resources (trucks, locomotives, trailers, railcars, containers)</td><td>Coupling, Departure, Arrival at Destination, Decoupling</td><td>Sighting, Damage</td></tr><tr><td>Instructions</td><td>Instruction Execution</td><td>None supported</td></tr></tbody></table><p><strong>Two directions for reporting expected events:</strong> the carrier sends an event message through SAP EM and TM updates the document, or you update the document in TM and TM sends an event message to SAP EM. For freight units the dispatcher receives an alert when an unexpected event such as damage is reported.</p><p>Instructions (H11, Tracking of Instructions) are templates from forwarding agreements, copied into forwarding orders and freight units. Each has an alert date and due date and statuses Pending, In progress, Completed, Completed after Due Date, Alert and Overdue; Alert and Overdue are set by SAP EM monitoring.</p><h2>SAP GTS integration: compliance checks (embargo, sanction party lists, legal control) and export declarations; the outbound customs activity is based on a consignment or freight order, the inbound one on the freight order; the legal split indicator groups items into freight units and deliveries, and a non-compliant freight unit blocks the delivery for warehouse execution</h2><p>H11 (GTS Integration in Advanced Shipping and Receiving; SAP GTS Integration for the Outbound Process). SAP GTS performs compliance checks on freight units and freight orders, and export declarations on a consignment or freight order. In the outbound process customs activity is based on the consignment or freight order; in the inbound process, on the freight order.</p><p><strong>Outbound sequence (H11).</strong></p><ol><li>Saving a sales order: SAP GTS creates customs documents and runs a trade compliance check, returning an overall status with embargo check, watch list screening and legal control statuses. Each sales document can carry a <strong>legal split indicator</strong>; freight units are grouped so that all items in a unit share it, and deliveries are split accordingly.</li><li>Delivery created: TM creates freight units; SAP GTS checks all freight unit items. If the check is incomplete or the <strong>freight unit is not compliant, the delivery is blocked for warehouse execution</strong>. The TM Status tab shows planning, execution, delivery and invoicing blocks. In the transport-driven process you must still set Ready for Warehouse Processing manually once compliance is met.</li><li>Freight order created (and optionally a consignment order): a compliance check runs if activated; blocks appear on the Blocking Information tab.</li><li>After the stop is <strong>Checked In</strong>, the export declaration process starts for customs groups (considering the legal split indicator), automatically after Set Stop to Loading Completed if so configured. At <strong>Ready for Export Declaration</strong> a request goes to SAP GTS, optionally with customs invoice data. A missing customs clearance can prevent Checked Out. With handling execution status <strong>Cargo Ready for Loading</strong> the requests can go out before the truck arrives.</li><li>After SAP GTS approves the declaration, TM receives a <strong>customs reference number (CRN)</strong>; then TM can post goods issue and the freight order can be checked out.</li></ol><p><strong>Inbound sequence (H11).</strong> Freight units are checked for compliance, with planning or execution blocks if not compliant. You can set Checked In only if the freight order is compliant. Each consignment order needs a CRN, and an <strong>unloading permission</strong> requested from SAP GTS, before the warehouse unloading stop can be set to Ready for Warehouse Processing. After unloading, customs groups can be set to Ready for Import Declaration once goods receipt is done for all items, then Checked Out.</p><p>H11 (SAP GTS Integration in Decentralized EWM and TM) states the decentralized variant supports only the outbound or export process, with compliance checks for freight unit and freight order and export declaration for consignment and freight orders. Integration uses enterprise services (for example Request Export Declaration, Request Trade Compliance Check), over SAP NetWeaver PI or point-to-point.</p><section class="practice"><h2>Practice</h2><p>Draw an annotated swimlane (as a table or a drawing) of one outbound delivery from sales order to truck departure. Show the TM, EWM and SAP GTS steps in order, the status that changes at each step, and whether the flow you show is transport-driven or warehouse-driven.</p></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain to a warehouse manager, without notes, how a truck moves through Advanced Shipping and Receiving from gate check-in to goods movement, and how TM, the warehouse and SAP GTS hand over to each other?</p></section>` },
