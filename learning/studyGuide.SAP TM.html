  { n:"04", title:"Forwarding Orders and Quotations", html:`<h2>Overview</h2><p>This session covers Forwarding Order Management, the TM component a logistics service provider (LSP) uses to take a transportation job from an ordering party and turn it into something TM can plan, execute and invoice. You learn how a forwarding order is created, how its screen and route are organized, which statuses and blocks it carries, how a forwarding quotation relates to it, and how it connects to freight units, freight orders and the forwarding settlement document. In an LSP project the forwarding order is the starting document of the whole chain, so reading its Status tab and document flow is a daily skill.</p><h2>Purpose of Forwarding Order Management: create, edit and confirm forwarding orders from ordering parties, already specify the route and have transportation charges calculated; the orders form the basis for transportation planning. Data can also be entered as a forwarding quotation and sent to the ordering party</h2><p>You use the Forwarding Order Management component to create, edit and confirm forwarding orders from your ordering parties. Already at this stage you can specify the route and have the transportation charges calculated. The orders then form the basis for transportation planning (H04).</p><p>Alongside the order, the same data can be entered as a <strong>forwarding quotation</strong> and sent to the ordering party. A forwarding order can then be created based on that quotation (H04).</p><p>The documents in this component hold everything needed to plan and execute the transport: pick-up and delivery addresses, dates/times and the goods. Data is entered manually or transferred automatically via PI interfaces. After editing, you can send a confirmation to the ordering party, and you can trigger transportation planning from the order, generating freight units and freight orders (H04).</p><p><em>What the material does not establish:</em> H04 notes that integration of the forwarding order and the forwarding settlement document (FWSD) with Credit Management in SAP S/4HANA is currently not released. It gives no further detail on why.</p><h2>Integration of the component: freight orders and freight bookings can be created from forwarding orders (Freight Order Management); forwarding orders are the basis for planning and execution; a forwarding settlement can be created from the order to trigger invoicing; master data is a prerequisite; integration with dangerous goods management and global trade</h2><p>H04 lists the integration points of Forwarding Order Management with other TM components:</p><table><thead><tr><th>Component</th><th>What the integration means (H04)</th></tr></thead><tbody><tr><td>Freight Order Management</td><td>Freight orders and freight bookings can be created from forwarding orders</td></tr><tr><td>Planning</td><td>Forwarding orders form the basis for planning and executing the transportation</td></tr><tr><td>Forwarding Settlement</td><td>A forwarding settlement can be created from the order to trigger the invoice creation process</td></tr><tr><td>Master Data</td><td>The necessary master data must exist before forwarding orders can be created</td></tr></tbody></table><p>The component is also integrated with dangerous goods management and the global trade processes (H04). In practice this shows up as the dangerous goods profile on the forwarding order type (dangerous goods information appears on order items only if such a profile is assigned) and as the trade compliance check that can run when the order is saved (H04).</p><p>The business document itself links to three TM documents: the forwarding quotation (an accepted quotation can be converted into an order), the freight unit (created from the order) and the forwarding settlement document (created from the order) (H04).</p><h2>Definition of a forwarding order: an order from an ordering party to a carrier or logistics service provider for the transportation of goods from a shipper to a consignee under agreed conditions; entered manually (for example after a telephone call) or transferred automatically via PI interfaces or EDI; holds pick-up and delivery address, dates/times and the goods</h2><p>H04 defines the forwarding order as an order from an ordering party to a carrier or logistics service provider for the transportation of goods from a shipper to a consignee according to the agreed-upon conditions. Note the three business partner roles: ordering party (who places the order), shipper and consignee (the ends of the transport).</p><p>You enter the data manually, for example after a telephone call, or it is transferred automatically via PI interfaces or EDI. The order contains the most important data for planning and execution: pick-up and delivery address, dates/times and the goods to be transported. From it you can determine the transportation route, create freight units and a transportation plan, have charges calculated and start the invoicing (H04).</p><p>H04 adds that the enterprise services of forwarding order management are released only with restrictions.</p><h2>Forwarding orders and quotations as transportation requirements in the logistics service provider (LSP/3PL) deployment: they are created manually in the SAP TM UI or by EDI with an external system, and count as the transportation requirements of an LSP process</h2><p>S48600 describes three ways transportation requirements arise, depending on deployment. For logistics service providers (LSPs or 3PLs), requirements arrive as forwarding orders, typically created manually in the SAP TM user interface or by EDI with an external system. Forwarding orders and forwarding quotations are considered transportation requirements within an LSP process (S48600).</p><p>The other two cases are side-by-side deployment (replicated order-based or delivery-based requirements) and embedded deployment (the freight unit is created directly from the original sales or purchasing object) (S48600). Session 05 covers these.</p><p>The contrast answers a common question: for a shipper, the demand comes from sales orders, purchase orders, stock transport orders or deliveries; for an LSP, the customer's request itself is the forwarding order, so no separate ERP document drives the demand (S48600).</p><h2>Design of the forwarding order screen: determined by the transportation mode (air, sea or land) and by the forwarding order type defined in Customizing; the initial screen takes the type and the mode, and the type decides which additional tab pages are shown for each business process</h2><p>The design of the user interface is determined by two factors: the transportation mode (air, sea or land) and the forwarding order type defined in Customizing (H04).</p><p>On the initial screen you specify the forwarding order type and the transportation mode, unless the type already predefines the mode. The UI then adjusts automatically to the mode-specific business processes. The type also predefines which additional information or tab pages appear for each business process, for example dangerous goods information for order items (H04).</p><p>You can also configure, in the apps, whether a tab page, assignment block or specific fields are displayed or hidden (H04). If a Web Dynpro application configuration is defined in the order type, the system does not change the UI when the mode changes (H04).</p><h2>Basic structure of the forwarding order: general data, business partner, location and dates/times areas (valid for all items, including sales organization, Incoterms, service level, totals of quantity and weight); ordered route and actual route; list of order items; document flow; output management; status; HBL or HAWB; profitability; and process-dependent tab pages such as charge calculation, air cargo security, instructions and change documents</h2><p>H04 gives the generic structure, in tab pages or assignment blocks:</p><ul><li><strong>General data, business partners, locations and dates/times.</strong> Data valid for all items: sales organization, Incoterms, service level, and the totaled quantity and weight of the items. Process control attributes such as transportation mode and shipping type are also here.</li><li><strong>Ordered route and actual route.</strong> The route requested by the ordering party and the actual route, each with individual stages.</li><li><strong>List of order items.</strong> Item-specific data as an item hierarchy.</li><li><strong>Document flow.</strong> Documents entered into the order and documents created from it.</li><li><strong>Output management.</strong> Which documents were printed or sent (e-mail, fax), and printing of documents such as bills of lading.</li><li><strong>Status.</strong> Life cycle status, blocking status and the other statuses.</li><li><strong>HBL or HAWB.</strong> House bill of lading or house air waybill data.</li><li><strong>Profitability.</strong> A profitability analysis with navigation to the individual business documents.</li><li><strong>Process-dependent tab pages</strong>, shown if the process is activated in the document type: charge calculation and internal charge calculation, air cargo security, instructions (for example cleaning a container) and change documents (only if change tracking is activated). Air forwarding orders also have a Nature of Goods tab page.</li></ul><h2>Fast order entry: besides the full view, the Page function opens a single-screen view without tab pages with all fields needed to complete an order</h2><p>Besides the comprehensive view, the Page function gives access to a view for fast order entry. It contains all input fields needed to complete a forwarding order on one screen, without tab pages, and keyboard entry is faster (except in the list of order items) (H04).</p><p>H04 also describes a related creation route: from the order management overview you can first enter the order in a fast entry screen, save it, and call it up later to add further data.</p><h2>Ways to create a forwarding order: on the basis of a quotation, on the basis of a template, as a copy of an existing order, from the order management overview, from a forwarding agreement (ID and version, service items and data such as transportation mode, shipping type and sales organization are transferred), or via PI interfaces</h2><p>H04 lists six ways to create a forwarding order:</p><table><thead><tr><th>Way</th><th>What happens (H04)</th></tr></thead><tbody><tr><td>On the basis of a quotation</td><td>Create the quotation first and use its data; a quotation can also be assigned to an order subsequently, subject to prerequisites such as matching data</td></tr><tr><td>On the basis of a template</td><td>A template holds default data such as sales organization or Incoterms</td></tr><tr><td>As a copy of an existing order</td><td>Much of the data is copied, including route data</td></tr><tr><td>From the order management overview</td><td>A new order without reference to another object</td></tr><tr><td>From a forwarding agreement</td><td>Reference to an agreement ID and version; service items and data such as transportation mode, shipping type and sales organization are transferred</td></tr><tr><td>Using PI interfaces</td><td>Data comes directly from the ordering party via SAP NetWeaver PI</td></tr></tbody></table><p>For the forwarding agreement route, a reference to a specific agreement version is entered; if you also specify the agreement item, service items flagged as flow services are transferred. You can also enter a second agreement for the corresponding import or export document (H04).</p><h2>Template and copy behaviour: a template copies the order data such as document type, except dates/times and planning and execution data; a copy keeps much of the data including route data but has no dates/times and no follow-on documents, and its life cycle status is New</h2><ul><li><strong>Template.</strong> You can create a template from scratch or from an existing order (from the order or from the order management overview). The system copies the data, such as document type and order data, except dates/times and planning and execution data (H04).</li><li><strong>Copy.</strong> Choosing Copy in the order gives a new order with much of the data, including route data. It has no dates/times and no follow-on documents such as freight units or freight orders. You can also copy without the actual route data. Its life cycle status is New (H04).</li></ul><p>When you copy, you may enter a new forwarding order type for the new order. H04 warns this can cause inconsistencies with copied data that came from the old type's Customizing (such as transportation mode and shipping type). If the data for the new type is unique the system updates it automatically; otherwise you correct it manually (H04).</p><h2>Steps of manual creation: initial screen (forwarding order type, transportation mode, references, default route), general data (sales organization, process control attributes, Incoterms or freight terms), business partners, locations and dates/times, business process-dependent data, route, order items, then save</h2><p>H04 describes manual creation in seven steps:</p><ol><li><strong>Initial screen.</strong> Forwarding order type and transportation mode; references to other documents, copy or template; a reference to a forwarding agreement version and item; and optionally a default route. The system checks that the default route fits the other entries. The order appears with life cycle status New.</li><li><strong>General data.</strong> Sales organization (determined automatically if defined in Customizing), process control attributes (transportation mode, shipping type, movement type, air waybill type) and payment terms. Depending on Customizing you enter Incoterms or freight terms. If no payment terms are entered, the system determines the forwarding agreement from the ordering party and creates only one forwarding settlement document for the ordering party. Further options here include Uncontrolled Transportation, Buyer's Consolidation and Shipper's Consolidation.</li><li><strong>Business partners, locations and dates/times.</strong> Partners such as shipper, consignee and ordering party can be determined automatically via the partner determination profile in the order type. A location can determine the shipper or consignee, and a business partner can determine the location if unique. A manually overwritten address is marked as deviating and copied to follow-up documents. A credit limit check can be activated.</li><li><strong>Business process-dependent data.</strong> For example air cargo security, instructions, export/import processing, handling codes.</li><li><strong>Route.</strong> Create the stages if the ordering party already gave route information (see the route items below).</li><li><strong>Order items.</strong> Entered as a hierarchy.</li><li><strong>Save.</strong> See the item on saving.</li></ol><h2>Rules on type and mode: without an entry the default type from Customizing is used; the forwarding order type cannot be changed afterwards in the document; a mode defined in the type cannot be changed; a manually entered mode can be changed later only if no follow-on documents exist for FUs or TUs whose main carriage stage has started</h2><p>These rules (H04, step 1 and 2 of creation):</p><ul><li>Without an entry, the default type from Customizing is used.</li><li>The type cannot be changed afterwards in the document itself. Some other parameters, such as the sales organization, may still be changed if Customizing predefined a changeable value.</li><li>If the mode is defined in the type, it is displayed and cannot be changed. If you enter the mode first, the input help for the type offers only types valid for that mode. If the type does not define a mode, you can enter it manually or leave it empty and enter it later.</li><li>A manually entered mode may be changed later, but not if follow-on business documents exist for the freight units (FUs) or transportation units (TUs) and execution of at least one main carriage stage of one of them has already started.</li><li>Changing a manually entered mode from one category to another (for example sea to air) clears the fields not relevant for the new mode, saves the document automatically and loads the UI for the new mode. The ordered route, actual route and dependent freight documents are not changed automatically and must be updated manually if required (H04).</li></ul><p>Why it matters: the type fixes the profiles, defaults and UI (see the Customizing item), so choosing it wrongly means creating a new order rather than correcting the old one.</p><h2>Order item hierarchy: items are entered as a hierarchy such as container, packaging and product; only the top level is relevant to planning, and quantities and weights are totaled and copied to the header</h2><p>Items are entered as a hierarchy, for example container, packaging and product. Only the top level of this hierarchy is relevant to planning. The quantities and weights of the levels are totaled and copied to the header data (H04). The default printout also shows information about the lower hierarchy levels if items were entered in a hierarchy (H04).</p><p><em>What the material does not establish:</em> the item-creation detail (item types, service items, equipment types, splitting) sits in a separate H04 chapter this session does not expand.</p><h2>Saving the order: the system assigns an ID from the number range of the document type, checks completeness and consistency, and if customized automatically creates freight units, confirms the order, calculates charges, triggers an approval workflow, checks credit limits and runs the trade compliance check</h2><p>On save the system assigns an ID from the number range of the document type and checks the data for completeness and consistency. Results appear as error messages and as a completeness status (H04).</p><p>If defined in Customizing, the system then performs automatic functions (H04):</p><ul><li>creation of freight units</li><li>confirmation of the order, with the confirmation sent to the ordering party</li><li>calculation of transportation charges</li><li>a check of whether approval limits are exceeded, triggering the approval workflow if needed</li><li>a credit limit check of the business partners</li><li>a check of foreign trade regulations (trade compliance check)</li></ul><p>If the order is incomplete for planning, the system sets an automatic block (see the blocking item). A BAdI can change which fields the completeness check requires (H04).</p><h2>Customizing behind the order: the forwarding order type assigns the profiles (planning, output, dangerous goods, partner determination) and the freight unit building rule or condition, and sets defaults such as transportation mode, shipping type, traffic direction, sales organization, automatic confirmation, automatic FU building, approval workflow, credit limit check, charge calculation, settlement and change tracking</h2><p>The forwarding order type is the central Customizing object (H04). It lets you:</p><ul><li>assign the <strong>profiles</strong>: planning profile (how planning proceeds from the order, or on what basis routes are determined), output profile (possible print documents and EDI messages), dangerous goods profile and partner determination profile</li><li>assign the <strong>freight unit building rule or a condition</strong> that determines it</li><li>set <strong>defaults</strong>: transportation mode, shipping type, traffic direction, sales organization</li><li>switch on or off: automatic confirmation, automatic freight unit building, approval workflow and credit limit check, charge calculation and internal charge calculation, forwarding settlement and internal settlement, process-specific parameters (air waybill type, air cargo security check) and change tracking</li><li>determine the appearance of the UI</li></ul><p>Other prerequisites named in H04: a number range interval for the order IDs, transportation modes, optional mode-specific codes (airline codes, SCAC), service levels, shipping types, block reasons, and optionally HBL/HAWB number ranges assigned to sales organizations and ordering parties. Profiles are optional but needed for follow-up actions such as planning or printing.</p><h2>Ordered route: the stages of the route requested by the ordering party; source and destination on the Locations and Dates/Times tab appear as one Complete Carriage line, which can be split into stages; a default route from the initial screen or a forwarding agreement item fills it</h2><p>The ordered route holds the stages requested by the ordering party. If source and destination are already entered on the Locations and Dates/Times tab, they appear as one <strong>Complete Carriage</strong> line. A default route entered on the initial screen, or selected from a forwarding agreement item, fills the route with its stages (H04).</p><p>To add stages you select the Complete Carriage line (or an existing stage) and choose <strong>Split</strong>. The system inserts two lines: the first keeps the source location and dates and leaves the destination empty; the second keeps the destination and leaves the source empty. A route A to C becomes, for example, A to B and B to C (H04).</p><h2>Actual route: entered manually, determined by Route - Transportation Proposal, or taken from a default route; the transportation mode of the header refers only to the main carriage, and stage mode is taken from manual entry, then stage type Customizing, then header; after transportation planning the actual route is displayed and can no longer be changed</h2><p>You can enter the actual route manually, have the system determine it with Route - Transportation Proposal, or apply a default route and copy it into the stage table. Items and freight units do not have to exist yet. A route copied from a proposal can still be changed (H04).</p><p>Stage data is pre-filled from Customizing and the header (H04):</p><ul><li>The <strong>movement type and traffic direction</strong> (and an optional stage profile) can determine stages automatically and restrict stage types. With the traffic direction they also decide which stages you are responsible for, shown in the Stage Status.</li><li>The <strong>transportation mode</strong> in the header refers only to the main carriage. For a stage the mode is taken in this order: manual entry for the stage, then Customizing for the stage type, then the header.</li><li>The <strong>agreement party and type</strong> are determined from the stage type and the Incoterms in the header, defining who is responsible for settlement.</li><li>If you enter an <strong>SCAC</strong> without a carrier, the carrier is determined in later planning; entering a carrier fills the SCAC. For air, airline codes give the MAWB prefix.</li></ul><p>If planning was performed from the forwarding order, the actual route is displayed and can no longer be changed. As an alternative to planning, you can create freight orders and freight bookings directly for the stages of the route (H04).</p><h2>Ordered route is not updated by the actual route; Copy from Actual Route overwrites it, after which the ordered route is no longer visible. Stage detail data distinguishes requested, planned, actual and confirmed dates</h2><p>The ordered route is not updated automatically by the actual route. To print up-to-date documents you can choose <strong>Copy from Actual Route</strong> on the Ordered Route tab, which copies the data into the ordered route; the ordered route is then no longer visible (H04).</p><p>Stage detail data is shown on three tab pages: Ordered Data (provided by the customer), Planning/Execution Data (from successor documents such as freight orders, cannot be changed) and Additional TU Dates/Times (H04). The dates distinguish:</p><table><thead><tr><th>Date</th><th>Meaning (H04)</th></tr></thead><tbody><tr><td>Requested pick-up and delivery date</td><td>Requested by the ordering party, in the ordered route</td></tr><tr><td>Planned departure and arrival date</td><td>Entered manually or set by planning; before planning it equals the requested date</td></tr><tr><td>Actual departure and arrival date</td><td>Entered in the freight document or reported by SAP Event Management</td></tr><tr><td>Confirmed pick-up and delivery date</td><td>Confirmed to the ordering party, for the complete carriage</td></tr><tr><td>Cut-off dates</td><td>Read from the freight document: latest time goods or documents must be available</td></tr></tbody></table><h2>Document flow: shows which business documents were entered into the order and which were created from it, with navigation to follow-on documents such as a freight unit</h2><p>The document flow shows which business documents were entered into the forwarding order and which were created based on it. From here you can display the follow-on documents and open, for example, a freight unit (H04). When manual planning in the transportation cockpit creates a freight order, it appears in the order's document flow (H04). This is the tool for tracing an order to its freight units, freight orders and forwarding settlement document.</p><h2>Life cycle status values of a forwarding order: New, In Planning, Planned, In Execution, Executed, Partially Invoiced, Completed, Determination Pending, Canceled, Draft</h2><p>H04 defines the life cycle status values:</p><table><thead><tr><th>Status</th><th>Meaning (H04)</th></tr></thead><tbody><tr><td>New</td><td>Order created; no freight units or transportation units yet</td></tr><tr><td>In Planning</td><td>At least one FU or TU has been created</td></tr><tr><td>Planned</td><td>All FUs and TUs assigned to it have been planned</td></tr><tr><td>In Execution</td><td>At least one follow-on document (not necessarily an FU or TU) is in execution</td></tr><tr><td>Executed</td><td>Execution of all planning documents assigned to the order is completed</td></tr><tr><td>Partially Invoiced</td><td>One or more forwarding settlement documents were created, invoicing not yet complete</td></tr><tr><td>Completed</td><td>Execution finished, invoicing done, existing instructions completed (if so customized); also set for orders created only for settlement (for example service orders) once settlement documents are complete</td></tr><tr><td>Determination Pending</td><td>Set temporarily when an order is reopened after Completed; changes again after the next save</td></tr><tr><td>Canceled</td><td>The order was canceled</td></tr><tr><td>Draft</td><td>Set when an import forwarding order is created or updated; only the sales organization can be changed</td></tr></tbody></table><p>Reading this top to bottom gives the life of an order: planning, execution, invoicing, completion.</p><h2>Further status types: planning status, execution status, confirmation status, approval status (only with approval workflow), delivery status, FWQ assignment status, organization interaction status, HBL or HAWB status, and statuses for air cargo security and foreign trade compliance</h2><p>Besides the life cycle status, the Status tab shows (H04):</p><ul><li><strong>Planning status:</strong> Planning Not Started; In Planning (at least one FU or TU created, but no freight document assigned yet); Partially Planned (a freight document assigned, but not all FU or TU stages planned); Planned.</li><li><strong>Execution status:</strong> Execution Not Started; In Execution (at least one linked planning document in execution); Executed.</li><li><strong>Confirmation status:</strong> Not Confirmed (no confirmation yet, or it was reset because data changed); Confirmed.</li><li><strong>Approval status</strong> (only with approval workflow): Not Checked; No Approval Required; Approval Required (limits exceeded, order blocked); Approved; Not Approved (stays blocked).</li><li><strong>Delivery status:</strong> Delivered, Partially Delivered, Not Delivered, taken from the freight documents. An item-level cargo receipt status also exists.</li><li><strong>FWQ assignment status:</strong> whether the order was created from a forwarding quotation or one was assigned later.</li><li><strong>Organization interaction status:</strong> the interaction between organizational units, for example a sales organization and a planning and execution organization, per stage and aggregated.</li><li><strong>HBL or HAWB status</strong>, and statuses for air cargo security and compliance with foreign trade regulations (shown if activated in the order type).</li></ul><p>Planning and execution statuses are finer-grained views of what the life cycle status summarizes. Note that the "In Planning" wording appears in both the life cycle and the planning status, with slightly different definitions: the planning status version stresses that no freight document is assigned yet (H04).</p><h2>HBL or HAWB: the assignment block shows house bill of lading or house air waybill data and allows waybill numbers to be allocated to freight units; its status (Finalized, Partially Finalized, Not Finalized) shows whether the customer service agent has completed the HBLs or HAWBs</h2><p>The HBL or HAWB block shows house bill of lading or house air waybill data, and lets you assign waybill numbers to freight units individually or remove the assignments (H04). Number ranges can be assigned to sales organizations and ordering parties in the master data; you can assign a number from the range in the order, and deactivate that function per order type (H04).</p><p>The HBL or HAWB status supports communication, for example between a customer service agent and a capacity manager at the gateway. It shows whether the HBLs or HAWBs have been completed by the customer service agent and are available for subsequent processes (H04):</p><ul><li><strong>Finalized:</strong> all house air waybills in the order are completed.</li><li><strong>Partially Finalized:</strong> at least one but not all are completed.</li><li><strong>Not Finalized:</strong> none is completed.</li></ul><p>You can set the status manually via a menu option and reset it to Not Finalized. For the order type Direct Shipment the status is set for both the HAWB and the master air waybill (MAWB) (H04).</p><h2>Blocking: planning, execution, confirmation and settlement blocks can be set manually with block reasons from Customizing or automatically (incomplete order, approval workflow, dangerous goods check); removal needs authorization and a comment can be logged; a forwarding settlement document cannot be created while the settlement block is set</h2><p>Blocks can be set manually or automatically for four functions (H04):</p><table><thead><tr><th>Block</th><th>What it stops (H04)</th></tr></thead><tbody><tr><td>Planning</td><td>Planning of the order: creation of FUs and TUs, and of freight orders</td></tr><tr><td>Execution</td><td>Execution of the order and associated planning documents</td></tr><tr><td>Confirmation</td><td>Confirmation of the order</td></tr><tr><td>Settlement</td><td>Creation of the forwarding settlement document</td></tr></tbody></table><p><strong>Manual blocks.</strong> You pick a block reason defined in Customizing (Define Block Reason Codes). Several planning or execution blocks with different reasons can coexist, and all reasons show in the aggregated view and in successor documents.</p><p><strong>Automatic blocks.</strong> The system blocks, for example, an order that lacks required information; block details list the fields still to fill, and the Check function shows the same messages. Further automatic blocks come from the approval workflow and the dangerous goods check.</p><p><strong>Removal.</strong> You need the authorization to remove blocks. You can enter a comment, and the system logs who removed the block and when. You cannot create a forwarding settlement document while the settlement block is set. In Customizing you can specify the successor documents to which the blocks are copied (H04).</p><p>H04 also notes that changes to a business partner block are not always visible immediately in an open order; close and reopen it.</p><h2>Editing the order: freight units can be created automatically or from the Follow-Up Actions menu, planning is manual in the transportation cockpit or via route determination, automatic planning with the VSR optimizer, or direct creation of freight documents; changes are passed on to freight units and follow-on documents until execution data has moved the FU to On Hand; an order with an assigned freight document cannot be canceled</h2><p>After saving, you can (H04):</p><ol><li><strong>Create freight units</strong>, automatically after save or manually from the Follow-Up Actions menu, using the FUB rule or its condition from Customizing. All required data must be entered first. After creation the life cycle status changes from New to In Planning.</li><li><strong>Plan transportation</strong>, in one of four ways: manual planning in the transportation cockpit (drag freight units onto resources, creating a freight order shown in the document flow); <strong>determination of a route</strong> (the system proposes alternative routes per freight unit, and Customizing for the order type decides whether accepting saves only the freight units or also the freight orders; if freight orders are saved, status becomes Planned); <strong>automatic planning</strong> with the VSR optimizer from the cockpit; or <strong>direct creation of freight documents</strong> (freight orders or bookings for the stages, or selecting available freight bookings). When all freight units are planned, the status changes to Planned.</li><li><strong>Calculate charges</strong>, if activated for the order type. The system recalculates on every save, but manually entered charges are fixed and kept. An Estimate Forwarding Charges function gives a quick estimate; a profitability analysis is available on its own tab.</li><li><strong>Create a forwarding settlement document</strong> (see below).</li><li><strong>Print documents</strong>; the print history appears under Output Management.</li><li><strong>Edit or cancel.</strong> Most data (dates, quantities, locations, items) can still change, even after planning or execution start; freight units and follow-on documents such as freight orders and bookings are adjusted when saving. Once execution data has moved the freight unit to On Hand, the system no longer adjusts follow-on documents and asks you to change them manually. Canceling deletes the freight units, sets the status Canceled and cannot be undone; an order with an assigned freight document cannot be canceled (H04).</li><li><strong>Execute and track.</strong> With the Customizing indicator set, SAP Event Management monitors the order, and the order receives a tracking ID the ordering party can use on a web UI. The execution status reflects the freight order's status (cumulated if several freight orders exist) (H04).</li></ol><h2>Forwarding quotation: a quotation from a carrier or LSP to an ordering party with price and conditions; structured like the order plus a validity scope and a quotation price; its life cycle status values are New, Not Transferred, Transferred and Canceled; it is set up with a forwarding quotation type and can be converted into a forwarding order</h2><p>A forwarding quotation is a quotation from a carrier or LSP to an ordering party about transporting goods, with price and further conditions. It helps send the data of a potential order together with the quotation price, and the order is created when the ordering party places it (H04).</p><p><strong>Structure.</strong> Like the forwarding order, plus a <strong>validity scope</strong> (checked when an order is created from the quotation) and a <strong>quotation price</strong> (a total price without detailed charges; if charges are specified, their total is shown; the quotation price is not displayed if the calculation profile calculates at stage level) (H04).</p><p><strong>Life cycle status</strong> (H04; planning and execution statuses are removed):</p><table><thead><tr><th>Status</th><th>Meaning</th></tr></thead><tbody><tr><td>New</td><td>Newly created, not yet sent</td></tr><tr><td>Not Transferred</td><td>An already sent quotation was changed; the changes were not yet sent</td></tr><tr><td>Transferred</td><td>Sent to the ordering party</td></tr><tr><td>Canceled</td><td>Canceled (irreversible)</td></tr></tbody></table><p><strong>Process</strong> (H04): enter data on the initial screen (set up with a <strong>forwarding quotation type</strong> defined in Customizing; its shipping type and mode must match the order type if orders will be created from it), save, determine the route, calculate charges (or enter just a quotation price), send and print (history on the Output Management tab), accept or reject (rejection sets a reason code and cancels it), then create the forwarding order or cancel. A quotation can also be created automatically from an electronic request for quotation, for example in tendering, and then appears in the POWL. When the order is created from the quotation the system copies the route data and the price calculation and checks validity; the quotation type can limit how many orders may be created from one quotation. A quotation can also be locked, manually or automatically (for example by approval workflow or dangerous goods check) (H04).</p><h2>Forwarding settlement document: created from the forwarding order (Costs/Settlement menu) when activated for the forwarding order type, based on the charge calculation; if one exists, changes either flow through the forwarding settlement change process (Reverse and Repost or Delta Only in the settlement profile) or require canceling the document</h2><p>When activated in Customizing for the forwarding order type, you create a forwarding settlement document from the order, based on the transportation charge calculation, via the Costs/Settlement menu (H04). It triggers the invoice creation process (H04).</p><p>If a forwarding settlement document or internal settlement document already exists and a change is needed (for example quantities, shipper or consignee), there are two cases (H04):</p><ul><li>the <strong>forwarding settlement change process</strong> is activated: you enter the changes in the order and the change process triggers the needed changes in settlement. You activate it in the settlement profile by selecting <strong>Reverse and Repost</strong> or <strong>Delta Only</strong>; the profile is assigned via the organization or organization plus business partner.</li><li>it is <strong>not activated</strong>: you must cancel the settlement document, change the order, and create a new document.</li></ul><p>A set settlement block prevents creating the document, and the life cycle status Partially Invoiced shows an order mid-invoicing (H04). <em>Detailed settlement mechanics belong to the settlement session; this material only covers the link from the order.</em></p><section class="practice"><h2>Practice</h2><p>Write a one-page walkthrough of a forwarding order from quotation to forwarding settlement document. Cover the creation options, the screen areas, the ordered and actual route, the main status values and the blocks that can stop it. Write it so that a colleague can follow the document flow.</p></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain how a forwarding order is created, which statuses it passes through and how it connects to the quotation, the freight units and the forwarding settlement document to a project stakeholder without notes?</p></section>` },
  { n:"05", title:"Logistics Integration with Sales, Purchasing and Deliveries", html:`<h2>Overview</h2><p>This session covers how a shipper's ERP documents reach TM and come back. Orders and scheduling agreements from sales and purchasing, deliveries from Logistics Execution (LE) and JIT calls become freight units in TM, TM plans them, and TM can then propose the deliveries that LE creates. You learn which documents are integrated and why (control keys, the logistics integration profile), how freight units are built, how the delivery proposal step works, and how Incoterm locations shape stages and responsibilities. In a shipper project, integration setup decides what ever reaches the planners, so most "why is there no freight unit?" questions trace back to this session.</p><h2>Scope of logistics integration: TM can be integrated with components in the same system or an external system; orders from SD and MM, deliveries from LE and JIT calls from nJIT drive transportation planning and execution, and the TM component creates or updates freight units directly for documents defined in Customizing as TM-relevant when they are saved</h2><p>You can integrate TM with components in the same system (internal TM component integration) or with an external system. A decentralized EWM and TM system can also be integrated with an external system (H05).</p><p>Orders created in Sales and Distribution (SD) and Materials Management (MM), deliveries created in Logistics Execution (LE) and JIT calls created in Next Generation Just-In-Time (nJIT) facilitate transportation planning and execution in TM (H05). The TM component creates or updates freight units directly for orders or deliveries defined in Customizing as relevant for TM integration. When such a document is created or changed, the freight units are created or updated once you save it. TM can therefore react continuously to changes in SD, MM and LE (H05).</p><h2>What integration enables: collective planning for all orders and scheduling agreements, planning on sales or purchase orders before delivery creation for an earlier forecast of transportation demand, tendering, subcontracting and execution based on orders, sales order scheduling, and planning and execution of JIT calls</h2><p>H05 lists what integration allows you to do:</p><ul><li>plan transportation collectively for all orders and scheduling agreements</li><li>plan on sales or purchase orders before delivery creation, giving an earlier forecast of future transportation and resource demand</li><li>perform tendering, subcontracting and execution in TM based on sales and purchase orders</li><li>perform sales order scheduling: propose and create deliveries from dates and quantities in the planning results, considering constraints such as resource availability and transportation durations</li><li>plan and execute JIT calls</li></ul><h2>Integratable documents: orders (sales order, customer returns, purchase order, stock transport order, returns purchase order, returns stock transport order), scheduling agreements (sales, purchase, stock transport), JIT calls (sequenced, forwarded) and inbound and outbound deliveries from LE, also when an order was not sent to TM</h2><p>H05 (Features) names four groups:</p><table><thead><tr><th>Group</th><th>Documents</th></tr></thead><tbody><tr><td>Orders (SD or MM)</td><td>Sales order, customer returns, purchase order, stock transport order, returns purchase order, returns stock transport order</td></tr><tr><td>Scheduling agreements</td><td>Sales, purchase and stock transport scheduling agreements</td></tr><tr><td>JIT calls (nJIT)</td><td>Sequenced JIT call, forwarded JIT call</td></tr><tr><td>Deliveries (LE)</td><td>Outbound and inbound deliveries, whether or not TM triggered their creation, and even if the related order was not sent to TM</td></tr></tbody></table><p>You can also define the transportation relevance of sales, purchase and delivery documents (H05). If a product in an order or delivery is classified as dangerous goods, TM takes this into account (H05).</p><p><em>Conflict in wording:</em> S48600 lists "sales scheduling agreements" and "materials management scheduling agreements" among the triggering documents, whereas H05 names sales, purchase and stock transport scheduling agreements. S48600's list also omits JIT calls. The two are consistent in substance; use H05's list as the detailed one.</p><h2>Transportation requirements as sources: OTR is the demand from sales, purchasing and stock transport (SO, PO, STO); DTR is the demand from an inbound or outbound delivery (IDL/ODL); the freight unit represents the demand that is planned</h2><p>S48600 defines these objects:</p><table><thead><tr><th>Object</th><th>Abbreviation</th><th>Source documents</th></tr></thead><tbody><tr><td>Order-based transportation requirement</td><td>OTR</td><td>Demand from sales, purchasing and stock transport (SO, PO, STO)</td></tr><tr><td>Delivery-based transportation requirement</td><td>DTR</td><td>Demand from an inbound or outbound delivery (IDL/ODL)</td></tr><tr><td>Freight unit</td><td>FU</td><td>Set of goods transported together; the smallest unit of freight in planning</td></tr></tbody></table><p>The freight unit merges items (transportation requirements) from originating documents such as SO, PO and STO for planning. Freight unit granularity varies by scenario: larger units simplify planning in VSR optimization, while smaller units theoretically offer higher optimization potential but complicate planning (S48600).</p><h2>Triggering documents and deployment models: sales orders, customer returns, purchase orders, stock transport orders and their returns, scheduling agreements and deliveries trigger transportation requirements; in side-by-side deployment the information is replicated and becomes order-based or delivery-based requirements via XML messages (SAP PI or point-to-point); in embedded deployment no separate document is needed and the freight unit is created directly from the original object</h2><p>A transportation requirement is the event that initiates a TM process, triggered by transportation-relevant items in an initiating document. S48600 lists sales orders, customer returns, purchase orders, stock transport orders, return stock transport orders, sales and MM scheduling agreements, and outbound and inbound deliveries.</p><p>How it arises depends on the deployment (S48600):</p><ul><li><strong>Side-by-side / external TM system.</strong> The original document is not in TM, so the information is replicated and creates order-based or delivery-based requirements. Integration with SAP ERP or SAP S/4HANA uses XML messages via SAP Process Integration or point-to-point communication.</li><li><strong>Embedded / internal TM component.</strong> The original object already exists in SAP S/4HANA, so no separate document is needed; the freight unit acts as the initial object for TM, created directly from the original object. S48600 states that this embedded scenario is the main focus of its overview training.</li><li><strong>LSP.</strong> Forwarding orders and quotations (session 04).</li></ul><h2>Decentralized scenarios: a decentralized EWM and TM system can be integrated with an external ERP system and transportation planning done on outbound delivery orders; settings sit under Decentralized EWM-TM Integration</h2><p>H05 states that a decentralized EWM and TM system can be integrated with an external ERP system, and that transportation planning is then done based on outbound delivery orders. The logistics integration profile for decentralized EWM is defined in Customizing under Integration, Decentralized EWM-TM Integration. It has common settings (freight unit building rule, condition for FUB rule determination), stage building (Incoterm locations 1 and 2, planning-relevant stages only or static stages as well) and compliance checks for the Advanced Shipping and Receiving process (H05).</p><p><em>What the material does not establish:</em> this session's sources give only the profile description; the full decentralized process is in the Advanced Shipping and Receiving material of a later session.</p><h2>Transportation relevance and control keys: control keys define which documents in a chain are integrated; sales document integration is activated by assigning a control key to sales document type, sales area and shipping condition; purchasing documents by document type, purchasing organization and purchasing group; delivery documents by shipping point, delivery type and shipping condition; the key is stored in parameter TM_CONTROL_KEY and passed to all relevant documents in the chain</h2><p><strong>Control keys</strong> determine which documents in a document chain are integrated into TM. You can define as many as you need with different combinations of relevant documents, and you specify the integration mode: the internal TM component or an external TM system (H05).</p><table><thead><tr><th>Document type</th><th>Control key is assigned to this combination (H05)</th></tr></thead><tbody><tr><td>Sales documents (sales orders, customer returns)</td><td>Sales document type, sales area (sales organization, distribution channel, division) and shipping condition</td></tr><tr><td>Purchasing documents (purchase orders, stock transport orders, returns, scheduling agreements)</td><td>Document type, purchasing organization and purchasing group</td></tr><tr><td>Delivery documents</td><td>Shipping point, delivery type and shipping condition</td></tr></tbody></table><p>The control key decides whether the document and its corresponding delivery are integrated. When a document with activated integration is created, the system assigns the key (parameter TM_CONTROL_KEY) to it and to all relevant documents in the chain, such as the outbound or inbound delivery (H05). Practical reading: to decide whether a given order is integrated, check whether its document type, sales area or purchasing organization and shipping condition match an assignment that carries a control key.</p><p>H05 also covers related settings: a transport-driven process for outbound deliveries (the delivery is blocked for warehouse execution during transportation planning), and the definition of whether a delivery block is a planning block, an execution block or both.</p><h2>Deliveries inherit the control key of the preceding document and ignore the delivery Customizing in that case; the delivery setting is needed only when a delivery is integrated but its order is not</h2><p>A delivery can be integrated using the control key of the preceding document, such as a sales or purchase order. It then inherits that key, and the system ignores the settings of the delivery Customizing activity. That activity is needed only when a delivery is to be integrated into TM but the corresponding order is not (H05).</p><h2>Three settings named by S48600 for integrating sales orders, scheduling agreements and deliveries: activate integration via control key, create a logistics integration profile, assign the profile to the document type; prerequisite for configuration is the location creation report /SAPAPO/CREATE_LOCATION</h2><p>S48600 names three settings to integrate sales orders, scheduling agreements and deliveries:</p><ol><li>Activate integration of documents via control key</li><li>Create a logistics integration profile</li><li>Assign the logistics integration profile to the document type</li></ol><p>H05 states the prerequisite for the configuration: you have run the location creation report /SAPAPO/CREATE_LOCATION. It also describes the profile as something you can create several of and assign to TM-relevant business document types (H05). For purchasing documents, H05 says assigning a profile is optional.</p><h2>Logistics integration profile for SD, MM and LE: common settings (freight unit building rule, condition for FUB rule determination, automatic freight unit building, stage building variant) and order-related settings (plan on requested or confirmed quantities, FU building for partly complete sales documents, rule group for the time range of purchase scheduling agreements, integration based on actual quantity, improved location determination, Advanced SR compliance check)</h2><p>The profile (Customizing: Integration, Logistics Integration, Internal TM Component Integration) has two groups of settings (H05).</p><p><strong>Common settings</strong> (order-related and delivery-related):</p><ul><li>Freight unit building rule used when freight units are created automatically.</li><li>Condition for FUB rule determination, which derives the rule from business document details.</li><li>Automatic freight unit building: whether FUs are built automatically after the document is saved or in a separate manual step.</li><li>Stage building variant: Static or Advanced (see the stage building item).</li></ul><p><strong>Order-related settings:</strong></p><ul><li>Plan on requested or confirmed quantities.</li><li>Freight unit building for partly complete sales documents: creates FUs for complete items of a partly complete sales document.</li><li>Rule group to determine the time range of purchase scheduling agreements, limiting FU creation for scheduling agreements.</li><li>Integration based on actual quantity: allows delivery integration on actual quantities determined during execution.</li><li>Improved location determination: destination location based on the shipping point.</li><li>Advanced Shipping and Receiving: enables compliance checks in that process.</li></ul><p>Separate profiles exist for nJIT (common settings and stage building) and for decentralized EWM (H05).</p><h2>FUB rule determination: the system first checks the condition in the logistics integration profile, then the freight unit building rule in the profile, then standard settings; freight unit building can run automatically on save or be triggered manually or by background report (/SCMTMS/SUBSEQENT_FUB_LOGINT in embedded deployment)</h2><p>S48600 gives three options in order: (1) the condition defined in the logistics integration profile; if none is specified or it gives no result, (2) the FUB rule specified in the profile; if none is maintained, (3) standard settings.</p><p>Freight units are generated automatically when transportation relevance is identified for a demand such as a sales order, purchase order, delivery, OTR or DTR. The system considers existing freight units, and builds new ones using the split quantity and the item split setting. SAP delivers the default strategy FUB_AUTO (S48600).</p><p>Inside a FUB rule (S48600): the critical quantity is the primary unit of measure that lets a line item be split into several FUs; split quantities set the maximum capacity of an FU (for example, 5 tons of cement with a 500 kg split quantity gives 10 FUs); Item Split Allowed controls whether items are split; an equipment type makes capacity count during building; incompatibility settings keep products apart (ice cream and ketchup). Exercise E02 shows the strategies of the rule FUBR_S4TM1: consolidate as much as possible, per item, or per request (E02).</p><p>Besides automatic building on save, FU building can be triggered manually or by the report /SCMTMS/SUBSEQENT_FUB_LOGINT in an internal TM component integration setup (H05).</p><h2>Order integration process: order created in SD/MM with items and schedule lines, TM creates freight units only for transportation-relevant orders, planning can consolidate FUs from orders of different types (for example purchase and sales orders), then TM can execute transportation or trigger delivery creation in LE</h2><p>H05 describes three steps:</p><ol><li><strong>Create order (SD/MM).</strong> Items carry material, requested or confirmed quantity and desired delivery date; an item's quantity can be split into schedule lines with different dates. On creation the order is integrated into TM.</li><li><strong>Create freight units (TM).</strong> TM creates FUs whose items correspond to the schedule line items. Depending on the profile, FUs are built automatically on save, use requested or confirmed quantities, and can be built for complete items in partly complete sales documents. TM creates FUs only for transportation-relevant orders.</li><li><strong>Plan (TM).</strong> TM can consolidate FUs from several orders even if the base documents have different order types, for example purchase and sales orders.</li></ol><p>After planning, TM either executes transportation or triggers delivery creation in LE (H05).</p><h2>End-to-end process from order to execution: create order (SD/MM), perform transportation planning (TM), create delivery proposal (TM), create deliveries (LE), reassign freight units from order to delivery (TM), execute transportation; the TM document flow can be displayed in SD, MM or LE</h2><p>H05 gives the full chain:</p><table><thead><tr><th>Step</th><th>System</th><th>What happens</th></tr></thead><tbody><tr><td>1. Create order</td><td>SD/MM</td><td>Order with items and schedule lines; FUs are created in TM</td></tr><tr><td>2. Transportation planning</td><td>TM</td><td>Results include pickup and delivery dates, resource assignments and routes</td></tr><tr><td>3. Create delivery proposal</td><td>TM</td><td>Based on planning results, or on FUs if no planning was done</td></tr><tr><td>4. Create deliveries</td><td>LE</td><td>Inbound or outbound deliveries; also possible without a TM proposal</td></tr><tr><td>5. Reassign freight units</td><td>TM</td><td>TM finds the order matching the delivery and reassigns the FUs from the order to the delivery</td></tr><tr><td>6. Execute transportation</td><td>TM</td><td>Based on the planning results</td></tr></tbody></table><p>The TM document flow for an order or delivery (freight units, freight orders, freight settlement documents, with statuses) can be displayed in SD, MM or LE, so a user there can follow TM processing. In the integrated worklists you also see consolidated status, planning and execution block information (H05).</p><h2>Delivery proposals: TM proposes inbound or outbound deliveries from planning results and LE creates them; creation runs by background report /SCMTMS/DLV_BATCH, interactively from the Delivery Proposal Builder app or Freight Orders - Worklist app, from the transportation cockpit or from the freight order UI; dates come from the freight order or booking, otherwise from FUs, quantities from the FUs</h2><p>TM can propose inbound and outbound deliveries from planning results, considering constraints such as resource availability and transportation durations, and can also trigger creation before planning. LE creates the deliveries; it may split them further on additional criteria but does not change TM's proposed dates or consolidate proposals (H05, S48600).</p><p><strong>Ways to start</strong> (H05):</p><ul><li>Background report /SCMTMS/DLV_BATCH, with selection criteria or selection profiles and optionally a delivery profile.</li><li>Interactive, from the <strong>Delivery Proposal Builder</strong> app: select profiles, review the listed documents, trigger proposals, review them.</li><li>Interactive, from the <strong>Freight Orders - Worklist</strong> app: select documents, choose Create Deliveries, select freight units, trigger and review.</li><li>From the <strong>transportation cockpit</strong> after planning: choose Create Delivery Proposals and review.</li><li>From the <strong>freight order UI</strong> (needs a delivery profile assigned to the freight order type).</li></ul><p>S48600 adds the OTR, Freight Unit, Freight Order and Ocean/Air Freight Booking worklists as start points.</p><p><strong>Data sources</strong> (H05): dates from the freight order or booking, otherwise from the freight units; quantities from the freight units. A proposal consists of groups of freight units that can be delivered together. Depending on the start method, TM sends proposals to LE automatically or lets the user review first. If the delivery profile says so, planning results are fixed during proposal creation. Prerequisites include existing FUs, an order not blocked for delivery, and a control key making deliveries TM-relevant; when using the report, no proposal may already exist for the FUs.</p><p><em>Naming difference between sources:</em> the interactive app is called "Delivery Proposal Builder" in H05 and "Create Deliveries - Delivery Builder" in E04 and "Delivery Builder app" in S48600.</p><h2>Delivery proposal consolidation and control: FUs can share a proposal only with the same source and destination location, Incoterms, shipping conditions, document type and (if planned) start and destination stop; TM respects chronological consumption of schedule lines in LE; the delivery profile (Create Delivery Profile app) controls fixing of planning results, grouping by freight unit, order or order item, and exclusion of planning or execution blocked objects</h2><p><strong>Consolidation rules</strong> (H05, S48600): if freight orders or bookings exist, only FUs of the same freight order or freight booking can share one proposal, so FUs of different orders can be combined, but FUs of one order spread over several freight orders give several proposals. If order combination is not allowed for an order, its FUs are not grouped with other orders' FUs. In addition, the FUs must match on source location, destination location, Incoterms, shipping conditions, document type (such as purchase or sales order), and start stop and destination stop if planning has been done. S48600 adds, for side-by-side scenarios, the SAP ERP system the order came from.</p><p><strong>Schedule lines.</strong> LE consumes schedule lines chronologically, so TM does not propose a delivery for a schedule line before an earlier schedule line of the same item has been used; affected FUs are excluded. If LE errors on delivery creation, later schedule lines of the item are not delivered (H05).</p><p><strong>Delivery profile</strong> (created in the Create Delivery Profile app) (H05):</p><ul><li>fix planning results of already planned FUs, freight orders or bookings</li><li>when creating for unplanned FUs, create deliveries per freight unit (default), order or order item</li><li>incompatibility settings that keep FUs out of one delivery</li><li>include or exclude objects blocked for planning or execution; the check applies only to the object you start from (for example a main-carriage freight order blocked for execution blocks delivery creation if you start from it, but not if you start from the pre-carriage order)</li><li>amalgamate FU items of the same order item into one delivery item or keep them separate</li><li>when packaging information is transferred from the freight order to the delivery (relevant for the Advanced Shipping and Receiving inbound process)</li></ul><p>Bulk material: actual quantities entered in the freight order UI create a delivery proposal with those quantities, without splitting FUs (H05).</p><h2>Delivery integration without order integration: if the order is not TM-relevant, TM creates new FUs for the delivery according to the specified FUB rule; changes to orders and deliveries update the FUs, a deleted order deletes its FUs, a deleted delivery reassigns FUs to the order if it is TM-relevant, otherwise deletes them</h2><p><strong>Delivery without order integration</strong> (H05): the order is created in SD/MM but is not TM-relevant; deliveries are created in LE; TM creates new FUs for the delivery by the specified FUB rule; then planning and execution follow.</p><p><strong>Changes and deletions</strong> (H05):</p><ul><li>Order changed: TM updates the FUs by the assigned FUB rule; if the quantity rose after a delivery exists, new FUs cover the open quantity.</li><li>Order deleted: TM deletes the FUs (an order cannot be deleted in SD/MM once a delivery exists). If an FU served several orders, its quantity is reduced; an empty FU is deleted or canceled per the freight unit type setting.</li><li>Delivery updated: TM adjusts the FUs. A decreased delivery quantity raises the open quantity of the order, so order FUs adapt too; an increased quantity reassigns FUs from the order to cover it.</li><li>Delivery deleted: FUs are reassigned to the order if the order is TM-relevant, otherwise canceled or deleted per the FU type.</li><li>Delivery split: TM adjusts the FUs; splits in EWM are always integrated through LE.</li></ul><p>S48600 also describes TM-triggered updates of outbound delivery dates and TM-triggered splits (outbound deliveries only; TM cannot trigger updates of inbound deliveries).</p><h2>Stock transport orders: a two-step process with outbound and inbound deliveries and reassignment of FUs from outbound to inbound delivery; in the Advanced Shipping and Receiving scenario goods issue triggers the inbound delivery and the reassignment, and FUs in one delivery must belong to the same EWM- or LE-managed warehouse or storage location</h2><p>An STO transfers goods from one plant to another with the same company code. In the two-step process, outbound and inbound deliveries are created and FUs are reassigned from the outbound to the inbound delivery, giving visibility once goods issue is posted and goods are in transit (H05).</p><p>An STO can be executed order-based or delivery-based, with warehouse- or transport-driven execution. In the <strong>Advanced Shipping and Receiving</strong> scenario, goods issue posting triggers creation of the inbound delivery and automatic reassignment of the FUs; the warehouse processing status becomes In Transit. The One Step checkbox must be deselected for this. At both ends you can use EWM- or LE-managed warehouses or storage locations, but FUs in one delivery must belong to the same one (EWM or LE managed). In other scenarios the inbound delivery is not shown in the TM document flow and FUs are not reassigned (H05). Prerequisites include activating Improved Location Determination, defining control keys, and running delivery management, EWM and TM on a single system (H05).</p><h2>Scheduling agreement integration: schedule lines of purchase scheduling agreements create, change or delete freight units; TM planning results can be synchronized back to MM schedule lines in batch only for FUs not yet assigned to a delivery and within the planning time fence; inbound deliveries from an ASN lead TM to reassign FUs from the agreement to the delivery</h2><p>For purchase scheduling agreements (H05):</p><ul><li><strong>Create or update schedule lines.</strong> An MRP run or manual planning creates, changes or deletes schedule lines; after saving, TM creates, changes or deletes FUs accordingly.</li><li><strong>Process planning.</strong> Plan FUs manually or with the optimizer. The result can optionally be synchronized to materials planning in a batch run (report /SCMTMS/TM_SAG_PLANNING_SYNC), where MM creates, updates or deletes schedule lines. The planning time fence restricts updates; they are allowed only within the horizon fixed by an MRP run, and only for FUs not assigned to a delivery.</li><li><strong>Communication to suppliers.</strong> MM creates releases from schedule lines, so suppliers receive information based on TM planning results rather than material planning results.</li><li><strong>Create deliveries.</strong> MM creates or updates inbound deliveries from an ASN; when a new delivery is saved, TM reassigns the FUs from the agreement to the inbound delivery.</li></ul><p>If a purchase scheduling agreement has Kanban indicator Z and a control cycle with TM relevance, TM creates FUs from the S2P JIT call regardless of the agreement's TM relevance (H05). Restrictions include that summarized JIT calls and outbound sequenced JIT calls are out of scope (H05).</p><p>H05 also describes deactivating and reactivating integration (reports /SCMTMS/DEACTIVATE_MMSAG_W_DLV and /SCMTMS/REACTIVATE_MMSAG_W_DLV), advising a fixed end date first with /SCMTMS/FIX_INT_TIMERANGE to avoid duplicate FUs.</p><h2>Integration time range for purchase scheduling agreements: start and end dates limit the schedule lines taken into account and so the freight units created; the start date is set once from the earliest schedule line with open quantity and a safety margin and is never in the future; the end date follows the schedule line count, matching rule and offsets and is determined daily; report /SCMTMS/UPDATE_INT_TIMERANGE preponed end dates</h2><p>The time range limits how many schedule lines, and so how many FUs, TM builds, reducing FUs with distant delivery dates that are not yet relevant to planning (H05). The rule group is set in the logistics integration profile.</p><p><strong>Start date.</strong> Determined once, when the agreement is first integrated and processed. The system finds the earliest schedule line with open quantity and uses its date as the upper limit; with a safety margin set, it takes the earlier of the two dates. It is usually before the current date and never in the future (H05).</p><p><strong>End date.</strong> Determined daily. The system counts schedule lines within the "time range for schedule line count", finds the matching rule (by minimum number of lines), and adds the rule's integration time range offset and the additional offset (Planning Time Fence or Planned Delivery Time in Days, or none) (H05).</p><p><strong>Worked example</strong> (H05): current date 17 May, safety margin 7 days (10 May), earliest open schedule line 8 May gives start date 8 May. For the end date: 30-day count range holds ten lines, so rule 2 (minimum 6 lines, 20 days) applies; plus 5 days planned delivery time gives an end date 25 days ahead.</p><p>If Customizing errors put the end date too far ahead, adjust Customizing and then run /SCMTMS/UPDATE_INT_TIMERANGE to prepone it (H05).</p><h2>Order-only integration of purchase scheduling agreements: activation report /SCMTMS/ACTIVATE_MMSAG_WO_DLV sets a start date and a reduction quantity strategy, adjustable later with /SCMTMS/ADAPT_START_MM_WO_DLV</h2><p>In order-only integration, FUs are created for purchase scheduling agreement items without inbound delivery integration. These FUs are never transferred to a delivery, so execution relies on the order-based FUs and the agreement (H05).</p><p>The activation report /SCMTMS/ACTIVATE_MMSAG_WO_DLV determines a start date automatically (usually the next date with order quantity for which goods receipt is not yet booked); no FUs are built for quantities before it. You also choose a <strong>reduction quantity strategy</strong> (H05):</p><ul><li>don't consider any deliveries;</li><li>consider only goods receipt quantities at or after the start date;</li><li>consider all delivered quantities (goods receipt and deliveries) at or after the start date.</li></ul><p>The system subtracts the reduction quantity before building FUs for the remaining quantity at every integration. The end date logic is unchanged. /SCMTMS/ADAPT_START_MM_WO_DLV lets you freely adjust start date and reduction quantity afterwards, which the activation report does not allow (H05).</p><h2>JIT call integration: FUs are created from sequenced JIT calls based on the component group material, with JIT call reference number, receiving point and unloading point; the outbound (S2C) process is delivery-based only</h2><p>Integration with nJIT creates FUs from sequenced JIT calls. FUs are built from the call's component group material, not the individual components, and contain the JIT call reference number, receiving point and unloading point. Updates and deletions follow changes to the call (H05).</p><ul><li><strong>Supply to Production (S2P), inbound.</strong> No initial package building; packaging information and slot number come with the ASN, and the system updates the S2P FUs on receipt. Initial FU building from component group materials is possible.</li><li><strong>Supply to Customer (S2C), outbound.</strong> FUs are created from the outbound delivery in LE-SHP; the process is delivery-based only, so FU building cannot be based on the S2C call. Creating deliveries with the delivery report is not available in S2C.</li><li>A <strong>forwarded JIS call</strong> outsources component manufacturing from one supplier to another, running like S2P between two suppliers.</li></ul><p>All solutions must operate on a single system (H05).</p><h2>Source and destination location determination: business partners, plants, shipping points or storage locations from ERP documents are identified and locations updated or created; a new address in a document creates a one-time location; Improved Location Determination uses shipping points as destination</h2><p>The determination identifies business partners, plants, shipping points or storage locations in ERP documents and transmits them to the freight units; it updates or creates locations where needed. A document-specific address is also considered (H05).</p><ul><li>A new address entered in a business document creates a <strong>one-time location</strong> used as source or destination of the FU.</li><li>By default, for stock transport orders, returns and STO scheduling agreements, business partner addresses are the destination; for purchase orders and agreements, a one-time location with the storage location address is used when one exists.</li><li><strong>Improved Location Determination</strong> uses shipping points as the destination instead; the item's delivery address tab then shows the storage location address, while the FU shows the receiving point address, which can differ. In Advanced SR scenarios the improvements are active by default (H05).</li></ul><h2>Advanced intercompany sales and stock transfer: one freight unit across the business documents, harmonized Incoterm handling, Incoterm locations build FU stages, and TM sets the planned and actual transfer of control dates and times in the LE delivery</h2><p>For advanced intercompany sales and advanced intercompany stock transfer, H05 states that TM supports these processes as follows:</p><ul><li>one freight unit is created across the various business documents</li><li>Incoterm handling is harmonized between Sales, Sourcing and Procurement, LE and TM</li><li>Incoterm locations build FU stages in TM</li><li>TM sets the transfer of control dates and times in the LE delivery, based on planning and actual events (visible on the Shipment tab of the LE delivery)</li><li>freight cost allocation posting is enabled</li></ul><p>In advanced intercompany sales, a selling company's sales order leads to an intercompany purchase order and intercompany sales order in the delivering company; the delivering company delivers to the customer, invoices the selling company, and the selling company invoices the customer. In stock transfer, an intercompany purchase order is followed by an intercompany billing document and an automatically posted supplier invoice (H05). Prerequisites include setting both processes up and the logistics integration profile (H05).</p><h2>Incoterms and responsibilities: planning and cost responsibility transfer at Incoterm location 1; risk transfers there for non-C-clauses and at Incoterm location 2 for C-clauses (CIF, CIP, CFR, CPT); transfer of control is the transfer of risk responsibility, internal within the group and external to the customer</h2><p>H05 separates three duties: <strong>planning</strong> responsibility (who organizes the transport), <strong>cost</strong> responsibility (who pays) and <strong>risk</strong> responsibility. Incoterm locations are where these pass from shipper to consignee.</p><ul><li>Planning and cost responsibility transfer at <strong>Incoterm location 1</strong>.</li><li>Risk transfers at location 1 for non-C-clauses, and at <strong>Incoterm location 2</strong> for C-clauses (CIF, CIP, CFR, CPT).</li></ul><p>The transfer of risk responsibility is <strong>transfer of control</strong>: internal when goods go from the delivering company to the selling company within the group, external when they go from the group to the customer; each has a planned and an actual version (H05). S48600 adds that an Incoterm location is a master data location in TM, and that the Incoterms (Part 2) field can define it, mapped with the app Assign Location to Incoterm Location.</p><p><strong>H05 example.</strong> The sales order carries DDP, so the group plans and pays to the customer in Walldorf (location 1). The intercompany order carries CIF: two stages result, Palo Alto to the port of discharge in Hamburg (delivering company) and Hamburg to Walldorf (selling company). Internal transfer of control occurs at Incoterm location 2, when the goods are loaded on the vessel in New York, so risk passes then; the delivering company keeps planning and cost responsibility until Hamburg. External transfer of control occurs at the customer's address. <em>The H05 text alternates between calling the CIF Incoterm that of the intercompany purchase order and of the intercompany sales order; the stage and transfer logic is the same either way.</em></p><h2>Stage building from Incoterm locations: stages are built only if the Incoterm has the Incoterm Location flag, otherwise one stage from source to destination; the logistics integration profile offers the Static variant (stage profile) or the Advanced variant (Incoterm locations 1 and 2), and the Incoterm Location Stage Building field gives rules 01 to 05</h2><p>S48600: the system uses the Incoterm location for stage building only if the Incoterm has the <strong>Incoterm Location flag</strong> (a location must be entered with it). With no Incoterm, or an Incoterm without the flag, only one stage from source to destination is created.</p><p>Stage building variants in the profile (H05): <strong>Static</strong> (a stage profile and stage profile condition determine the stages, and you define which stages are built when the Incoterm location is used) or <strong>Advanced</strong> (considers Incoterm locations 1 and 2, with a choice of planning-relevant stages only, or static stages too).</p><p>Rules of the Incoterm Location Stage Building field (S48600):</p><table><thead><tr><th>Value</th><th>Result</th></tr></thead><tbody><tr><td>Initial value</td><td>Default: two planning-relevant stages</td></tr><tr><td>01 Source Location to Incoterm Location, Type 1</td><td>One stage, source to Incoterm location</td></tr><tr><td>02 Source Location to Incoterm Location, Type 2</td><td>Active stage source to Incoterm location, plus a non-planning-relevant stage to the destination</td></tr><tr><td>03 Incoterm Location to Destination, Type 1</td><td>One stage, Incoterm location to destination (for example a consignee planning only that leg)</td></tr><tr><td>04 Incoterm Location to Destination, Type 2</td><td>Active stage Incoterm location to destination, plus a non-planning-relevant stage from the source</td></tr><tr><td>05 Two Active Stages</td><td>Two planning-relevant stages</td></tr></tbody></table><h2>Reports for logistics integration: /SCMTMS/LI_ACTIVATE, /SCMTMS/DLV_BATCH, /SCMTMS/SUBSEQENT_FUB_LOGINT, /SCMTMS/TM_SAG_PLANNING_SYNC and the purchase scheduling agreement activation, deactivation, reactivation and time range reports</h2><p>H05 lists these reports (SAP Easy Access: Logistics, Transportation Management, Administration, Logistics Integration):</p><table><thead><tr><th>Report</th><th>Purpose (H05)</th></tr></thead><tbody><tr><td>/SCMTMS/LI_ACTIVATE</td><td>Activate integration of business transaction documents into TM (internal setup)</td></tr><tr><td>/SCMTMS/DLV_BATCH</td><td>Create deliveries based on existing freight units</td></tr><tr><td>/SCMTMS/SUBSEQENT_FUB_LOGINT</td><td>Trigger creation of freight units in internal TM component integration</td></tr><tr><td>/SCMTMS/TM_SAG_PLANNING_SYNC</td><td>Synchronize the planning date of FU items with the schedule line delivery date in the purchase scheduling agreement</td></tr><tr><td>/SCMTMS/ACTIVATE_MMS
