: publishing the master automatically creates and sends individual freight agreement RFQs; creation and publication can be separated into two steps (otherwise the Create &amp; Publish indicator does one step), individual RFQs cannot be sent selectively, an approval workflow can be enabled, and mass processing uses /SCMTMS/RFQ_PUBLISH; a master that cannot be published stays in Publication in Process, is checked in SLG1 and republished with /SCMTMS/RFQ_RE_PUBLISH</h2><ul><li><strong>What happens:</strong> on publication the system creates and sends individual freight agreement RFQs to carriers, using output management settings and business-to-business communication (H08).</li><li><strong>One step or two:</strong> the Create &amp; Publish indicator in the RFQ type configuration creates and publishes in one step (S4TM3). Separating creation and publication (set in Define Freight Agreement RFQ Types) lets you edit or review the individual RFQs before sending. You cannot send individual RFQs selectively: publishing the master sends all of them (H08).</li><li><strong>Approval:</strong> an approval workflow can require an approver before publication. When approved, the system publishes the master automatically and creates and sends the individual RFQs. If creation and publication are separated, you then trigger each step separately. An offline approval workflow can send work items by e-mail (H08).</li><li><strong>Mass processing:</strong> program Mass Publication of Freight Agreement RFQ Masters (/SCMTMS/RFQ_PUBLISH) in SE38 creates, or creates and publishes, individual RFQs for several masters. With the two-step setting it does not publish automatically, but can publish masters that already have individual RFQs (H08).</li><li><strong>Failure:</strong> if the system cannot publish, the status becomes Publication in Process, not Published. Check in SLG1, correct the errors, and republish with Publish Freight Agreement RFQ Master (/SCMTMS/RFQ_RE_PUBLISH) in SE38 (H08).</li></ul><h2>System notifications to carriers: after publication, as the response deadline approaches, on the deadline, on cancellation, after creation of the agreement, and when the agreement is expiring, using business-to-business communication</h2><p>H08 (Requesting of Quotations for Transportation Services) lists six notifications, integrated with output management and sent by business-to-business communication:</p><ol><li>After publication: the RFQ is attached, plus XLS files for rate tables and local rate tables.</li><li>When the response deadline is approaching: a reminder to carriers who have not responded (timing set in Define Freight Agreement RFQ Types).</li><li>On the response deadline: a reminder on the last day to carriers still not responded.</li><li>When the RFQ is canceled: carriers are told it is withdrawn.</li><li>After creation of the agreement: carriers get the freight agreement and rate tables as attachments.</li><li>When the agreement is expiring: carriers get the agreement as an attachment and a link.</li></ol><h2>Negotiation rounds versus versions: a new negotiation round (Follow Up, Create Negotiation Round) requires a published master, adds 1 to the round number and resets the version number to zero; a new version (Generate New Version) needs status In Process, adds 1 to the version number and keeps the round number</h2><p><strong>Negotiation round (H08).</strong> Use it when the responses are not satisfactory. You change the master and publish again, and carriers resubmit rates. The round number records how often you published the master to carriers. The master must be published before you can create a round. Creating a round adds 1 to the round number and resets the version number to zero, so the latest published round always has a clean version. Menu path: Follow Up, Create Negotiation Round (also in S4TM3).</p><p><strong>Version (H08).</strong> A version lets you make changes without publishing to carriers. The master must have status In Process; once individual RFQs exist or the master is published, you cannot create a new version. Creating a version adds 1 to the version number and keeps the round number. Use the Generate New Version button. When you publish, the round number goes up by 1.</p><p>H08 sums it up: use versions for internal changes before you publish, and negotiation rounds for changes you send to carriers. The Versions tab lists versions and rounds with status. S4TM3 notes that the version currently displayed or edited is not shown in the version overview.</p><table><thead><tr><th></th><th>New negotiation round</th><th>New version</th></tr></thead><tbody><tr><td>Precondition</td><td>Master published</td><td>Status In Process, nothing published or created yet</td></tr><tr><td>Round number</td><td>+1</td><td>unchanged</td></tr><tr><td>Version number</td><td>reset to 0</td><td>+1</td></tr><tr><td>Goes to carriers</td><td>Yes, on publication</td><td>No</td></tr></tbody></table><h2>Response evaluation in the comparison cockpit: manual comparison by carrier and charge type (flat amounts only, ranking by lowest quoted rate, manually entered target share) or optimizer-based comparison for complex cases with constraints</h2><p>The comparison cockpit is where responses are compared per RFQ item or across items. This post-bid analysis supports the decision which carriers get the business and in what proportion (H08). Prerequisites (H08): the master is published, carriers have responded, target share strategies are defined, and a calculation profile and a charges profile (with local currency) are defined and assigned to the organizational unit in transaction PPOME. The system simulates an estimate of cost; it does not calculate actual charges.</p><p><strong>Manual response comparison.</strong></p><ul><li>Suitable when the comparison is simple and rates are the only constraint (H08). S4TM3 adds: the only objective is rate minimization and the number of responding carriers is small.</li><li>Works directly in TM only for charge types with flat amounts. The system ranks carriers by the lowest quoted rate per charge type and shows a response comparison graph (H08).</li><li>If the charge type has a rate table or local rate table, you can compare the tables in a spreadsheet instead, with no graph (H08).</li><li>You enter the target share per carrier manually. With no optimizer involved, spend is estimated from the carrier-level target share, not the rate-table target share (H08).</li><li>In the Response Comparison area you can Select all items or Select matching items for a given item type (S4TM3).</li></ul><p><strong>Optimizer-based comparison.</strong></p><ul><li>Especially useful when the comparison is complex and several constraints apply (H08). S4TM3 lists the constraints: minimum or maximum number of carriers, carrier-specific and incumbent-specific minimum or maximum target shares, risk-related constraints, and Bonus/Malus linked to historical carrier performance.</li><li>The optimizer proposes target shares across carriers bearing these constraints in mind, and you can run it repeatedly with different strategies and versions (H08; S4TM3).</li><li>Before inserting a target share strategy, select in the Response Comparison area the charge types you want to compare with the optimizer (H08).</li></ul><p><strong>Other points (H08).</strong> Historical spend simulation lets you specify a prime charge type and validity periods in the optimizer conditions. The system finds previous orders with the same attributes (report /SCMTMS/SOL_SPEND_SIMULATE in SE38), calculates their charges with the carriers' proposed rates and uses the total to determine target share. The optimizer therefore works on charges rather than rates. Currency conversion is applied when several currencies are compared. Graphs include the response comparison graph and the strategy spend comparison graph; the default type is a 100% stacked column graph.</p><h2>Target share strategies and strategy conditions (Define Target Share Strategies): minimum and maximum target share, minimum and maximum number of carriers, separate conditions for incumbent carriers, respect for carrier-promised capacity; the optimizer can be run in the back end with /SCMTMS/OPTIMIZER_RUN, can use historical spend simulation, and can add risk or bonus-malus logic via BAdI</h2><p><strong>Where defined.</strong> Customizing, Transportation Management, Master Data, Agreement RFQs and Quotations, Define Target Share Strategies (S4TM3; H08). A strategy contains conditions that restrict the optimizer.</p><p><strong>Condition parameters (S4TM3).</strong> Incumbent (selected if the carrier is incumbent), maximum business share, minimum business share, maximum number of carriers and minimum number of carriers. H08 words it as minimum and maximum target share percentage and minimum and maximum number of carriers to include, with separate conditions for incumbent carriers and all other carriers. H08's reason: you may want to give an incumbent a higher percentage. The optimizer also respects the capacity promised by carriers, so a proposed share stays within the carrier's confirmed capacity (H08).</p><p><strong>In the cockpit.</strong> The same strategy can be used several times as different strategy versions. Choose Insert to add a strategy and Insert, Conditions for conditions. Run Optimizer calculates target shares per carrier. Simulate Estimate Spend calculates spend per carrier and strategy (S4TM3). The Copy button creates a new strategy from an existing one, with or without the target shares; copying without target shares keeps only the strategy conditions (H08). The RFQ type can define whether the optimizer processes one item or all items (S4TM3).</p><p><strong>Back end.</strong> Program Mass Optimizer Run and Strategy Spend Estimation (/SCMTMS/OPTIMIZER_RUN) in SE38 runs the optimizer for specific strategies or for all strategies in a master, and can estimate spend at the same time. For several masters at once, only "all strategies" is possible (H08).</p><p><strong>Bonus-Malus and BAdIs.</strong> A flag in the target share strategy Customizing enables Bonus-Malus, which uses carrier performance scores from SAP BW to push the optimizer toward or away from a carrier. The BAdI method GET_BONUS_MALUS_VALUE defines the reward or penalty; the course example adds 10% to a carrier's proposed cost for a history of delays (S4TM3). H08 lists further BAdIs: Additional Optimizer Constraints (for example risks or bonuses), Specification of Historical Parameters for Optimizer, and a customer-specific strategy spend estimation.</p><h2>Strategy spend estimation and Award Summary: the system estimates cost, it does not calculate actual charges; the strategy spend comparison graph compares strategy versions; the Award Summary tab shows graphs by trade lane, carrier or RFQ item and last year's spend</h2><p><strong>Estimation (H08).</strong> The system estimates strategy spend for the full validity period of each RFQ item and adjusts if the periodicity differs (for example validity 12 months and periodicity monthly: the estimate is multiplied by 12). It respects minimum and maximum rate values from rate tables. Constraints named in H08 include: spend can be estimated for a single rate table only; charge types with different rate tables cannot be compared at the same time; a local rate table can have only one validity period; rate tables must not contain the calculation bases SOURCELOC_ZONE or DESTLOC_ZONE; a flat-amount line item must not have a calculation resolution base; only one capacity dimension (gross weight, gross volume or container count) can be used when running the optimizer. If you change a carrier's target share after the optimizer run, estimation uses the carrier-level share.</p><p>The strategy spend comparison graph compares amounts and shares across strategy versions (H08; S4TM3).</p><p><strong>Award Summary (H08).</strong> Available on the published master once carriers have responded. It helps judge how negotiation is going, for example whether to create a new round. Views:</p><ul><li><strong>Trade Lane:</strong> equipment type, transportation mode, estimated strategy spend, budget for the periodicity, number of carriers and target share distribution. Comparing estimated spend with the planned periodicity budget can indicate a need for a new negotiation round.</li><li><strong>Carrier:</strong> target share per carrier and who was awarded, plus transportation mode, equipment type, shipping type, strategy spend version and amount.</li><li><strong>RFQ Item:</strong> periodicity budget versus estimated spend per item and spend per carrier.</li><li><strong>Historic spend:</strong> in Trade Lane and RFQ Item views, Display Historic Spend queries SAP NetWeaver Business Warehouse for what was spent on the same trade lane, transportation mode and shipping type, converted to the master's currency if needed.</li></ul><h2>Awarding and agreement creation: selecting and accepting the preferred target share strategy calculates the confirmed capacity (changeable manually) and sets the RFQ status to Awarded; Create/Update Agreement generates or updates freight agreements per carrier, with agreement allocations; the optimizer's target share is copied into the business share used in carrier selection in planning</h2><ol><li><strong>Accept the preferred strategy.</strong> Choose Accept Preferred Strategy. The system calculates the confirmed capacity in the master from the optimizer's target share (you can change it manually) (H08), and the RFQ status becomes Awarded (S4TM3).</li><li><strong>Create/Update Agreement.</strong> In the master, choose Create/Update Agreement. For each carrier you can create a new agreement or update an existing one, and you can turn each RFQ item into a separate agreement. Agreement allocations are created per carrier, based on the requested capacities of the request item and the target business share defined for the carrier (S4TM3). An approval workflow can be required before agreements are created (H08).</li><li><strong>Notification.</strong> The system notifies carriers about the creation or update, with a copy of the agreement and rate tables (H08).</li><li><strong>Completion.</strong> Setting the master to completed sets the individual RFQs to completed (H08).</li></ol><p><strong>From target share to planning (H08).</strong> When you create or update an agreement from an RFQ, the system proposes a target share, which is the output of the optimizer run in the comparison cockpit. It is copied into the item details of the agreement. The target share is included in the business share, and the business share is used in the carrier selection settings in planning.</p><h2>Award confirmation (optional, enabled in the RFQ type): an award confirmation deadline, the Notify the Carrier for Award Confirmation button, consolidation of carrier confirmations, and statuses; it is only a soft confirmation, carriers are not rejected if they miss the deadline</h2><p>Award confirmation lets the shipper ask carriers to confirm the allocated capacities before capacity or business share is awarded through a freight agreement. It is enabled in Define Freight Agreement RFQ Types (H08).</p><ul><li><strong>Deadline:</strong> defined in the master. Carriers confirm within it. This is only a soft confirmation: the system does not reject carriers that miss the deadline, and the shipper can still confirm capacities offline (H08).</li><li><strong>Notification:</strong> the button Notify the Carrier for Award Confirmation tells carriers their confirmed capacities and the deadline.</li><li><strong>Consolidation:</strong> a carrier can answer by e-mail with a spreadsheet (items, rate tables, calculation sheets, transportation modes, service levels) containing a response and a confirmation reason. A carrier not using TM can use the Manage Freight Agreement RFQs app. The master's award confirmation status updates automatically when an individual RFQ confirmation is available. After the deadline you can run /SCMTMS/RESPONSE_AWARD_CONFIRM, which retrieves masters with status Pending Confirmation from Carrier (or a specific RFQ ID).</li><li><strong>Statuses:</strong> shown on the master, the RFQ item, the response and the optimizer strategy.</li></ul><p><em>The material read does not explain the individual award confirmation status values in detail; only the places where they are shown were read.</em></p><h2>RFQ master assignments distribute single RFQ items to analysts or organizations whose results are merged back once approved; publication to carriers is possible only from the master</h2><p>Responsibilities for different segments of an RFQ may sit with different purchasing organizations or departments that need to work on comparisons at the same time (S4TM3). After the master is approved and published, the shipper picks an item in the Items area and chooses Create/Update RFQ Assignment. A separate freight agreement RFQ master assignment is created with one transportation requirement item (based on trade lanes) and a copy of previous responses. H08 describes the analysts as having expertise in a trade lane, who determine the best bids and merge results back to the master.</p><p>When work is finished, the user transfers the item back with a follow-up action on the assignment item, and this works only if the item is already approved in the assignment document (S4TM3). Assignment documents have the same capabilities as master documents, but publication to the carrier is only possible from the master (S4TM3).</p><h2>Reverse auction: carriers can revise bids and see the current best rates; by default only lower bids are possible unless Allow Carriers to Increase their Bids is selected</h2><p>Reverse auction belongs to the Advanced RFQs feature (H08). Prerequisites in Customizing (Master Data, Agreement RFQs and Quotations): Advanced RFQs, Enable Capacity Demand and Rates, Enable Reverse Auction, and optionally Allow Carriers to Increase their Bids (only if Enable Reverse Auction is selected).</p><p>The shipper can let carriers revise bids and see the current best rates on the user interface and in spreadsheets. Carriers see the current best rates for a lane and can revise their bids. By default they can submit only lower bids, and higher bids need Allow Carriers to Increase their Bids. They can bid multiple times until the response deadline, or until the negotiation is completed or canceled, and can upload their latest bids by spreadsheet (H08).</p><h2>Carrier collaboration prerequisites: for each carrier, a business partner with the role Carrier and a collaboration user defined in the Maintain Collaboration Users app; carriers need not use TM</h2><p>A shipper can collaborate with carriers for various TM processes even if the carrier does not use TM. Once carriers have access to the relevant features they can, for example, answer freight agreement RFQs with proposed rates (H10).</p><p>For each carrier (H10):</p><ol><li>In the Maintain Business Partner (BP) transaction, create a business partner with the role Carrier.</li><li>In the Maintain Collaboration Users app, define a collaboration user and specify that it is for that business partner with the role Carrier (app F4911).</li></ol><p>For the relevant business document types, an attachment schema configured to use the Attachment Service must also be assigned (H10). The shipper must also have configured SFP prerequisites, and maintained carrier text types so carriers can add notes (H10).</p><h2>Carrier response to freight agreement RFQs: in the Manage Freight Agreement RFQs app the carrier monitors RFQs by status, responds with rates or rejects participation, can download and upload a spreadsheet; the shipper then accepts or rejects rates, requests confirmation and creates or updates the freight agreement</h2><p><strong>Carrier side (H10, app Manage Freight Agreement RFQs).</strong> Monitor RFQs by status (for example open for response, waiting for carrier confirmation), view a worklist sorted by response deadline or a filterable list, respond with rates or reject participation, use a spreadsheet for rate details, and use attachments and notes. The uploaded spreadsheet is also attached to the RFQ.</p><p><strong>Process (H10):</strong></p><ol><li>The shipper creates the master (Create Freight Agreement RFQ Master app).</li><li>The shipper publishes it; the system creates and sends individual RFQs.</li><li>The system notifies each carrier.</li><li>The carrier evaluates and responds, or rejects participation; optionally downloads the spreadsheet, enters rates and uploads it.</li><li>The shipper monitors and reviews responses.</li><li>The shipper accepts or rejects the rates.</li><li>The shipper requests confirmation of the rates.</li><li>Once confirmed, the shipper creates or updates the freight agreement for the carrier.</li></ol><p>If the shipper does not want carriers to use the app, RFQ details can be exchanged by spreadsheet instead (H10; H08 describes the spreadsheet format).</p><p><em>Difference between sources:</em> S4TM3 describes carrier access through the SAP LBN (Logistics Business Network) with an individual user, where the Excel sheet is shown in the portal, downloaded, filled and uploaded. H10 describes the Manage Freight Agreement RFQs app with a collaboration user. The corpus does not say how the two relate, so check which channel applies in a given landscape.</p><h2>Carrier apps for order management: Manage Freight RFQs (accept, accept with proposed changes if the shipper allows it, or reject; accepting creates a freight quotation that can be revised within the deadline), Display Freight Quotations (pending, rejected, awarded), Confirm Freight Orders (Confirm with Changes, driver and vehicle details) and Manage Execution of Freight Orders (report planned and unplanned events and actual quantities; no events for a blocked freight order)</h2><p>These apps cover freight tendering, freight order confirmation and freight order execution in the subcontracting process (H10). Each requires the carrier collaboration prerequisites to be configured by the shipper.</p><table><thead><tr><th>App</th><th>What the carrier does</th></tr></thead><tbody><tr><td>Manage Freight RFQs</td><td>Sees open, closed and responded RFQs and the number due on the tile. Can accept without changes, accept with proposed changes to price, currency or start and end dates, or reject with a reason. Accepting with changes is available only if the shipper configured tendering settings to allow it. Accepting creates a freight quotation, which can be revised multiple times within the response deadline.</td></tr><tr><td>Display Freight Quotations</td><td>Lists quotations as pending (being evaluated), rejected or awarded, with details such as stops and cargo.</td></tr><tr><td>Confirm Freight Orders</td><td>Lists orders needing confirmation, confirmed or closed (canceled or completed). Updates driver and vehicle registration details. Can propose changes to confirmed start and end date and time, price limit or currency with Confirm with Changes.</td></tr><tr><td>Manage Execution of Freight Orders</td><td>Lists orders in execution, closed or blocked. Reports a planned event (for example Arrival or Loading Begin) or an unplanned event with a reason (for example Delay), at order, stop or tour-event level. Reports actual quantities of each item in a stop. Cannot report events for a blocked freight order.</td></tr></tbody></table><p>Order confirmation lets the carrier plan its workload independently of the tendering process (H10). H10 also lists settlement apps for carriers (Manage Charges for Freight Orders F7104, Manage Freight Orders for Invoicing F7732, Manage Freight Invoices F7106, Display Credit Memos F7502). These are outside this session's items and belong to the settlement session.</p><section class="practice"><h2>Practice</h2><p>Draw a one-page process map of strategic freight procurement from RFQ master to freight agreement. For each step show the shipper action, the carrier action, the document or status involved, and the app or report used. Use the four SFP steps as the frame and include publication, response, comparison, preferred strategy, Awarded status, and Create/Update Agreement.</p></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain how a shipper moves from a freight agreement RFQ master to a freight agreement, and what the carrier does at each step, to a procurement manager without notes?</p></section>` },
  { n:"09", title:"Charge Calculation and Freight Agreements", html:`<h2>Overview</h2><p>This session explains how TM turns a freight order into a calculated charge. The chain of master data is: scale base, scale, rate table, charge type, calculation sheet, and freight agreement. Around it sit the settings that decide which agreement and calculation sheet apply (profiles, preconditions, determination rules) and the calculation logic itself (resolution base, rate derivation, through rates, calculation methods). A consultant needs this chain because every cost shown on a freight order, and later settled with the carrier, traces back to it. The session closes with the hands-on example from exercise E05, which is the reference path for tracing one charge line.</p><h2>Scope of charge calculation in the course: master data for charge calculation, charge calculation and freight settlement processes on the buying side only; charge calculation for forwarding orders (selling side) is not covered</h2><p>The course (S4TM3) covers three things: master data for charge calculation, charge calculation, and freight settlement processes. The focus is on the buying side only. Charge calculation and settlement related to forwarding orders (the selling side) are not covered, and scenarios related to LSPs are not detailed (S4TM3).</p><p>Where this session mentions forwarding agreements or sales-side profiles, it does so only to place the freight agreement in context.</p><h2>Charge calculation determines the freight charge for a transportation scenario from conditions in the business rules framework, charge calculation master data and configuration items; the result goes back to the requesting document together with charge type, charge category or subcategory so accounting can determine organizational unit, cost or revenue receivers and general ledger account</h2><p>The transportation charge calculation process determines the freight charge for a given transportation scenario (S4TM3). S4TM3 gives example scenarios: a shipper asks a carrier to quote a move from a distribution center to a customer, an LSP receives a booking for a container between ports, a shipper moves product from plant to distribution center, or a shipper requests value-added services such as container cleaning and customs handling.</p><p>The charge is determined from conditions in the business rules framework, charge calculation master data and configuration items. The calculated charge goes back to the requesting document. Together with it the engine provides the charge type, charge category or subcategory, so that the receiving accounting processes can determine the organizational unit, the cost or revenue receivers and the general ledger account (S4TM3).</p><h2>Charge requests can come from the freight order, freight booking, service order, dispute, freight agreement RFQ, forwarding quotation, forwarding order, forwarding settlement document and freight settlement document</h2><p>S4TM3 lists the TM documents that can issue a charge request:</p><ul><li>freight order</li><li>freight booking</li><li>service order</li><li>dispute</li><li>freight agreement RFQ</li><li>forwarding quotation</li><li>forwarding order</li><li>forwarding settlement document</li><li>freight settlement document</li></ul><p>The freight agreement RFQ appears here because strategic freight procurement estimates spend with the same charge calculation machinery (see session 08, and H08 on the integration of RFQ masters with calculation sheets and rate tables).</p><h2>Charge Management master data: scale template, scale (a dimension of a rate table), rate table (rates by validity period), charge types (for example Haul, BAF, FSC), calculation sheet (hierarchical table combining permitted charge types and their sequence) and freight agreement</h2><p>S4TM3 describes the master data the system uses to calculate charges:</p><table><thead><tr><th>Object</th><th>What it is</th></tr></thead><tbody><tr><td>Scale template</td><td>Helps create scales easily</td></tr><tr><td>Scale</td><td>A dimension of a rate table</td></tr><tr><td>Rate table</td><td>A price list; a rate is valid only for the period defined by its validity; freight rates are maintained here by the scale specifications</td></tr><tr><td>Charge type</td><td>Describes a specific charge, for example Haul (Haulage), BAF (Bunker Adjustment Factor) or FSC (Fuel Surcharge)</td></tr><tr><td>Calculation sheet</td><td>A hierarchical table that combines the charge types permitted for a document and the sequence in which they are considered</td></tr><tr><td>Freight agreement</td><td>The contractual relationship between the service provider (or customer) and the requesting organizational unit; holds payment terms, limits, validity period and valid calculation sheets, plus organizational unit, contracting parties and conditions</td></tr></tbody></table><p>S48600 gives the same picture from the process side: freight agreements reference calculation sheets, and the calculation engine computes the charges and stores the result in the freight order (see session 01).</p><p>The practical reading order for a charge line is therefore: agreement, then calculation sheet, then charge type line, then rate table, then scales. Scale bases and calculation bases sit underneath and define how scales and logistical data are interpreted.</p><h2>Business example Road-Sea-Road: a sales order builds a freight unit, the planner creates stages (precarriage by truck Denver to Newark, main carriage by vessel Newark to Rotterdam, on-carriage by truck Rotterdam to Cologne); freight orders for the truck stages and a freight booking for the main carriage each get their own calculated amount used to pay the carrier</h2><p>S4TM3 uses a full container load sent by road and sea. A sales order is created in SD for the entire move, and on save the system builds a freight unit. The planner decides the routing and creates stages, each planned separately:</p><table><thead><tr><th>Stage</th><th>Move</th></tr></thead><tbody><tr><td>Precarriage</td><td>Truck from shipper origin (Denver) to port (Newark)</td></tr><tr><td>Main carriage</td><td>Vessel from port of loading (Newark) to port of destination (Rotterdam)</td></tr><tr><td>On-carriage</td><td>Truck from Rotterdam to the customer unloading location (Cologne)</td></tr></tbody></table><p>Two freight orders are created, one for precarriage and one for on-carriage. The amount calculated for these stages is used to pay the trucking carrier. A freight booking is created for the main carriage, and the amount calculated for it is used to pay the ocean carrier (S4TM3). The course then shows how the system calculates the Newark to Rotterdam booking charge from the master data.</p><p><em>Difference inside S4TM3:</em> the stage table says precarriage runs Denver to Newark, while the sentence after it says the precarriage freight order runs "Chicago to Newark". The corpus does not resolve this.</p><h2>Scale base: defines how the system interprets a scale and is defined in Customizing under Define Scale Bases; its fields include Field Assignment, UoM Relevant, Dimension (link to T006), Rounding Rule, Numeric, Crcy Scale base, Raw values and Date Scale Base; example WEIGHT with dimension Mass; a rate that depends on distance and weight needs a separate scale for each, and scales can be reused in several rate tables</h2><p>The scale base defines how the system interprets the scale. It is defined in Customizing for Transportation Management, Basic Functions, Charge Calculation, Data Source Binding, Define Scale Bases (S4TM3).</p><p>A scale defines a parameter that then defines a rate. If a rate depends on distance and weight, you define a separate scale for each. A scale can be reused in several rate tables. In the course figure the rate table has three dimensions (destination zone, origin location, weight in lbs), so three scales are defined (S4TM3).</p><p>Fields (S4TM3):</p><ul><li><strong>Field Assignment:</strong> the internal field from /SCMTMS/S_TCSCALE_ITEM_DB that stores the scale values for scales created with this scale base.</li><li><strong>UoM Relevant:</strong> checks whether the scale base is relevant for unit of measure.</li><li><strong>Dimension:</strong> link to the T006 dimension.</li><li><strong>Rounding Rule:</strong> whether a rounding rule applies to the scale.</li><li><strong>Numeric:</strong> whether the input scale value is numeric.</li><li><strong>Crcy Scale base:</strong> the scale base is for currencies (example: amount).</li><li><strong>Raw values:</strong> the scale base is for raw values (examples: business partner, location).</li><li><strong>Date Scale Base:</strong> the scale base is for dates.</li></ul><p>Example: scale base WEIGHT (description SCAVAL_WT), usage Base for Scales, UoM Relevant X, Dimension Mass, Rounding Rule X, Numeric X (S4TM3).</p><p>For unique requirements, a customer-specific scale base is added by extending the scale item structure (include /SCMTMS/INCL_EEW_TC_SCALE_ITEM), adding the scale base in Customizing, and enhancing the scale UI (S4TM3).</p><h2>Scale types and scale creation: Base scale (from a value upward, &gt;=), To Scale (up to a value, &lt;=) and Same Scale (exactly one value, =); a scale also has a scale unit of measure, a rounding profile and a calculation type (absolute for non-numeric scales such as region, transportation zone or business partner, relative for numeric scales such as weight, distance, length); scales are created in the Create Scale app or during rate table maintenance</h2><p>Scale maintenance is a prerequisite for rate maintenance, because scales are the dimensions of rate tables. Scale items can be configured by quantities, volumes, weights, distances or points. You can create scales as separate master data, which lets you reuse them in several rate tables, or during rate table maintenance (S4TM3). In the launchpad: Charge Management, Create Scale (S4TM3).</p><p>Data entered when creating a scale (S4TM3):</p><table><thead><tr><th>Field</th><th>Meaning</th></tr></thead><tbody><tr><td>Scale Base</td><td>The parameter that defines the rate, considered a dimension of the rate table (for example Length, Partner, Weight)</td></tr><tr><td>Scale Type</td><td>Base scale: from a certain value (&gt;=). To Scale: up to a certain value (&lt;=). Same scale: exactly one value (=)</td></tr><tr><td>Scale Unit of Measure</td><td>Unit for the scale levels, for example KG, LB, Day, Mile, KM</td></tr><tr><td>Rounding Profile</td><td>Before the rate lookup, the system rounds the input value by this profile to find the right scale level</td></tr><tr><td>Calculation Type</td><td>Absolute: for non-numeric scales such as Region, Transportation Zone, Business Partner. Relative: for numeric scales such as weight, distance, length</td></tr></tbody></table><p>A relative calculation type can be specified for numeric scale bases only (S4TM3). In E05, the scale S4LG1_WEIGHT is a numeric scale for which you specify the scale type (From Scale or To Scale), unit of measure and rounding profile, while S4LG1_COUNTRY is linked to a scale base for countries and its items list the countries (E05).</p><h2>Scale templates: optional help to create scales and predefine scale items; Customizing templates are transportable but cannot have items for Same Scales, master data templates can and need no Customizing authorization but cannot be transported</h2><p>A scale template creates a scale automatically, and its use is optional. Its advantages are predefined scale items, less manual work and fewer typos. It is an efficient way to create scales during rate table maintenance (S4TM3). A template holds a scale template name, the scale type and the scale base, and optionally scale template items.</p><table><thead><tr><th></th><th>Customizing template</th><th>Master data template</th></tr></thead><tbody><tr><td>Where</td><td>Customizing: Transportation Management, Basic Functions, Charge Calculation, Basic Settings, Templates, Define Scale Templates</td><td>SAP Fiori Launchpad</td></tr><tr><td>Transportable between systems</td><td>Yes</td><td>No</td></tr><tr><td>Items for Same Scales</td><td>Not possible (they depend on master data)</td><td>Possible</td></tr><tr><td>Authorization</td><td>Needs Customizing access</td><td>Users without Customizing authorization can create and use them</td></tr></tbody></table><p>In the Charge Management Worklist, master data and Customizing templates appear in their own queries (S4TM3).</p><h2>Calculation base: the actual base or factor on which a charge is calculated, defined for a scale base in Define Calculation Bases (for example W1 for gross weight and W2 for net weight under scale base Weight, or DESTLOC for the destination location); its fields include Field Assignment, Currency Field, Unit Field, Helper Assignment, Use BAdI, Party Role, Calculation Type, Calculation Usage and TrM Category</h2><p>A calculation base identifies the actual base or factor with which the system calculates charges for the scale (S4TM3). Gross weight and net weight both correspond to the scale base Weight (dimension mass) but are different charge aspects, so they get different calculation bases, for example W1 for gross weight and W2 for net weight. You define a calculation base for every scale base, and it is the final element in charge determination (S4TM3).</p><p>Location example (S4TM3): the scale has the scale base Location, which says the scale uses locations only and can serve for source and destination. The calculation base DESTLOC says the destination location of the freight order is used. If the resolution base in the calculation sheet points to the freight order stage, the system takes the value from that stage.</p><p>Customizing path: Transportation Management, Basic Functions, Charge Calculation, Data Source Binding, Define Calculation Bases. Fields (S4TM3):</p><ul><li><strong>Scale Base:</strong> the scale base used.</li><li><strong>Field Assignment:</strong> the internal field assignment of the logistical data.</li><li><strong>Currency Field:</strong> for currency-based calculation bases.</li><li><strong>Unit Field:</strong> for quantity-based bases such as weight, volume, pieces.</li><li><strong>Helper Assignment:</strong> the program logic that links to the data source.</li><li><strong>Use BAdI:</strong> select if customer-specific logic is needed.</li><li><strong>Party Role:</strong> when business partners are involved, for example consignee, sold-to or bill-to.</li><li><strong>Calculation Type:</strong> a default (absolute or relative); for same-scale bases it is absolute, quantity fields from/to are relative.</li><li><strong>Calculation Usage:</strong> manual charges, rate tables, or both (blank means no restriction).</li><li><strong>TrM Category:</strong> restricts the calculation bases in a rate table to those with the same transportation mode category as the charge type, and those with none.</li></ul><p><strong>Custom calculation bases.</strong> Extend the communication structure (include /SCMTMS/INCL_EEW_TCC_CB), add the calculation base in Customizing with the new field as field assignment, and set the scale base. If extra logic is needed, use method GET_CALC_BASE_VALUES of BAdI /SCMTMS/TCC_BO_DATA_ACCESS and set the BAdI flag, or use a helper class (interface /SCMTMS/IF_TCC_CALC_BASE). The source states: when creating a custom calculation base, it is always necessary to define a scale base for it (S4TM3). Often a new resolution base is also needed: add its name to table /SCMTMS/C_RES_BS (only the name is maintained) and implement logic in the BAdI.</p><h2>Resolution base: determined by the origin of the data a charge aspect is based on, with Root (document header), Stage, Container and Product as examples; for instance the gross weight of the order uses the root, and per-package freight uses the package</h2><p>During charge calculation the system determines the calculation resolution base by the origin of the data a charge aspect is based on (S4TM3). Examples:</p><ul><li><strong>Root:</strong> the header of the document, such as freight order, booking order or forwarding order.</li><li><strong>Stage:</strong> use stage attributes, for example the distance between shipper location and port of loading.</li><li><strong>Container:</strong> needed when an attribute stored at container level (for example equipment type 22GP or 42G0) is required, otherwise that information is not available for calculation.</li><li><strong>Product:</strong> when product attributes such as quantity, weight or volume must be used.</li></ul><p>To determine freight by the gross weight of the order, use the root. To calculate per package, use package (S4TM3). The resolution base is set on the Basic Data tab of a calculation sheet item, where logistical data can be booking, container, main item, package, root or document stage, optionally with a grouping rule (S4TM3).</p><p>In E05, the Handling Charge has the resolution base PRODUCT, which means the charge line is applied multiple times in the freight order, once for each product transported (E05).</p><p>How the four bases differ: the scale base says how a scale is interpreted, the scale is one dimension of a rate table, the calculation base says which value is used in the lookup, and the resolution base says from which part of the document that value is taken.</p><h2>Charge types: classify a charge line (for example base rate, surcharge, discount); settings include positive or negative value, absolute or percentage, charge category and subcategory, tax indicator, rounding, default calculation base, leading charge type, inactive flag and transportation mode category; categories and subcategories map to SD pricing condition types for billing and MM service activities for carrier invoice processing</h2><p>A charge type classifies a charge line, for example base rate, surcharge or discount, and it matters for how the system calculates that line (S4TM3). Define charge types in Customizing: Transportation Management, Basic Functions, Charge Calculation, Basic Settings, Define Charge Types.</p><p>Settings (S4TM3):</p><ul><li>Positive or negative result.</li><li>Absolute or percentage value, or decide each time the charge type is assigned.</li><li>Charge category and charge subcategory.</li><li>Tax indicator.</li><li>If and how the system rounds the value.</li><li>A default calculation base, so you need not assign one for each calculation sheet line.</li><li>Leading charge type: it must have a value for the system to calculate the charges.</li><li>Inactive: the type cannot be used for new calculation sheets or rate tables.</li><li>Transportation mode category, which restricts the charge types in a calculation sheet to those with the same category as the agreement, and those with none.</li><li>Descriptions in several languages, and extra values for air freight or forwarding charges.</li></ul><p><strong>Categories and subcategories.</strong> Charge types can be grouped into categories and subcategories (freely definable). S4TM3 names the UN/EDIFACT codelist 5237 as a useful code list for categories, and UN/EDIFACT Recommendation 23 (Freight Cost Code) for subcategories. They are defined under Basic Settings, Define Charge Categories and Define Charge Subcategories.</p><p><strong>Mapping into S/4HANA.</strong> Charge types, categories and subcategories are mapped to pricing condition types in SD used for customer billing, and to service activities in MM used for carrier invoice processing (S4TM3).</p><h2>Rate tables: a price list grouped by validity period (business object /SCMTMS/TC_RATES), up to 14 dimensions though not recommended, with rate table determination rules to reduce dimensions; created manually, from rate table templates, or maintained in Microsoft Excel; Create Rate Table Definition defines the structure and Maintain Rate Table maintains rates; minimum and maximum values, calculation rules, the No Value Allowed flag for generic rates, and an optional approval workflow</h2><p><strong>Concept.</strong> A rate table is a grouping of prices, like a price list, with rates listed by validity period. It is a separate business object (/SCMTMS/TC_RATES) usable in several calculation sheets. You can maintain up to 14 dimensions but S4TM3 does not recommend modelling that way. A rate table determination rule can be used to decide which rate table applies to the current charge item and so reduce dimensions. Create manually, from a rate table template with predefined scales and validity dates, or maintain a large table in Microsoft Excel (S4TM3).</p><p><strong>Templates.</strong> A Customizing template (Define Rate Table Templates) needs the template name, charge type or multiple charge types, charge usage and currency; template scales need dimension number, scale template and calculation base code; an optional calculation rule needs calculation base, unit of measure and quantity. Master data templates carry similar data and can also hold scale items and values for non-numeric scales (S4TM3).</p><p><strong>Two apps.</strong> Create Rate Table Definition (Charge Management) defines the structure; Maintain Rate Table maintains rate information, and scale definition is not available there. This lets different users define structure and maintain rates (S4TM3).</p><p><strong>Structure (S4TM3).</strong></p><ul><li>General Data: the rate table identifier (unique), the charge usage (billable to your customer, or billed to you by your carrier, matching the agreement and calculation sheet) and the charge type. A rate table is assigned to a charge item only if the charge type matches.</li><li>Scales tab: one dimension per scale, with the calculation base for each scale. Minimum and maximum value checkboxes make the system charge the minimum if the calculated value is below it and the maximum if above. A checkbox, Rel. Calc. Method (Relevant for Calculation Method), marks the table for special methods such as break-weight or clipping.</li><li>Dates and Values tab: Valid From and Valid To and a rounding profile.</li><li>Calculation Rules tab: the values the single rate is multiplied by. With several rules, the rate is multiplied by each. If a relative scale is involved, Relative Scale Items Only must be selected on at least one rule.</li><li>Rate values: maintain single values, or the recommended Excel flow (create empty table, download to xlsx, maintain, upload).</li></ul><p><strong>No Value Allowed.</strong> Lets you upload rates that are generic across several dimensions, for example carrier-agnostic rates where no carrier-specific rate exists. The flag has priority from the last dimension scale to the first, and is available only for same-scale (S4TM3).</p><p><strong>Approval workflow.</strong> Can be activated per rate table type. The rate administrator requests approval instead of releasing; the validity interval status becomes "Awaiting Approval", a SAP Business Workflow task notifies a manager, and once approved the interval is released. The organizational model must be maintained (S4TM3).</p><p><strong>Updating rates.</strong> The Update Rates function (also the program /SCMTMS/RATE_MASS_UPDATE, and the Master Data Cockpit under Charge Management Worklist) can raise or lower rates by a percentage or amount, limited to a scale range already present in an existing validity period, and by calculation type (absolute, relative or both) (S4TM3). For validity periods you can change one, several or all, or create a new validity period inside or outside existing ones; by default the new period copies rate, calculation rule and scale item settings from the latest period, and it can be released automatically (S4TM3).</p><h2>Calculation sheet: charge usage in the general data; hierarchy items with instruction types Sum, Subtotal, Standard and Compare High/Low Value; each item has Rate, Basic Data (manual charge item, resolution base, rounding and adjustment profiles, dimensional weight profile, calculation method), Classification (mandatory, tax, statistical charge) and Preconditions tabs; a percentage item must refer to another item or subtotal</h2><p>The calculation sheet is a hierarchical table that combines the charge types permitted for a document and the order in which they are considered. It serves both to bill customers and to pay carriers, and it lets documents show charges, subtotals and totals (S4TM3). Launchpad: Charge Management, Create/Edit Calculation Sheet.</p><p><strong>Data.</strong> General data holds charge usage (valid for customer and/or service provider). Hierarchy items give the instruction, charge type and calculation instructions. Preconditions and general terms are set when the sheet is assigned to the freight agreement (S4TM3).</p><p><strong>Instruction types (S4TM3).</strong></p><ul><li><strong>Sum:</strong> total of all lines below. Every sheet has an initial mandatory sum line that cannot be deleted; only its rounding rule can be maintained.</li><li><strong>Subtotal:</strong> amount of all lines between a reference-from and a reference-to line.</li><li><strong>Standard:</strong> a direct charge when it refers to a charge type.</li><li><strong>Compare High/Low Value:</strong> evaluates which of two or more lines counts, by highest or lowest value, with the Operation attribute. With High, the most expensive item stays and cheaper ones are deactivated.</li></ul><p>A charge type can give a positive (surcharge) or negative (discount) value. If an item is a percentage, it must refer to another item or subtotal that produces an absolute value (S4TM3).</p><p><strong>Item tabs (S4TM3).</strong></p><ul><li><strong>Rate:</strong> Amount (if filled, the item is not derived, it always equals this amount); currency or %; reference-from and reference-to lines for minimum or maximum substitution; Rate Table Determination Rule; fixed Rate Table; Calculation Rule; Index Table (for example for fuel surcharge).</li><li><strong>Basic Data:</strong> Charge Type; Manual Charge Item (no calculation, manual entry expected); External Calculation Flag (external engine such as SMC3); logistical data specification (stage category, shipping type, dangerous goods); Resolution Base; Rounding Profile; Adjustment Profile (for example so only chargeable weight is used); Dimensional Weight Profile (for example factor 166 or 194, or metric); Calculation Method Type and Method.</li><li><strong>Classification:</strong> Mandatory (a warning if it cannot be calculated; an error at invoice creation before transfer to MM if a mandatory item cannot be calculated), Tax, Statistical Charge (informational only).</li><li><strong>Preconditions and Notes:</strong> a precondition rule checks whether items are processed according to the logistical data source.</li></ul><p>E05 shows this on calculation sheet S4TM1_CALCSHET_CAR10 (see the E05 item below).</p><h2>Agreements: forwarding agreements (FWA) for charges billable to the customer, freight agreements (FA) for charges billed by the carrier, internal agreements (IA) between organizations of a company, and service agreements as a type of freight agreement; contractual data covers organizational unit, parties, payment terms and validity; the agreement type Customizing sets allowed item types, default calculation sheet template, multiple parties and allocation type</h2><p>Agreements are the basis for calculating transportation charges and can involve one or more parties (S4TM3).</p><table><thead><tr><th>Agreement</th><th>Use</th></tr></thead><tbody><tr><td>Forwarding agreement (FWA)</td><td>Charges billable to your customer</td></tr><tr><td>Freight agreement (FA)</td><td>Charges billable to you by your carrier</td></tr><tr><td>Internal agreement (IA)</td><td>Charges between organizations of the same company code and of different company codes in the same company</td></tr><tr><td>Service agreement</td><td>A type of freight agreement containing only service types or service products</td></tr></tbody></table><p>The sales organization appears on sales-side documents (forwarding documents, OTRs, DTRs, forwarding settlement documents); the purchasing organization appears on freight orders, freight bookings, service orders and freight settlement documents (S4TM3).</p><p><strong>Contractual data (S4TM3):</strong> organizational unit, involved parties (for example ordering party or carrier), terms of payment, validity dates. The agreement type Customizing sets, among others: allowed item types, preconditions on the agreement (for example transportation mode or service level), a text schema for notes, the default calculation sheet template, multiple parties allowed (one freight agreement with a carrier valid for several purchasing organizations), calendars, the allocation type for transportation allocations, and enabling the Change Document tab.</p><p>E05's freight agreement FRAGR_S4TM1_CAR10 shows on the General Data tab the agreement version, parties (purchasing organization and carrier), validity period, agreement priority and document currency, with items below that can have a deviating validity, each with a calculation sheet (E05).</p><h2>Agreement determination: by organization, business partner, validity period and preconditions; with several matches a leading charge type or the agreement priority decides; preconditions on agreement items are built-in (trade lanes, partners, item precondition) or BRFplus/BAdI; calculation profile determination types Minimum Charges, Maximum Charges and Determine All Agreements enable manual selection; condition types TCM_FAGDET and TCM_FAGDEX determine or exclude agreements</h2><p><strong>Standard determination.</strong> The system determines the agreement from organization, business partner, validity period and preconditions. Most commonly this is purchasing organization plus carrier for freight agreements and sales organization plus customer for forwarding agreements. A BRF+ condition can be used for complex rules (S4TM3).</p><p><strong>Several matches.</strong> A leading charge type (set in charge type Customizing) can be used: the first agreement where it can be calculated is picked. Agreement priority (General Data tab, details section) defines the sequence in which the subsequent determination runs (S4TM3; S48600 states the same). S4TM3 explains why several agreements exist: an LSP can strike deals with the same carrier at country, regional and global level, and a better rate can sit in a country-level contract.</p><p><strong>Preconditions on agreement items (S4TM3).</strong> Either built-in or BRFplus/BAdI. A BRFplus condition or BAdI returns true or false, and if true the calculation sheet is considered. Built-in preconditions: Trade Lanes (source or destination location or zone, mode or means of transport; the item can be activated or deactivated), Partners (item activated or deactivated by business partner), and Item Precondition (up to seven predefined conditions).</p><p><strong>Manual selection (S4TM3).</strong> An enhancement to the automated standard. It allows choosing an agreement or agreement item, plus automatic selection of the minimum or maximum item through the calculation profile (Define Calculation Profiles, agreement determination type):</p><ul><li><strong>Minimum Charges:</strong> the system finds the final amounts of all agreement items and chooses the item with the minimum final amount.</li><li><strong>Maximum Charges:</strong> the same, choosing the maximum.</li><li><strong>Determine All Agreements:</strong> the system shows all relevant agreements and items for each charge item and you select.</li><li>Blank: standard determination.</li></ul><p>The Multiple Agreements pop-up is not supported for through rates.</p><p><em>Difference inside S4TM3:</em> an earlier page calls the selection type that lets you pick manually "Display All Agreements", while the example scenarios page calls it "Determine All Agreements". The Customizing value names should be checked in the system.</p><p><strong>Charge calculation rules (S4TM3).</strong> Condition types TCM_FAGDET (freight agreement determination, standalone) and TCM_FAGDEX (freight agreement exclusion). With TCM_FAGDET the standard logic (organization, validity, partner) is ignored and the condition is used; the Std Determ. checkbox falls back to standard determination if the condition fails or returns nothing. Maintained via Maintain Charge Calculation Conditions. TCM_FAGDEX checks the automatically determined agreements one by one for applicability (condition and BAdI option); if more than one remains, the agreement priority is used. It can be embedded in the calculation profile or kept in the agreement under General Data, Details. The same rule mechanism also supports calculation sheet determination, preconditions for sheets and items, grouping rules for resolution bases, rate table determination rules and charge-by-formula rules (BRFplus or BAdI returns the amount directly) (S4TM3).</p><h2>Calculation profile and charges profile: the calculation profile sets the date type for rate and validity, the calculation level (header, item or stage), determination rules, through rates, dimensional weight profile and data source (actual or ordered route); a charges profile assigned to a purchasing organization groups it with the settlement and cost distribution profiles; a profile on a business partner role takes precedence over one on the organizational unit; the freight order type must enable charge calculation</h2><p><strong>Calculation profile</strong> (Customizing: Basic Functions, Charge Calculation, Basic Settings, Define Calculation Profiles). It is the central place for the settings used in charge calculation (S4TM3):</p><ul><li>the date type used as basis for rate, exchange rate, agreement validity and charge calculation (for example order date, invoice date, expected end date of main carriage);</li><li>the calculation level: header, item or stage;</li><li>the determination rule for agreement and calculation sheet;</li><li>through rates across several stages;</li><li>the default dimensional weight profile and its determination condition;</li><li>the data source for calculation and invoicing: actual route, ordered route, or actual and ordered route;</li><li>the agreement determination type (see above).</li></ul><p><strong>Charges profile.</strong> Enables charge calculation for a purchasing organization. It groups the calculation profile, the freight settlement profile, the cost distribution profile and the local currency of the business documents. It is created in Define Charges Profiles, where the calculation profile is assigned and then flows to the organizational unit the charges profile is assigned to (S4TM3).</p><p><em>Difference between sources on the assignment transaction:</em> S4TM3 names transaction PPOCE for assigning the charges profile to the purchasing organization, while S48600 and H08 name PPOME. The material does not say which is right for a given release.</p><p><strong>Assignment rules (S4TM3).</strong></p><ul><li>A purchasing calculation profile is needed on the buying side (freight order and freight booking). A forwarding house needs both sales and purchasing profiles, and one profile can serve both.</li><li>Calculation profiles can also go on the business partner roles sold-to party, ship-to party, carrier and vendor (Define Business Partner, Vendor/Transportation Purch. Org. Data tab, or BP).</li><li>If a profile is assigned to both the organizational unit and a business partner role, only the one on the business partner role applies. You can assign a profile to the organizational unit alone, but not to a business partner alone.</li></ul><p><strong>Freight order type settings (S4TM3, Define Freight Order Types).</strong> Enable Charge Calculation must be selected for the system to calculate (manual charges can still be entered, and the quoted price of awarded freight quotations can be updated). Calculate Charge After Each Save runs the calculation on every save, and if a mandatory charge type cannot be determined, the order cannot be saved. The same settings exist for freight booking and service order types. S48600 adds that charge calculation must be enabled in the corresponding freight document type Customizing to activate it.</p><h2>Calculation process: collect data from the transaction object, configuration, BRF+ conditions, master data and BAdIs, determine the freight agreement, then the calculation sheet, calculate each charge type, keep a log and show results in the freight order; rate derivation determines calculation base and rate table, reads logistical data, determines the date baseline, finds the matching rate table record and calculation rule, and calculates the amount; the transportation zone rate is found by going up the zone hierarchy</h2><p><strong>Freight order charge calculation (S4TM3; S48600).</strong></p><ol><li>Collect data from TM core objects: the transaction business object (freight order, freight booking, service order, stage, item, container), configuration objects, BRF+ conditions, master data and any BAdI implementation.</li><li>Determine the freight agreement.</li><li>Determine the calculation sheet within the agreement (listed as its own step in S48600; S4TM3's list moves straight to calculating the values).</li><li>Calculate the value of each charge type in the calculation sheet.</li><li>Keep the log file of the calculation run.</li><li>Show the results in the freight order.</li></ol><p><strong>Freight rate derivation (S4TM3).</strong></p><ol><li>From the calculation sheet line item, determine the calculation base and the rate table.</li><li>From the dimensions (scales) of the rate table, obtain the logistical data.</li><li>From the calculation profile, determine the baseline for date determination.</li><li>Obtain the matching rate table record and then the appropriate calculation rule.</li><li>Calculate the freight rate amount.</li></ol><p><strong>Zones.</strong> Rates need not be maintained for every value; they can sit at the appropriate level. The system goes up the zone hierarchy until it finds a rate (S4TM3). A location can belong to several transportation zones (example in S4TM3: Hamburg in a Germany zone and a Hamburg zone). The engine compares the zones one by one and returns the first rate it finds, with no priority among rates.</p><p><strong>Estimation.</strong> In the Fiori Launchpad you can do carrier selection and charge estimation with minimal data: origin, destination and purchasing organization are named as required (S4TM3).</p><h2>Special calculation features: through rates across several stages (carrier-dependent, enabled in the calculation profile), header-level charges alongside stage-level calculation, and calculation methods such as break-weight (cheaper next rate) and clipping (level-by-level totals, one scale item relative)</h2><p><strong>Through rates (S4TM3).</strong> A through rate covers several stages, or the whole route, and is applied if available, depending on Customizing. With several stages and different carriers, the calculation is carrier-dependent, and through rates can be maintained across stage categories without overlap. Example: a Door-Port rate (A to B and B to C) negotiated with Carrier 1 including haulage, while the on-carriage C to D belongs to Carrier 2; the system finds a through rate for A to C for Carrier 1 and a rate for C to D for Carrier 2. The functionality must be enabled in the calculation profile. Compared with stage-by-stage calculation, one rate then covers several stages instead of one rate per stage.</p><p><strong>Header and stage level (S4TM3).</strong> Some charges cannot be assigned to a stage and apply to a business partner, for example unloading fees. A "mixed" calculation level lets the system calculate header-level charges for an agreement item independently while the rest is calculated by stage. It needs a calculation profile with the calculation level set to stage. Example: in an FOB incoterm scenario the consignee bears security charges across main and on-carriage, defined as header-level charges in a separate calculation sheet.</p><p><strong>Calculation methods (S4TM3).</strong> Specified per charge type in the calculation sheet (Basic Data tab, calculation method type), defined in Customizing under Basic Functions, Charge Calculation, Enhancements to Charge Calculation Engine, Define Calculation Methods. Examples named: break-weight, clipping, fuel surcharge, deficit weight rating, most expensive main carriage, internal charge calculation and external systems.</p><ul><li><strong>Break-weight:</strong> the system compares the next rate with the current rate and applies the cheaper one.</li><li><strong>Clipping:</strong> the system works through all scale levels one by one and adds up the results. One scale item must have a relative calculation type. Worked example: levels up to 5 t at USD 50 absolute, up to 7 t at USD 14 per ton, up to 10 t at USD 13 per ton, up to 15 t at USD 12 per ton. A 12-ton load costs 50 + 28 + 39 + 24 = USD 141 with clipping, and USD 144 (12 t at USD 12) without it.</li></ul><h2>Hands-on example in E05: freight agreement FRAGR_S4TM1_CAR10 with calculation sheet S4TM1_CALCSHET_CAR10; rate table BASE_RATE_00 with scales S4LG1_COUNTRY (countries) and S4LG1_WEIGHT (up to 100, 200, 500, 1.000, 5.000 and 999.999.999 kg); Update Rates with simulation mode and Excel download and upload; Calculate Charges in the freight order shows the agreement, calculation sheet, rate table, rate amount and calculation rules</h2><p>The exercise (E05) walks through the chain from the contract down to one charge line:</p><ol><li><strong>Agreement.</strong> The Freight Agreements Worklist app lists agreements with parties, validity and release status. Open FRAGR_S4TM1_CAR10: General Data shows version, purchasing organization and carrier, validity, priority and currency. The single item points to a calculation sheet.</li><li><strong>Calculation sheet.</strong> In the Charge Management Worklist, query All Calculation Sheets, open S4TM1_CALCSHET_CAR10. Items include the Basic Freight Charge and the Handling Charge. The Basic Data tab shows manual or calculated, and rounding and adjustment profiles. The Rate tab holds a rate amount, a rate table or a rate table determination rule. The Classification tab shows category, subcategory, mandatory, statistical and tax. The Handling Charge has the resolution base PRODUCT.</li><li><strong>Rate table.</strong> In Edit Rate Table Definition, BASE_RATE_00 has two dimensions: destination country and gross weight. The Dates and Values tab holds validity periods (initially one, 01.07.2021 to 31.12.9999) and the rate table. The Calculation Rules tab specifies how the rates are applied (the exercise notes rates charged per distance for a distance of 100 km).</li><li><strong>Scales.</strong> In Edit Scale: S4LG1_COUNTRY is linked to a scale base for countries, with the countries as items. S4LG1_WEIGHT is numeric, with scale type, unit and rounding profile, and items up to 100, 200, 500, 1.000, 5.000 and 999.999.999 kg.</li><li><strong>Update Rates.</strong> Raise rates by 10% in a new validity period for calendar year 2025 (01.01.2025 to 31.12.2025). First run with simulation mode selected and check that all messages are green, then repeat with simulation off. Result: the initial validity period is divided into three: 01.07.2021 to 31.12.2024 (old rates), 01.01.2025 to 31.12.2025 (new rates) and from 01.01.2026 (old rates). For destination country AT the first two rates go from 120 EUR and 60 EUR to 132 EUR and 66 EUR.</li><li><strong>Excel.</strong> On the Excel Integration tab, download the rate table for all validity periods (the workbook is protected, so change values but not the structure, with one sheet per validity period). Change a cell to 135, add rates for FR (country codes are checked with a value list), save, upload, save, and check the Dates and Values tab: AT minimum is now 135 EUR and the FR rates are added.</li><li><strong>Calculate Charges.</strong> In freight order 200000109, choose Calculate Charges, expand all, and select a charge with Show/Hide Details. The Overview tab shows the agreement, calculation sheet, rate table, rate amount and calculated amount; the Calculation Rules tab shows the basis, for example the Basic Freight Charge based on a net weight of 5.180 KG with the rate determined per 10 KG, and the second Handling Charge based on 2 pieces at a rate per 1 PC. A 50 EUR waiting time surcharge is then added manually. In the worklist, selected freight orders move from Not Calculated to Calculated with a net amount in document currency.</li></ol><section class="practice"><h2>Practice</h2><p>Draw a diagram of the charge calculation master data chain (scale base, scale, rate table, charge type, calculation sheet, freight agreement). Annotate it with the E05 example objects (FRAGR_S4TM1_CAR10, S4TM1_CALCSHET_CAR10, BASE_RATE_00, S4LG1_COUNTRY, S4LG1_WEIGHT) and list the steps the system takes to calculate one charge line in a freight order.</p></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain how TM turns a freight order into a calculated charge, from agreement determination to the rate table lookup, to a logistics manager without notes?</p></section>` },
  { n:"10", title:"Settlement", html:`<h2>Overview</h2><p>Settlement is where the transportation plan turns into money documents. TM calculates the charges, but it does not invoice or pay anything itself: it creates settlement documents and hands them to other modules. A freight settlement document (FSD) goes to Materials Management (MM) so the carrier invoice can be verified. A forwarding settlement document (FWSD) goes to Sales and Distribution (SD) so a customer can be billed. Internal settlement documents move cost between organizations of the same company. This session covers the three document types, how a shipper differs from a logistics service provider (LSP), the statuses that tell you where a document stands, and how late changes, cost distribution, self-billing and disputes work (H09, S48600, S4TM3).</p><h2>The four business requirements settlement covers (H09, Use): a freight settlement document created in TM for transportation services provided by a carrier and transferred to Materials Management (MM), where received invoices are verified against it; a forwarding settlement document that bills a customer and is transferred to Sales and Distribution (SD), which sends the invoice; an internal settlement document for a transportation service provided by an internal organization of the company; and an internal settlement document for the resources used in a freight order and provided by another internal organization.</h2><p>H09 (Use) lists four requirements that settlement meets:</p><ol><li><strong>Towards the carrier.</strong> TM creates a freight settlement document for the transportation services a carrier provides to you and transfers it to Materials Management (MM). You verify the invoices you receive from the carrier against the information in the freight settlement document.</li><li><strong>Towards the customer.</strong> TM creates a forwarding settlement document to bill a customer for transportation services you provide. TM transfers it to Sales and Distribution (SD), and SD sends the invoice to the customer.</li><li><strong>Between internal organizations, for a service.</strong> An internal settlement document for a transportation service provided to you by an internal organization of your company. That organization bills you to recover the cost of the service it provided when you fulfilled a forwarding order for a customer.</li><li><strong>Between internal organizations, for resources.</strong> An internal settlement document for the resources you use in a freight order, billed to you by another internal organization of your company.</li></ol><p>A compact way to remember the direction of each document:</p><table><thead><tr><th>Direction</th><th>Document</th><th>Posted to</th></tr></thead><tbody><tr><td>Towards a customer</td><td>Forwarding settlement document (FWSD)</td><td>SD</td></tr><tr><td>Towards a carrier</td><td>Freight settlement document (FSD)</td><td>MM</td></tr><tr><td>Between internal organizations</td><td>Internal settlement document</td><td>SD (intercompany) or financial accounting (intracompany)</td></tr></tbody></table><p><em>What the material does not establish:</em> H09 notes that the group logistics scenario in system internal integration is not released, and the internal settlement for resources section states that its features are not yet released.</p><h2>Settlement for shippers versus settlement for logistics service providers (LSPs): a shipper follows the freight settlement process with its carrier or LSP and can add cost distribution to allocate freight cost to each order or delivery item for financial accounting and controlling (H09, Settlement for Shippers). An LSP combines forwarding, freight and internal settlement documents</h2><p><strong>Shipper.</strong> For a shipper, the carrier or LSP provides a freight transportation service. The shipper follows the freight settlement process with that carrier or LSP. It can also use cost distribution to spread the freight cost down to each individual order or delivery item in the freight order, so the cost reaches financial accounting and controlling. The system does the distribution when it creates the FSD, and the FSD with the distributed costs is posted to MM and to settlement management. When the carrier's invoice arrives, the shipper verifies its amount against what was transferred to MM, and pays if they match (H09, Settlement for Shippers).</p><p><strong>LSP.</strong> An LSP sells transportation to customers and buys it from carriers, so it combines all three documents. H09 (Settlement for LSPs in an Ocean Freight Scenario) describes an LSP whose sales organizations take forwarding orders, and an internal gateway organization that runs a container freight station, consolidates shipments from different sales organizations and books with the ocean carrier. The gateway creates an intercompany internal settlement document against the sales organization to recover the ocean booking cost and extra costs such as consolidation. Only the sales organization is in contact with the customer.</p><p>In H09's terms, a gateway is both a sales organization for internal sales and a purchasing organization for buying freight services from carriers, usually the main carriage.</p><h2>The three agreement types and who the parties are in the ocean freight example: forwarding agreements (export station and shipper, import station and ship-to party, export station and import station), freight agreements (each station or gateway with its carrier) and an internal agreement (gateway and export station)</h2><p>H09 (Agreements) sets out the agreements behind the ocean freight example. The key abbreviations: STA is a station (usually the sales organization of an LSP), STA-NUE the export station at Nuremberg, STA-DLS the import station at Dallas, CFS-RTM the Rotterdam export gateway.</p><table><thead><tr><th>Agreement type</th><th>Parties</th><th>Reason</th></tr></thead><tbody><tr><td>Forwarding agreement</td><td>Export station (organization) and import station (business partner)</td><td>Provide main carriage services</td></tr><tr><td>Forwarding agreement</td><td>Export station (organization) and the shipper CU-NUE (business partner)</td><td>Move the cargo from Nuremberg to Rotterdam as agreed in Incoterm FOB</td></tr><tr><td>Forwarding agreement</td><td>Import station (organization) and ship-to party CU-DLS (business partner)</td><td>Freight services from Rotterdam to the ship-to party location in Dallas</td></tr><tr><td>Freight agreement</td><td>Export station and Carrier 1</td><td>Pre-carriage</td></tr><tr><td>Freight agreement</td><td>Rotterdam gateway CFS-RTM and ocean Carrier 2</td><td>Ocean freight</td></tr><tr><td>Freight agreement</td><td>Import station and Carrier 3</td><td>On-carriage</td></tr><tr><td>Internal agreement</td><td>Gateway CFS-RTM (organization) and export station (business partner)</td><td>Main carriage and other consolidation services</td></tr></tbody></table><p>The pattern: forwarding agreements run towards the sold-to side (customers, or internal stations acting as customers), freight agreements run towards carriers, and the internal agreement sits between the gateway and the export station.</p><p><em>Source note:</em> the H09 text spells the stations inconsistently (STA-NUE and STA-NEU, STA-DLS and STA-DLA, Newark CFS-NWK); read them as the same stations.</p><h2>Prepaid and collect agreement parties and Incoterms in the example: with FOB to Rotterdam the shipper pays the pre-carriage, the ship-to party pays main carriage and on-carriage, and the business unit closest to the external customer settles with that customer</h2><p>In the example the customer in Dallas uses Incoterm FOB to Rotterdam (H09, Incoterms). The shipper CU-NUE in Nuremberg pays the pre-carriage. The ship-to party CU-DLS in Dallas pays the main carriage and the on-carriage.</p><p>In the forwarding order the shipper CU-NUE is the <strong>prepaid agreement party</strong> and the Dallas impo
