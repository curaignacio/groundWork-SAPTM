Synchronous; idempotency Yes, No or Not Applicable; namespace http://sap.com/xi/TMS/Global; application components such as TM-GT-GTS, TM-ERP-TR, TM-FWM-FWO and TM-FRM-FRO (H14).</p><p>For example, Request Export Declaration is Released, ExportDeclarationSUITERequest_Out, Outbound, Asynchronous, idempotency No, P2P communication enabled Yes (H14).</p><p><em>What the material does not establish:</em> the tables give the values but do not define idempotency or P2P communication in prose in the parts read.</p><h2>Release state of an operation is shown as Released or Released with Restrictions; the technical name carries a direction suffix such as _Out or _In (for example ExportDeclarationSUITERequest_Out and TransportationRequestRequest_In)</h2><p>Release State is a field in each operation's Technical Data. Both values appear throughout H14. Request Export Declaration and Change Transportation Order based on Export Declaration Confirmation are Released. Request Transportation Customs Declaration, Maintain Transportation Request in the forwarding-order interface, and Check Transportation Request Ordering Party Creditworthiness are Released with Restrictions (H14).</p><p>The suffix of the technical name matches the direction: ExportDeclarationSUITERequest_Out is outbound, and TransportationRequestRequest_In and ExportDeclarationSUITEConfirmation_In are inbound (H14). The suffix is a quick way to read direction before opening the table.</p><p><em>What the material does not establish:</em> the sections read do not explain what the restrictions are. They are not defined in the text, so check the operation page itself (for example its Constraints and Prerequisites sections) before relying on an operation.</p><h2>Worked example of an outbound/inbound pair: Request Export Declaration (outbound, asynchronous) sends parties, items, means of transport, Incoterms and related document IDs to a customs management application, and Change Transportation Order based on Export Declaration Confirmation (inbound) receives the export declaration ID, the movement reference number (MRN) and an approval indicator and updates the order and its customs status</h2><p><strong>Request.</strong> A shipper needs an export declaration to transport customs-relevant goods. Request Export Declaration sends the request to a customs management application. It sends the parties (for example seller and consignee), the items with packaging and quantities, the means of transport, the Incoterms and the IDs of related documents such as a sales order or outbound delivery. The message type is ExportDeclarationSUITERequest (H14).</p><p><strong>Trigger.</strong> The operation is triggered in the SAP TM back end when a customs declaration is requested for items in an order. For a freight order, the order must have the execution status defined in the customs profile and must be based on a delivery-based transportation requirement (H14).</p><p><strong>Customs side.</strong> The customs management application creates the export declaration and sends it to the customs authority. If the authority approves it, it issues a movement reference number (MRN) (H14).</p><p><strong>Confirmation.</strong> The customs application sends a confirmation (ExportDeclarationSUITEConfirmation) containing the export declaration ID, the MRN and an indicator showing whether the declaration is approved. Change Transportation Order based on Export Declaration Confirmation (ExportDeclarationSUITEConfirmation_In, inbound, asynchronous) adds the ID and MRN to the order and updates its customs status. It also handles a confirmed cancellation: it updates the status of the customs activity and a new export declaration can be requested later. Its prerequisite is that Request Export Declaration has sent the request (H14).</p><p><strong>Related operations.</strong> Request Export Declaration Cancellation (ExportDeclarationSUITECancellationRequest_Out) is the outbound partner for cancelling. Both operations exchange data with Customs Processing operations in SAP Global Trade Services (components TM-GT-GTS and SLL-LEG-CUS-EXP) (H14). A newer, more general pair, Request Transportation Customs Declaration and Change Transportation Order Based on Transportation Customs Declaration Confirmation, covers export, import and transit declarations and security filing (H14).</p><h2>Inbound operations support Forward Error Handling (FEH) with error categories such as DCE (Determination and Conversion Error), PRE (Processing Error) and PRE.TEE.LRE (Lock Request Error); Maintain Transportation Request also writes missing-master-data errors to the business application log</h2><p>Inbound operations in H14 have an Error Handling section stating that they support Forward Error Handling (FEH) and listing the categories used (H14):</p><table><thead><tr><th>Category</th><th>Meaning in H14</th></tr></thead><tbody><tr><td>DCE</td><td>Determination and Conversion Error</td></tr><tr><td>PRE</td><td>Processing Error</td></tr><tr><td>PRE.TEE.LRE</td><td>Lock Request Error (in some operations written "Lock Error")</td></tr></tbody></table><p>H14 refers to the code list of the global data type LogItemCategoryCode for details of each category. Not every inbound operation lists all three: Change Transportation Order based on Export Declaration Confirmation lists only DCE and PRE, while Maintain Transportation Request lists all three (H14).</p><p>The forwarding-order variant of Maintain Transportation Request also checks, for example, whether the required master data exists, and displays errors in the business application log if it does not (H14). In the integration scenario TM_ERPInvoiceIntegration, a step that SAP TM or SAP ERP cannot process triggers an error in the system concerned (H14).</p><p><em>What the material does not establish:</em> how FEH is operated (monitoring, reprocessing) is not described in the parts read, only that the operations support it.</p><h2>Implementation notes: carriers and customers must be defined as business partners in the SAP TM back-end system, with standard IDs recommended for business partners, locations and products; outbound communication needs a logical system with an Outbound Queues queue type assigned in Customizing for SCM Basis (Integration Basic Settings for Creating the System Landscape)</h2><p><strong>Master data.</strong> In Transportation Order Processing you define your carriers as business partners in the SAP TM back end; in Transportation Request Processing you define your customers. H14 gives the path in SAP NetWeaver Business Client as Master Data, General, Define Business Partner. SAP recommends standard IDs for each business partner and for each location and product involved (H14, Master Data for B2B Communication).</p><p><strong>Customizing for outbound.</strong> For outbound communication such as the trade compliance check, you define a logical system for the client that sends the messages and assign a queue of type Outbound Queues to it in Customizing for SCM Basis under Integration, Basic Settings for Creating the System Landscape, Assign Logical System and Queue Type. The logical system must be marked as an SAP system, and you also check Name Logical Systems, Assign Logical Systems to a Client, Maintain Business System Group and Settings for qRFC Communication (H14, Trade Compliance Check Requesting Out).</p><p><strong>Other prerequisites.</strong> Depending on the operation: a connection to SAP Global Trade Services for customs and trade compliance, a connection to SAP Credit Management plus credit segments for the creditworthiness check, a connection to SAP ERP for order and delivery integration, and an EDI communication profile for notification messages (H14).</p><h2>Enhancements: operations list a BAdI (for example /SCMTMS/EXP_SE_EXPDE_REQ for ExportDeclarationSUITERequest_Out) and some an enhancement spot (/SCMTMS/CDC_SE_SPOT_CDC)</h2><p>Operations have an Enhancements section naming the Business Add-Ins that can adapt them. Examples (H14):</p><table><thead><tr><th>Operation</th><th>Enhancement</th></tr></thead><tbody><tr><td>Request Export Declaration (ExportDeclarationSUITERequest_Out)</td><td>BAdI /SCMTMS/EXP_SE_EXPDE_REQ</td></tr><tr><td>Change Transportation Order based on Export Declaration Confirmation</td><td>BAdI /SCMTMS/EIN_SE_EXPDE_ANS</td></tr><tr><td>Request Transportation Customs Declaration</td><td>Enhancement spot /SCMTMS/CDC_SE_SPOT_CDC and BAdI /SCMTMS/CDC_SE_CDC_REQ</td></tr><tr><td>Change Transportation Order Based on Transportation Customs Declaration Confirmation</td><td>Enhancement spot /SCMTMS/CDC_SE_SPOT_CDC and BAdI /SCMTMS/CDC_SE_CDC_CNF</td></tr><tr><td>Request Trade Compliance Check</td><td>BAdI /SCMTMS/CPC_SE_CPC_REQ</td></tr><tr><td>Maintain Transportation Request (A2A)</td><td>BAdI /SCMTMS/TRQ_SE_REQREQ</td></tr><tr><td>GetTransportationDocumentURI</td><td>BAdI /SCMTMS/TDO_IF_SE_GET_URI</td></tr></tbody></table><h2>Additional ESR content: integration scenarios such as TM_ERPInvoiceIntegration live in the SAPTM IC software component in namespace http://sap.com/xi/TMS/Global/IC; mappings are named &lt;Message name in SAP TM&gt;_to_&lt;IDoc type in SAP ERP&gt; or the reverse</h2><p><strong>Integration scenarios.</strong> H14 section 4.1 says the integration scenarios are in the ESR in the SAPTM IC software component in namespace http://sap.com/xi/TMS/Global/IC. Two are described: TM_ERPInvoiceIntegration and TM_ERPOrderIntegration.</p><p>TM_ERPInvoiceIntegration transfers settlement documents from SAP TM to SAP ERP to create billing documents or accruals. It uses asynchronous steps between an SAP TM and an SAP ERP system of the same company (H14):</p><ul><li>Forwarding Settlement: SAP TM requests a billing document in SAP ERP from a forwarding settlement document; SAP ERP creates, changes or cancels it and confirms; SAP TM updates the document. A credit memo can follow in the same way.</li><li>Freight Settlement: SAP TM requests accruals (a service purchase order and one or more service entry sheets) from a freight settlement document; SAP ERP confirms; SAP TM updates the document.</li><li>Invoice Notification: SAP ERP notifies SAP TM that a supplier invoice was received, and SAP TM updates the posted amounts.</li><li>Invoice Simulation: SAP TM asks SAP ERP for data to preview a customer invoice or credit memo.</li></ul><p>SAP TM can start communication at any time with Send Forwarding Settlement Request or Send Freight Settlement Request. SAP ERP can start with Send Invoice Notification only after it has processed a freight settlement request, and with Simulate Customer Invoice only if the customer invoice has not yet been created (H14).</p><p>TM_ERPOrderIntegration transfers orders and deliveries from SAP ERP to SAP TM as transportation requirements, and lets SAP TM propose deliveries to be created in SAP ERP (H14).</p><p><strong>Mappings.</strong> Interface mappings and message mappings are in the same component and namespace. They follow one of two naming conventions, depending on direction: <code>&lt;Message name in SAP TM&gt;_to_&lt;IDoc type in SAP ERP&gt;</code> or <code>&lt;IDoc name in SAP ERP&gt;_to_&lt;message name in SAP TM&gt;</code> (H14, Mappings). For example, TransportationOrderSCMExecutionRequest_to_SHPMNTSHPMNT05 maps a TM message to the IDoc SHPMNT.SHPMNT05. The freight order ID is mapped to field TKNUM, so it becomes the ID of the ERP shipment, which requires external number ranges for the relevant shipment types. Shipment type and transportation planning point are set by value mapping in the Integration Directory of the PI system (H14).</p><h2>The Web service GetTransportationDocumentURI (namespace http://sap.com/xi/TMS/UX) is an inbound, synchronous operation that lets SAP ERP display SAP TM documents, for example from invoice verification (MIRO, MIR7, MIR4) and agency business (WLF3, WZR3)</h2><p>GetTransportationDocumentURI is listed in section 3, Other Web Services, with namespace http://sap.com/xi/TMS/UX, available as of SAPTM 1.0, category Inbound, mode Synchronous (H14).</p><ul><li><strong>Invoice verification (MIRO, MIR7, MIR4).</strong> From the ERP transaction you can display a specific freight settlement document in the browser, for example to check an incoming carrier invoice against it.</li><li><strong>Agency business (WLF3, WZR3).</strong> You can display a specific freight order or freight settlement document, for example when creating a payment or vendor billing document. This is relevant for shippers using the cost distribution function in SAP TM.</li></ul><p>The SAP TM inbound operation is triggered by the outbound operation of the same name in SAP ERP, which requests the URL of a business document. SAP TM generates the URL from the document type and number and returns it, and the caller opens the browser (H14).</p><p>Prerequisites: the business function LOG_TM_IV_INT in SAP ERP for invoice verification (it adds the TM Doc. tab with a Details pushbutton), the business function LOG_TM_ORD_INT_II for agency business, and point-to-point communication set up between the two operations (see SAP Note 1451472) (H14).</p><p>A second synchronous inbound web service, BusinessDocumentFlowTMInformationbyBusinessObjectReferenceQueryResponse_In, returns TM document flow and statuses for an ERP order or delivery (H14).</p><h2>BRFplus provides an API and a UI to define and process business rules and reuse them in different applications; typical uses are validation, matching responsibilities or products, calculation of costs, overhead and risks, and technical configuration</h2><p>BRFplus provides a comprehensive application programming interface (API) and user interface (UI) for defining and processing business rules, modeled in an intuitive way and reusable in different applications. Scenarios named in H15 are: validation of data and detection of invalid data and states; matching responsibilities, suitable products and locations; calculation of costs, overhead and risks; and BRFplus as a technical configuration engine. It supports simulation, trace, transport and XML export and import (H15, Use).</p><p>H15 also states that BRFplus is an ABAP-based framework, best suited for integration into an ABAP-based environment. For Java-based environments or SOA landscapes it names SAP Business Rules Management (SAP BRM) as an alternative; the two can call each other, and BRFplus web services can still make sense when most data sits in an ABAP back end (H15, BRFplus Overview).</p><p><em>What the material does not establish:</em> this document does not say which SAP TM functions use BRFplus. Do not link them from memory.</p><h2>BRFplus major components are application, function, catalog, expression, action and data object; the function is the interface between the rule and the calling application and holds the business logic; rules are implemented as expressions assigned to a function</h2><p>H15 lists the major components as application, function, catalog, expression, action and data object. The function is the interface between a business rule and the application that uses it. It serves as a container for the entire business logic, however complex. Rules are implemented as expressions that are assigned to a function (H15, Use).</p><p>The function acts as a link between application code and BRFplus code. It imports the context from the calling application, passes it to the assigned top expression or rulesets, and returns the result. The workbench can generate an ABAP code snippet, an RFC-enabled function module or a web service to call a function (H15, Function).</p><h2>A function has a context (rule input) and a result (rule output), both made of data objects of type element, structure or table; it can run in functional mode, event mode, or both</h2><p>The rule input is the <strong>context</strong> and the rule output is the <strong>result</strong>. Both consist of data objects of type element, structure or table (H15, Use).</p><ul><li>The context is a container of data objects assigned as import parameters. You choose them to suit the calling application, and they also define which objects the expressions of the function can access.</li><li>The result data object returns the value calculated by the function's expressions. In event mode the result is automatically the predefined Actions table, which records the actions triggered by the rulesets (H15, Function).</li></ul><table><thead><tr><th>Mode</th><th>How it runs</th></tr></thead><tbody><tr><td>Functional mode</td><td>Needs a top expression. The function evaluates it, with any nested expressions, and the expression result is the function result. Typical for simpler cases with a clear output</td></tr><tr><td>Event mode</td><td>Uses rulesets instead of a top expression. Rules whose condition is met trigger actions. Typical for more complex cases and where no result is needed</td></tr><tr><td>Functional and Event mode</td><td>A top expression and a result data object are mandatory. The top expression is processed first, then the associated rulesets run, possibly changing the context</td></tr></tbody></table><p>(H15, Function; Modes of Operation)</p><h2>Data object types build on each other: an element is an elementary type, a structure combines elements and structures, and a table takes the fields of one structure (or of one element, giving a one-column list); data objects can be bound to DDIC elements or ESR global data types</h2><p>H15 (Data Objects and Types) says a data object describes data and acts as a data carrier in the context or result of an expression or action.</p><ul><li><strong>Element.</strong> A predefined elementary type that cannot be broken down or extended. Subtypes include text (up to 255 characters when persisted), number, boolean, amount, quantity and timepoint.</li><li><strong>Structure.</strong> A combination of any number of elements and structures, so structures can be nested. A practical limit applies: if the fully qualified name of a field in a deeply nested structure exceeds 255 characters, code generation is no longer possible.</li><li><strong>Table.</strong> Its fields come from exactly one element or one structure. A table does not build up its fields one by one. Assigning an element instead of a structure gives a one-column table, that is, a simple list.</li></ul><p><strong>Data binding.</strong> Instead of defining a type manually, a data object can be bound to a DDIC element, structure or table type, to a global data type (GDT) in the ESR, or to an existing BRFplus element. Binding imports the type, length and domain values, for instance ISO country codes from a DDIC data element, and keeps reused values consistent. A DDIC structure or table type is imported with all its fields, with the client field and raw fields filtered out. A DDIC NUMC field is always turned into a text data object. Binding to GDTs is currently supported only for a limited scope of SAP-internal development projects (H15, Data Binding).</p><h2>Expression types (for example Boolean, Case, Decision Table, Decision Tree, Formula, Value Range) define the computational power of BRFplus; a decision table compares input against condition rows from the top and returns the result of the first row where all cells match, so the most specific rows belong first</h2><p>Expression types define the computational power of BRFplus. Each type is a self-contained computational unit with its own logic, and expressions can be nested and reused as building blocks, starting with the top expression of a function. The predefined types are Boolean, BRMS Connector, Case, Constant, DB Lookup, Decision Table, Decision Tree, Dynamic, Formula, Function Call, Loop, Procedure Call, Random Number, Search Tree, Table Operation and Value Range. Step Sequence and XSL Transformation are deprecated (H15, Expressions).</p><p><strong>Decision table.</strong> It compares input against a list of predefined condition combinations, each with an assigned result (H15, Decision Table Expression).</p><ol><li>Evaluation starts with the first row. Each cell gives a boolean result.</li><li>If all cells in a row are true, evaluation stops and the result of that row is returned.</li><li>Otherwise processing continues with the next row until a match or the end of the table.</li></ol><p>Because of this top-to-bottom processing, define the most specific condition first and then increasingly general ones. H15's example has a payment target of 60 days for region Europe alone and 30 days for Europe and Germany. If the region-only row comes first, Germany wrongly gets 60. The check functions detect many such errors, and the Rearrange function moves cells with unspecified values to the bottom (H15).</p><p>Other settings: by default (single match mode) the first matching row wins; with Return all matches found (multiple match mode) all matching results are collected and the result data object must be a table. If nothing matches, an exception is raised unless Return initial value if no match is found is set (H15).</p><h2>Actions are the interactive part of BRFplus (Call Procedure, Log Message, Send Email, Start Workflow, Workflow Event); they have no output and can only be the final step of a processing branch</h2><p>Actions are a special flavor of expression types for the interactive part of BRFplus. They can be triggered by a rule, by a matching condition in a decision table, decision tree, search tree or case expression, or as a follow-up action of another action. Actions have no output, so they can only be the last step of a branch; no calculation can follow an action as a response to what it changed. Action type names carry a trailing (Act) and a verb-object pattern, as in Call Procedure (Act) as opposed to the Procedure Call expression (H15, Actions).</p><table><thead><tr><th>Action</th><th>What it does (H15)</th></tr></thead><tbody><tr><td>Call Procedure</td><td>Runs function modules or methods of an ABAP OO class in the back end. Like all actions it returns no result, and follow-up actions can be defined</td></tr><tr><td>Log Message</td><td>Writes system messages to the application log during rule processing, for example for documentation or audit. Message types are Abort, Error, Exit, Information, Status and Warning, subject to restrictions set on the application</td></tr><tr><td>Send Email</td><td>Notifies a person about a situation in the system</td></tr><tr><td>Start Workflow</td><td>Starts a workflow</td></tr><tr><td>Workflow Event</td><td>Raises a workflow event</td></tr></tbody></table><p><em>What the material does not establish:</em> the Start Workflow and Workflow Event actions are only named in the part of H15 read for this item, and are not described there.</p><h2>A rule (If condition with a True branch and an optional False branch) can only be triggered inside a ruleset; a ruleset is assigned to one function in event mode, with priority 0 to 99 controlling execution order</h2><p><strong>Rule.</strong> A rule object is the technical form of a simple business rule. It consists of an embracing If condition: the True branch is required and the False branch is optional. A rule can only be triggered in the context of a ruleset and never stand-alone. Its operations are triggering an action, processing an expression whose result can update the context, and initializing or updating context data objects (H15, Rule).</p><p>A rule has no context of its own. It uses the context of the ruleset it is in. Because one rule can be assigned to many rulesets, it can access only the context data objects that all referencing rulesets share, that is, their intersection (H15).</p><p><strong>Ruleset.</strong> A ruleset is a collection of rules and an entry point for processing, an alternative to a top expression. It must be assigned to a function in event mode or in functional and event mode. A function can have any number of rulesets, but a ruleset has exactly one function, and the relationship is stored from the ruleset's side (H15, Ruleset; Function).</p><p><strong>Priority.</strong> With several rulesets, execution follows the priority value, 0 to 99. The list is sorted ascending, so the lowest value runs first. The default 0 means no priority and is processed after all rulesets with a priority above 0. Rulesets run one after another, never in parallel, and no ruleset can stop the next one (H15, Function).</p><p>Several levels decide whether a rule runs: the function is called, the ruleset is enabled, the ruleset precondition holds, the rule precondition holds, the rule is enabled, the current date is in the validity period, and the precondition of the activity holds (H15, Ruleset).</p><h2>A catalog is a filter that hides the repository and shows business users only the objects needed to maintain rules; an application is the container for all objects and has a storage type (system, master data or customizing) that cannot be changed after creation</h2><p><strong>Catalog.</strong> It simplifies rule maintenance for business users by hiding the repository and showing only the objects needed in a business scenario. It serves as a filter on all repository objects. A typical business catalog offers, for example, decision tables, while functions, data objects, constants, formulas and actions stay invisible. A catalog can contain folder nodes, object nodes (references to BRFplus objects) and catalog nodes (references to nodes of another catalog) (H15, Catalog).</p><p><strong>Application.</strong> It is a container of BRFplus objects, a reflection of a system functionality you want to enhance with rules. It sits at the top of the object hierarchy, and every object must be assigned to an application. You can define as many applications as you like (H15, Application).</p><p><strong>Storage type.</strong> There are three: system application (default), master data application and customizing application. They behave differently in system transports, and master data applications are always local. The storage type and the locality setting are inherited by all objects in the application. The storage type is chosen when the application is created and cannot be changed afterwards (H15, Application).</p><h2>Typical BRFplus workflow: create an application, create a function with context, result and top expression, activate the objects, simulate the function, then integrate it with the calling application; the workbench is started with transaction BRFPLUS</h2><p>The workflow in H15 (Typical Workflow):</p><ol><li>Create an application, the BRFplus object that collects all objects of the business logic.</li><li>Create a function, assign context and result to it, and assign a top expression.</li><li>Activate the objects.</li><li>Simulate the function.</li><li>Integrate the BRFplus function with your application. Here "application" means your own solution, not the BRFplus object.</li></ol><p>The workbench is started in the back end with transaction BRFPLUS or in a browser with the system-specific workbench URL. It is based on Web Dynpro ABAP and needs the role SAP_BC_FDT_ADMINISTRATOR or a custom role with a subset of its authorizations. It has a Navigation Panel and a Work Area, and two UI modes: Simple Mode (recommended for business users) and Expert Mode (for business experts and developers) (H15, Understanding the User Interface).</p><section class="practice"><h2>Practice</h2><p>Build a one-page reference table with five enterprise service operations taken from H14. For each, record the process component, the business object, the direction, the mode, the release state and the related operation. Good candidates from this session are Request Transportation Order, Maintain Transportation Request (forwarding order), Request Export Declaration, Change Transportation Order based on Export Declaration Confirmation, and Request Trade Compliance Check. Then add a short BRFplus sketch of one rule of your choice, showing the application, the function, the context data objects, the result data object and the top expression.</p></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain how SAP TM exchanges transportation orders and requests through enterprise services, and how BRFplus rules are structured, to a technical colleague without notes?</p></section>` },
  { n:"15", title:"Clean Core and RISE with SAP Methodology", html:`<h2>Overview</h2><p>This session explains why SAP promotes a clean core for cloud ERP, what "clean core" means across five dimensions, how the implementation type affects it, and how the RISE with SAP Methodology helps customers get the core clean and keep it clean. It draws on two courses: MCC100, which defines and explains clean core, and SL_RISE419, which describes the RISE with SAP Methodology, its framework, toolchain, expert guidance and dashboard. In practice you meet this material in project governance, extension decisions and go-live quality checks. The two courses speak about SAP Cloud ERP in general, and this session does not add links to SAP TM.</p><h2>Why a clean core is needed: a cloud ERP such as SAP Cloud ERP receives updates continuously, so extensions and integrations must be managed differently from on-premise SAP ERP; SAP developed the clean core concept for this</h2><p>SAP's ERP software traditionally ran in the customer's own data center. SAP Cloud ERP is a cloud-native solution that combines current industry best practices with continuous innovation. Because a cloud ERP such as SAP Cloud ERP receives updates on a continuous basis, customers need a slightly different approach to extensions and integrations than in an on-premise environment. SAP developed the "clean core" concept for customers to follow, so that the effectiveness of SAP Cloud ERP is maximized (MCC100, Adjusting Business Models).</p><p>The same point returns in the later units. As a cloud-based solution, SAP Cloud ERP means customers must take a modified approach to extensions, integrations and operations compared with on-premise SAP ERP (MCC100, Introduction to Unit 2). In practice this explains why custom code, modifications and old interfaces become a problem: they must survive updates that the customer does not schedule. The sources do not describe an update frequency.</p><h2>The challenges behind clean core fall into three areas: business adaptability (supply chain disruptions, changing customer preferences, regulatory compliance), technological change, and landscape complexity</h2><p>MCC100 groups the challenges into three areas, one lesson each in Unit 1.</p><table><thead><tr><th>Area</th><th>What the lesson covers</th></tr></thead><tbody><tr><td>Business adaptability</td><td>Disruption of supply chains, changing customer preferences and regulatory compliance</td></tr><tr><td>Technological change</td><td>New technological advancements, accelerating innovation, optimizing and automating business processes, fostering agility</td></tr><tr><td>System landscapes</td><td>Business model adaptations, key application adjustments, responding to changing customer needs; the need for a simple, flexible infrastructure, helped by cloud computing and agile development</td></tr></tbody></table><p>(MCC100, Lessons 1 to 3 of Unit 1)</p><p>MCC100 closes each lesson with the same answer: SAP Cloud ERP is the solution for business change, for technological challenges and for landscape challenges, through its extensibility and integration capabilities (MCC100).</p><p><em>Source note:</em> the plan calls the third area "landscape complexity"; MCC100 itself frames the third lesson as adapting system landscapes and the need for a simple and flexible infrastructure.</p><h2>Business model and supply chain pressure: supply chain disruptions (natural disasters, geopolitical tensions, COVID-19) expose single-source vulnerability, and businesses must pivot business models quickly without the technology landscape being an impediment</h2><p>Global supply chains are the backbone of many industries, and disruptions affect production schedules, inventory levels and customer satisfaction. Natural disasters, geopolitical tensions and events like COVID-19 exposed their vulnerabilities. Businesses that rely on a single source of supply for critical components or materials are vulnerable, and any disruption can have a domino effect on production. Responses named include diversifying supply sources, strong supplier relationships, risk management strategies, and digital technologies such as advanced analytics and supply chain visibility platforms (MCC100, The Impact of Disruptions in Global Supply Chains).</p><p>On the business model side, entire new markets can appear without warning and the first mover often reaps most of the profits. Companies must be able to pivot their business models quickly and their technology landscape must not be an impediment (MCC100, Adapting Business Models).</p><p>MCC100 illustrates this with the Heidelberg Hotel chain during COVID-19. Napkins and masks were hard to procure, guests wanted contactless check-in and phone-based room access, and regulations changed quickly. The hotel adopted SAP Cloud ERP and, thanks to fast deployment and a modern approach to extensions, could move "on the fly" (MCC100, Case Study).</p><h2>SAP Cloud ERP and SAP BTP are the response: SAP manages updates, security, compliance and scalability, SAP Cloud ERP is extensible and offers ready-to-go APIs, and SAP BTP is a cloud-native platform as a service that brings together AI, machine learning, data, analytics, database and DevOps</h2><p>For technological change, MCC100 says SAP manages all updates, so customers do not need extensive IT resources or face business disruption. Security, compliance and scalability are built into SAP S/4HANA Cloud, and backup and disaster recovery, system maintenance and data protection are handled automatically (MCC100, SAP ERP, Clean Core, and Technological Innovation).</p><p>For landscape flexibility, the cloud may seem to limit options, but SAP Cloud ERP is extensible and provides ready-to-go APIs with supporting tools and documentation, so customers can integrate with partners or build on top. Continuous innovation does not compromise that flexibility. Alongside it, SAP BTP is a modern cloud-native platform as a service that brings together artificial intelligence, machine learning, data, analytics, database, DevOps and more in a unified environment (MCC100, SAP Cloud ERP, SAP BTP and Landscape Flexibility).</p><h2>Definition of clean core: core means five dimensions (processes, extensions, data, integrations, operations); clean means best practices, methodologies and tools exist for each; the clean core concept is a mindset and philosophy supported by governance and guiding principles; the goal is to get the core clean and then keep it clean</h2><p><strong>Core.</strong> "Core" refers to five dimensions, or pillars, in no particular order: Processes, Extensions, Data, Integrations, Operations (MCC100, Analyzing Clean Core Components). SL_RISE419 lists the same five and describes them as: processes (sequences of actions in an end-to-end flow), extensions (extra functionality beyond standard), data (configuration, master and transactional data), integrations (communication and data exchange between solutions) and operations (ongoing governance and monitoring) (SL_RISE419, Clean Core Fundamentals).</p><p><strong>Clean.</strong> For each dimension a set of best practices, methodologies and tools exists. If they are used, the dimension counts as clean (MCC100). SL_RISE419 adds that the SAP Activate roadmap provides tasks, deliverables and accelerators that keep each dimension clean (SL_RISE419).</p><p><strong>Clean core.</strong> The video transcript in MCC100 calls it "a mindset and philosophy supported with governance and guiding principles" that lays the foundation for a flexible, future-ready ERP, with stable, upgrade-safe and transparent approaches to processes, extensions, integrations and data, plus a separate platform to innovate. It enables faster deployment, easier adoption of SAP innovations and regulatory changes, and avoids excess technical debt. The goal is to "get" the core clean and then "keep" it clean (MCC100).</p><p>MCC100 adds that SAP Cloud ERP with a clean core is so fundamental that "with a clean core" is implied whenever the course says SAP Cloud ERP (MCC100, SAP Cloud ERP and Clean Core).</p><h2>A newly provisioned SAP Cloud ERP system is clean by definition; the ideal state is an up-to-date release with cloud-compliant extensions and integration, excellent master data quality and perfect process design</h2><p>The best case is an up-to-date system on the latest release, with cloud-compliant extensions and integration, excellent master data quality and perfect process design. A newly provisioned SAP Cloud ERP system is clean per definition, and the customer's goal is then to keep the core clean. For customers choosing a system conversion or system landscape transformation, the goal is to get and then keep the core clean (MCC100, Clean Core Components).</p><p>SL_RISE419 states it slightly more narrowly: by default a newly provisioned SAP S/4HANA Cloud system, Public or Private Edition, that uses standard processes from SAP Signavio Process Navigator is considered clean (SL_RISE419, Clean Core Fundamentals). MCC100 does not include the Signavio Process Navigator condition.</p><h2>Components or distinguishing features of a clean core are minimalism, modularity, scalability, maintainability, and stability and reliability</h2><p>Both courses give the same five features (MCC100, Components of a Clean Core; SL_RISE419, Clean Core Fundamentals):</p><table><thead><tr><th>Feature</th><th>Meaning</th></tr></thead><tbody><tr><td>Minimalism</td><td>Simplicity: identify and remove redundant or obsolete functionality so only essential components remain</td></tr><tr><td>Modularity</td><td>The ERP system is divided into modular, loosely coupled components, for easier maintenance and adaptability</td></tr><tr><td>Scalability</td><td>The system can grow and change without losing performance or stability</td></tr><tr><td>Maintainability</td><td>A simpler code base that developers can understand, modify and enhance more easily</td></tr><tr><td>Stability and reliability</td><td>Fewer dependencies, so the system is less prone to bugs and inconsistencies</td></tr></tbody></table><p>MCC100 illustrates the contrast with ABC Manufacturing, a company with a bloated, heavily customized ERP, performance problems and high maintenance cost. It chose a system conversion to SAP Cloud ERP Private, removed customizations, add-ons and integrations that no longer fit, and planned a later new implementation, with a midterm horizon of about five years (MCC100).</p><h2>Implementation types: greenfield (new installation, clean by default), brownfield (system conversion to private edition or on-premise, retained complexity must be cleaned) and selective data transition or system landscape transformation (consolidating several ERP systems); the public edition cannot be chosen in a brownfield approach, and clean core can be accomplished with all approaches</h2><p>MCC100 starts from three options for SAP S/4HANA: SAP S/4HANA Cloud Public Edition, Private Edition and on-premise (MCC100, Describing Implementation Types and Clean Core). Where the course says "private edition" it applies equally to on-premise unless stated.</p><table><thead><tr><th>Approach</th><th>What it is</th><th>Clean core consequence</th></tr></thead><tbody><tr><td>Greenfield</td><td>New installation or provisioning in public edition, private edition or on-premise</td><td>A new system starts clean by default. Full freedom to design processes on current and future needs. Viable if the company can adopt processes on current best practices with a fit-to-standard approach</td></tr><tr><td>Brownfield</td><td>System conversion of an existing system to private edition or on-premise. The public edition cannot be chosen</td><td>Retains historic complexity and possibly unwanted customizations, so the system does not start clean. The strategy is to identify which parts of the legacy system to retain, eliminate or transform, and do it. Viable when complex processes are necessary and costly to redesign</td></tr><tr><td>Selective data transition or system landscape transformation</td><td>Consolidates configuration and data of multiple ERP systems, often after mergers and acquisitions, into one private edition or on-premise target</td><td>Third option, not explicitly discussed further</td></tr></tbody></table><p>Clean core can be accomplished with all approaches; the choice only affects how to get there. Public edition is described as ready-to-run, private edition and on-premise as tailored-to-fit. Greenfield is the simplest route to a clean core but not always appropriate; the choice correlates with business context, resources and tolerance for change (MCC100).</p><h2>Misconceptions: SAP BTP is not the only means (key user and developer extensibility on stack are possible); clean core is not only about custom code and extensibility; it is not only about TCO; fit-to-standard is not the only way, since Tier 1 extensibility also keeps the core clean</h2><p>MCC100 names four misconceptions (MCC100, Some Misconceptions About Clean Core):</p><ol><li>"SAP BTP is the only means." BTP is necessary for side-by-side extensions, but key user and developer extensibility, both on stack, are possible with SAP Cloud ERP.</li><li>"Clean core is only about custom code and extensibility." It also affects business processes, data, integration and operations.</li><li>"Clean core is only about TCO." It contributes to lower TCO but also enables consumption of the latest innovations and a mindset shift away from on-premise and towards cloud.</li><li>"Fit-to-standard is the only means." A fit-to-standard system is probably clean, but Tier 1 extensibility options also make and keep the core clean.</li></ol><p><em>Source note:</em> SL_RISE419 says that maintaining cleanliness involves building extensions on SAP BTP, separating them from the core ERP software (SL_RISE419, Clean Core Fundamentals). That is narrower than misconception 1 in MCC100, which stresses that on-stack extensions are also clean core compliant. The two courses emphasize different options; they do not state a conflict explicitly.</p><h2>Benefits for users (performance, reliable data, stability, flexible processes), for IT (no technical debt from legacy systems, software stack always at the latest release, extensions that do not break upgrades) and for the company (streamlined operations, cost savings, improved decision-making, enhanced collaboration)</h2><p>MCC100 Unit 3 follows a fictional production company, The Gritty Pixel, through a greenfield implementation of SAP S/4HANA Cloud with SAP BTP, from three viewpoints.</p><ul><li><strong>Users (Jane, a production clerk).</strong> Performance: processes are harmonized with no interfaces between sales, production and inventory, so the former batch jobs run as real-time applications. Data: reliable and up to date. Stability: release management is integrated in daily operations, with few inconsistencies and little downtime. Processes: clear but flexible, based on SAP best practices.</li><li><strong>IT (Klaus, developer and interface owner).</strong> Technical debt disappears with the retirement of legacy systems. The core software stack is always at the latest release and updates arrive automatically with a notification. Business processes based on SAP Best Practices are clean core compliant from the start, so revalidation meetings after upgrades are no longer needed. With the ABAP Cloud Development Model and the SAP S/4HANA Cloud Extensibility Model, upgrades do not break extensions and extensions do not break upgrades.</li><li><strong>Company (Fatima, Chief Customer Officer).</strong> Streamlined operations, cost savings, improved decision-making and enhanced collaboration. A single platform replaced fragmented systems, and SAP BTP provided the platform for her machine-learning proposal.</li></ul><p>(MCC100, Unit 3)</p><h2>Clean business processes: mantra 'Keep competitiveness while reducing complexity'; establish organizational structure, technical foundation and transformation methodology, set up a prioritized business process hierarchy with end-to-end and functional views; tools named include SAP LeanIX, SAP Cloud ALM, SAP Signavio Process Manager and SAP Signavio Process Governance</h2><p>Mantra: "Keep competitiveness while reducing complexity." The aspects of this dimension (MCC100, Clean Business Processes):</p><ol><li><strong>Establish organizational structure, technical foundation and transformation methodology.</strong> Define roles and responsibilities, for example in a process transformation office; set up an end-to-end toolchain connecting Enterprise Architecture Management, Business Process Management and Application Lifecycle Management; establish guidelines for governing process enhancements.</li><li><strong>Set up a prioritized and segmented business process hierarchy,</strong> with end-to-end views (how data flows through the organization) and functional views (activities within each function). Clustering examples are commodity, differentiating and innovating.</li><li><strong>Align to-be process design and technical realization.</strong> Use best practices where possible, govern the to-be process, requirements and design approvals centrally, and link design, testing, realization and rollout to the to-be process.</li></ol><p>Tools named:</p><table><thead><tr><th>Tool</th><th>Role (MCC100)</th></tr></thead><tbody><tr><td>SAP LeanIX</td><td>Visualize the IT application landscape, find obsolete applications, design a target state, plan architecture roadmaps</td></tr><tr><td>SAP Solution Manager and SAP Cloud ALM</td><td>Accelerate time to value and reduce TCO. SAP Cloud ALM is cloud-native, to implement SAP cloud solutions and operate cloud and hybrid landscapes</td></tr><tr><td>SAP Signavio Process Manager</td><td>Modeling platform for business process management</td></tr><tr><td>SAP Signavio Process Governance</td><td>Turns process models into standardized governance workflows</td></tr><tr><td>SAP Signavio Process Insights and Process Intelligence</td><td>Discover improvement and automation potential</td></tr><tr><td>SAP Activate, SAP Signavio Process Explorer, SAP Signavio Process Collaboration Hub</td><td>Methodology, preconfigured best practice processes, collaboration</td></tr></tbody></table><h2>Clean extensions: mantra 'Keep the extensions clean'; extensions are on-stack (Key User type 1, Developer type 2) or side-by-side on SAP BTP (type 3), may only use released APIs, BAdIs and extension points, and cloud-enabled technologies (ABAP Cloud); the Clean Core Level Concept evolves the 3-Tier model into Levels A, B, C and D</h2><p>Mantra: "Keep the extensions clean." Guiding principles: avoid extensions when possible; create decoupled extensions under strong governance; custom extensions do not break an upgrade and upgrades do not break an extension; separate extensions by using released APIs; use on-stack and side-by-side extensibility; create technical debt only as an informed decision (MCC100, Clean Extensions).</p><p>The SAP S/4HANA Cloud extensibility model rests on three principles:</p><ol><li>Extensions are implemented either internally as <strong>on-stack</strong> extensions (Key User type 1, Developer type 2) or externally as <strong>side-by-side</strong> extensions on SAP BTP (type 3). Types 1 and 2 are used when close coupling is needed, type 3 when looser coupling is acceptable.</li><li>Extensions may only use released local or remote public APIs, BAdIs and ABAP RESTful Application Programming Model business object extension points.</li><li>Extensions may only use cloud-enabled and released technologies. The ABAP Cloud Development Model enforces this: only approved object types, ABAP Cloud language and released API usage enforced by syntax check, and ABAP development tools for Eclipse.</li></ol><p><strong>3-Tier model (first generation).</strong> Tier 1: ABAP Cloud and the extensibility model, mandatory for public edition and recommended otherwise. Tier 2: private edition and on-premise, wrapping an unreleased object in a released one, until SAP releases the API (Customer Influence Tool). Tier 3: ABAP Classic, private edition and on-premise only, for when nothing else is feasible.</p><p><strong>Clean Core Level Concept (second generation).</strong> Extensions are classed in four levels by architectural integrity and upgrade safety:</p><table><thead><tr><th>Level</th><th>Meaning</th></tr></thead><tbody><tr><td>A</td><td>Only publicly released, stable interfaces with formal stability contracts, based exclusively on ABAP Cloud. The evolution of Tier 1 and the preferred approach</td></tr><tr><td>B</td><td>Uses an unreleased API, such as a BAPI, that SAP deems stable and upgrade-safe, so no wrapper is needed. Also preferred</td></tr><tr><td>C</td><td>Relies on APIs not officially released but needed for legacy scenarios. SAP provides a changelog to spot upgrade risks. Not preferred, but possible if necessary</td></tr><tr><td>D</td><td>Not clean: uses explicitly non-recommended objects or techniques. Highest risk and most likely to create technical debt</td></tr></tbody></table><p>The SAP Application Extension Methodology helps assess extension use cases and define a target solution. Extensions must never duplicate standard functionality (MCC100).</p><h2>Clean data: data is configuration, master and transactional; quality facets are accuracy, completeness, consistency, timeliness, validity and uniqueness; data volume must be controlled and personal master data stored only for justifiable purposes; tools named include SAP Master Data Governance and SAP Information Lifecycle Management</h2><p>Mantra: "Keep the data clean." MCC100 distinguishes three kinds of data (MCC100, Clean Data):</p><ul><li><strong>Configuration:</strong> defines the organization's structure, for example company code, plants, purchase organizations.</li><li><strong>Master:</strong> consistent identifiers and attributes of core entities, for example customers, vendors, products, general ledger accounts.</li><li><strong>Transactional:</strong> derived from transactions, for example sales orders or purchase orders; it has a time dimension, a numerical value and refers to master data.</li></ul><p>Quality facets are accuracy, completeness, consistency, timeliness, validity and uniqueness. Data volume has to be controlled to optimize memory and disk, so outdated, unused or redundant data should be purged, and personal master data must be stored only for justifiable purposes.</p><p>Tools and methods: SAP Master Data Governance (central hub, single source of truth, validated values, business rules), SAP Information Steward, SAP Datasphere, the SAP One Domain Model (ODM) and the SAP Data and Analytics Advisory Methodology. SAP Information Lifecycle Management addresses privacy by automating archiving and retention and decommissioning legacy systems. Benefits named are "Data To Value", process efficiency, lower TCO, easier data exchange and lower privacy risk (MCC100).</p><h2>Clean integrations (landscape): base integrations on standard OData and SOAP APIs, use SAP Integration Suite and SAP Event Mesh, use SAP Application Interface Framework for monitoring, and use RFC and IDoc only if absolutely necessary; SAP Integration Solution Advisory Methodology (ISA-M) supports strategy</h2><p>The lesson is titled Clean Landscapes, and the mantra it states is "Keep the landscape reliable" (MCC100, Clean Landscapes). The lesson's video transcript repeats the text of the clean data dimension, which looks like a copy error in the course.</p><ul><li><strong>Standard APIs.</strong> Base integrations on standardized OData and SOAP APIs. The SAP Business Accelerator Hub helps explore APIs and events, and for OData APIs you can try them in an SAP sandbox.</li><li><strong>SAP Integration Suite.</strong> SAP's integration platform as a service for middleware-based scenarios: routing, mapping and connectivity through adapters.</li><li><strong>SAP Event Mesh.</strong> A BTP service for asynchronous, event-driven communication, with an event provider, an event consumer and Event Mesh as the glue.</li><li><strong>Avoid legacy APIs.</strong> RFC and IDoc are common in SAP systems but recommended only if absolutely necessary, because they do not align with reliable and flexible integration.</li><li><strong>SAP Application Interface Framework.</strong> Lets business users monitor interfaces across technologies such as OData and SOAP, configure alerts and fix business errors such as bad data without IT. Sensitive data can be hidden from them.</li><li><strong>ISA-M.</strong> The SAP Integration Solution Advisory Methodology offers integration use case patterns, architecture blueprints and best practices, and covers organizational aspects such as an Integration Center of Excellence. SAP Integration Assessment applies it in a tool-based way.</li></ul><p>Goals named: upgrade-stable interfaces, proper monitoring and error resolution, and only actively used, well-documented integrations (MCC100).</p><h2>Clean operations: mantra 'Keep the operations effective and efficient'; release management is the foundation, housekeeping tasks are established, and SAP Cloud ALM and the clean core dashboard (SAP S/4HANA Cloud Private Edition systems only) support monitoring</h2><p>Mantra: "Keep the operations effective and efficient." The framework (MCC100, Clean Operations):</p><ul><li>Integrate keeping the core clean into the end-to-end concept for operations. The course suggests IT as owner of the end-to-end view, with integrated monitoring and alerting for data, extensions and other facets, and procedures for event management and escalation.</li><li><strong>Release management is the foundation.</strong> Public edition updates are pushed to all customers at once. Private edition and SAP S/4HANA (on-premise or hosted) customers are not forced to update, but must strive for the latest release, define a release adoption timeline in governance, and not let the system stay frozen.</li><li><strong>Housekeeping.</strong> Examples: design background jobs for efficient use of infrastructure, avoid file interfaces for data import and export, and review and adapt user authorizations regularly.</li><li><strong>Distribution of roles and responsibilities</strong> agreed with SAP, and maintenance within pre-approved contractual maintenance periods.</li><li><strong>SAP Solution Manager and SAP Cloud ALM</strong> help to detect incidents, analyze root causes, correct problems and automate recurring activities.</li></ul><p><strong>Clean core dashboard (MCC100).</strong> Available through SAP for Me, in Systems &amp; Provisioning, Systems tab, Clean Core Compliance tab. It shows metrics such as software stack version, number of custom code objects, number of business modifications and Tier 1 extensions. It is only available for SAP S/4HANA Cloud Private Edition systems, covers productive systems only, can be shared with partners, needs the authorizations SC_CCCREAD plus INSTDISP (read) or INSTPROD (edit), and collects data mainly through Early Watch Alert, which SAP sets up (MCC100).</p><p><em>Source note:</em> SL_RISE419 describes a clean core dashboard that is accessed through SAP Cloud ALM, not SAP for Me (see the dashboard item below). The two courses describe the access path differently, and the corpus does not say whether these are the same product at different times or different views. Check both before giving instructions.</p><h2>Best practices for implementation: assess business processes, establish a governance framework, streamline processes, rationalize data, simplify in both greenfield and brownfield, align with SAP's reference architecture, adopt SAP Activate and manage change and user adoption</h2><p>MCC100's closing lesson gives a starting framework (MCC100, Clean Core Best Practices):</p><ol><li><strong>Prepare.</strong> Assess business processes: evaluate existing processes, systems and data structures, engage stakeholders, identify improvement areas. Establish governance: defined roles, top management commitment and funding, IT strategy aligned with company goals. In a greenfield, technical and business transformation happen together; in a brownfield, technical transformation tends to come first and the cleaning of custom code can be lengthy.</li><li><strong>Key principles.</strong> Streamline business processes (remove unnecessary steps, fewer deviations, industry best practice). Rationalize data structures (assess quality, cleanse, reduce duplicates, data governance). Simplify in both greenfield and brownfield: minimize customizations and extensions, retire outdated applications, adopt technologies such as AI and RPA. Converting is not incompatible with innovation.</li><li><strong>Best practices.</strong> Align with SAP's reference architecture (recommended landscape and modular architectures, industry best practices, SAP Integration Suite). Adopt SAP Activate (agile practices, collaborative workshops and prototyping, preconfigured industry accelerators). Apply tools such as SAP Data Migration Cockpit and the SAP Fiori Custom Code Migration App.</li><li><strong>Overcome challenges.</strong> Early, comprehensive change management with users involved in the plan, end user training and support, and continuous improvement based on stakeholder feedback and SAP roadmaps.</li></ol><h2>RISE with SAP is SAP's transformation journey to the SAP Business Suite; the RISE with SAP Methodology is built on a clean core strategy and has three core components: a standardized framework, an integrated toolchain and expert guidance</h2><p>RISE with SAP was traditionally a specific sales package including SAP Cloud ERP Private (SAP S/4HANA Cloud Private Edition). In the context of the SAP Business Suite it focuses broadly on the customer's transformation journey and has become the standard path for existing on-premise SAP ERP customers to adopt the SAP Business Suite, which covers SAP's cloud portfolio including public and private cloud ERP and line-of-business solutions. The SAP Cloud ERP Private Package remains one of the suite's offerings (SL_RISE419, SAP Business Suite).</p><p>The RISE with SAP Methodology aids the transition with structured guidance across defined phases, supported by SAP experts and partners. It is "built on a clean core strategy", keeping data streamlined, processes flexible and operations efficient. Its core components are (SL_RISE419, The RISE with SAP Methodology; Key Components):</p><ol><li><strong>Standardized framework:</strong> augments the SAP Activate roadmap tasks and deliverables with activities that gather important information before implementation.</li><li><strong>Integrated toolchain:</strong> a recommended set of tools to manage the project digitally and increase transparency and collaboration.</li><li><strong>Expert guidance:</strong> support from SAP experts and certified partners from the very beginning to ongoing improvements.</li></ol><p>Enhancements named: an improved discovery phase with the Digital Discovery Assessment toolkit, broader adoption roadmaps, transformation services for SAP Cloud ERP Private customers, improved onboarding with a clean core success plan, and an enhanced toolchain (SL_RISE419).</p><h2>Standardized framework: it augments the SAP Activate roadmap; the Discover phase uses the Digital Discovery Assessment, the Prepare phase has four onboarding calls with the Onboarding Advisor, and through Explore, Realize, Deploy and Run the Project Manager verifies tasks through Clean Core Quality Gates (questionnaires in SAP Cloud ALM); the Clean Core Success Plan holds over 150 recommended tasks</h2><p>The framework adds activities to SAP Activate to gather key information, onboard the project team and familiarize them with clean core activities (SL_RISE419, Standardized Framework).</p><table><thead><tr><th>Phase</th><th>What happens</th></tr></thead><tbody><tr><td>Discover</td><td>The Digital Discovery Assessment captures information that guides the project and shows the customer's planned journey. The onboarding team and customer success managers take part</td></tr><tr><td>Prepare</td><td>SAP's Onboarding Advisor hosts four personalized sessions; initial system provisioning is triggered via SAP for Me</td></tr><tr><td>Explore, Realize, Deploy, Run</td><td>The Project Manager (partner or SAP) verifies task completion through Clean Core Quality Gates</td></tr></tbody></table><p><strong>The four Prepare calls (SL_RISE419, Prepare Phase):</strong></p><ol><li>Call 1, Get Started with SAP: overview of solution capabilities and entitlements of the SAP Cloud ERP Private package, introduction of the customer IT contact ("super admin") and core project team, and system provisioning.</li><li>Call 2, RISE with SAP Methodology and Clean Core Project: clean core principles and structured support, and setting up the Clean Core Success Plan in SAP Cloud ALM, with tasks across Activate phases in the Clean Core Runbook.</li><li>Call 3, Complete your Clean Core Quality Gate: helps finish the Quality Gate 1 assessment before submission via SAP Cloud ALM.</li><li>Call 4, Review your Clean Core Quality Gate Assessment: reviews the Quality Gate report with findings and recommendations.</li></ol><p><strong>Quality Gates.</strong> They are questionnaires managed in SAP Cloud ALM. After submission, SAP's Enterprise Support team gives a feedback report with recommendations based on the answers and on system data analysis, reviewed with the RISE with SAP Enterprise Architect. The onboarding video says analysis typically takes around 10 days and that Quality Gates 2, 3 and 5 follow in later phases (SL_RISE419).</p><p><strong>Clean Core Success Plan.</strong> It guides task completion and deliverables, uses SAP Cloud ALM to manage over 150 recommended clean core tasks, and tracks progress in a runbook. It is described as a living document; the Clean Core Runbook guides stakeholders (SL_RISE419, Explore to Run).</p><p><em>Source note:</em> Quality Gate 1 is conducted during Prepare (calls 3 and 4), while the general statement is that Quality Gates are used from Explore through Run. The text does not reconcile the two, so treat gate 1 as the Prepare-phase gate and later gates as the later phases.</p><h2>Business phase Value and Architecture Artifacts Handover: presales and sales teams complete artifacts and hand them to the implementation team from Discover to Prepare; deliverables include the Business Capability Map, Application Architecture Overview, Solution Component Diagram, Technical Assessment, Architecture Roadmap, Value Roadmap, RISE Adoption Plan and Executive Proposal, each marked required or recommended</h2><p>The enhanced SAP Activate roadmap starts with Discover, where the customer's IT architecture, business processes and operations are analyzed to refine the implementation scope and value proposition. Presales and sales teams complete artifacts that document requirements and technical architecture needs and hand them to the implementation team for a seamless transition from Discover to Prepare (SL_RISE419, Business Phase).</p><p>The handover deliverables, with the required or recommended marker as read in the course's table order (SL_RISE419, Handover Deliverables):</p><table><thead><tr><th>Deliverable</th><th>Marker</th></tr></thead><tbody><tr><td>RISE with SAP Methodology / Clean Core Strategy</td><td>Required</td></tr><tr><td>Business Strategy Map</td><td>Recommended</td></tr><tr><td>Architecture Principles Catalog</td><td>Recommended</td></tr><tr><td>Value Discovery Approach (Clean Core Maturity Assessment)</td><td>Recommended</td></tr><tr><td>Digital Discovery Assessment</td><td>Required</td></tr><tr><td>Business Capability Map</td><td>Required</td></tr><tr><td>Business Value Flow Diagram</td><td>Recommended</td></tr><tr><td>Application Architecture Overview Diagram</td><td>Required</td></tr><tr><td>Solution Component Diagram</td><td>Recommended</td></tr><tr><td>Software Distribution Diagram</td><td>Recommended</td></tr><tr><td>Product Map</td><td>Recommended</td></tr><tr><td>Bill of Materials (including Solution Sizing)</td><td>Required</td></tr><tr><td>Technical Assessment (Architecture, Cybersecurity, Infrastructure)</td><td>Required</td></tr><tr><td>Architecture Roadmap (Capability, Solution)</td><td>Required</td></tr><tr><td>Value Roadmap</td><td>Required</td></tr><tr><td>RISE Adoption Plan</td><td>Required</td></tr><tr><td>Executive Proposal</td><td>Required</td></tr></tbody></table><p><em>Source caveat:</em> the text copy of this table is jumbled, with the markers detached from their rows, so the pairing above follows the order in which the markers appear and should be checked against the original course page before you rely on it.</p><h2>Integrated toolchain: SAP LeanIX (landscape analysis), SAP Signavio (process evaluation and modeling), SAP BTP (extensions), Tricentis Test Automation, SAP Enable Now and SAP WalkMe, with SAP Cloud ALM as the digital backbone for project execution and the clean core success plan; SAP Signavio Governance is listed among the process analysis tools</h2><p>SL_RISE419 states that customers adopting a clean core approach report up to 75% incremental business value and a lower likelihood of incomplete or canceled IT modernization projects, largely thanks to the integrated toolchain. The tools follow the journey (SL_RISE419, The Integrated Toolchain):</p><table><thead><tr><th>Stage</th><th>Tool</th><th>Role</th></tr></thead><tbody><tr><td>Landscape analysis</td><td>SAP LeanIX</td><td>Analyzes existing landscape architecture, systems and integrations</td></tr><tr><td>Process evaluation</td><td>SAP Signavio</td><td>For SAP ECC or SAP S/4HANA systems, evaluates existing processes. A free one-time data load is offered through SAP Signavio Process Insights, discovery edition. SAP Signavio Process Manager documents custom processes in BPMN</td></tr><tr><td>Extensions</td><td>SAP BTP</td><td>Builds and hosts extensions so the core stays clean. Low/no-code (SAP Build Apps, Process Automation) and pro-code (Business Application Studio, ABAP environment, SAP Build Code), with Integration Suite and Connectivity Service</td></tr><tr><td>Testing</td><td>Tricentis Test Automation</td><td>Integrated in SAP Cloud ALM, supports manual and automated testing of business processes</td></tr><tr><td>End-user enablement</td><td>SAP Enable Now</td><td>Guided simulations of business processes</td></tr><tr><td>End-user support</td><td>SAP WalkMe</td><td>Insight into workflow difficulties, personalized guidance and process automation</td></tr><tr><td>Throughout</td><td>SAP Cloud ALM</td><td>The digital backbone for project execution, task management, reporting and the clean core success plan; after go-live, operations applications for monitoring</td></tr></tbody></table><p>The overview of transformation tools in the same course lists SAP Signavio Governance among the process analysis and optimization tools, next to Process Insights and Intelligence, Process Manager, the Process Collaboration Hub and others, and lists SAP LeanIX Application Portfolio Management, Architecture and Roadmap Planning, and Technology Risk and Compliance under enterprise architecture (SL_RISE419, The RISE with SAP Methodology).</p><h2>Expert guidance and partners: individual sessions, expert meetings on Clean Core Quality Gate reports, the partner ecosystem and enhanced support; the RISE with SAP Competency has three levels (Essential, Advanced, Expert) and Expert-level partners can qualify as RISE with SAP Validated Partners</h2><p>Expert guidance means collaboration among the customer project team, implementation partners and SAP. Under the methodology customers receive (SL_RISE419, Expert Guidance):</p><ol><li><strong>Individual sessions</strong> between the SAP Onboarding Advisor and the core project team (including the partner's Project Manager) to set up project management tools and the roadmap and introduce clean core principles and success plans.</li><li><strong>Expert meetings</strong> between an SAP expert and the partner's Project Manager to review Clean Core Quality Gate reports and give tailored recommendations.</li><li><strong>Partner ecosystem,</strong> supported by the SAP Competency Framework and findable through the SAP Partner Finder.</li><li><strong>Enhanced support,</strong> such as SAP Preferred Success and SAP MaxAttention.</li></ol><p><strong>RISE with SAP Competency.</strong> A mandatory certification path for partners to qualify as RISE with SAP partners, with three levels: Essential, Advanced and Expert. Essential is the baseline for a qualified implementation partner.</p><p><strong>RISE with SAP Validated Partners.</strong> Partners at Expert level that frequently deliver significant transformation projects can qualify. Examples of the course's criteria: Expert status across RISE with SAP, SAP BTP and SAP Business Process Transformation; over five RISE projects with an ACV above EUR 550,000 in the past 24 months; at least 80% of projects completing Clean Core Quality Gates with status Accepted or Conditionally Accepted; and certification targets for project-level staff. A one-time 180-day safeguarding period applies for partners who miss new tier requirements at the effective date (SL_RISE419, RISE with SAP Validated Partners).</p><h2>The RISE with SAP Methodology Dashboard (Clean Core Dashboard, accessed through SAP Cloud ALM) has a System View (version insights, tool readiness, upgrade preparation) and an Operations View (daily System Health score and KPIs with up to 30 days of history)</h2><p>The RISE with SAP Methodology Dashboard, also known as the Clean Core Dashboard, is where customers view and build on their system's adherence to clean core principles. It is accessed through SAP Cloud ALM (SL_RISE419, Dashboard).</p><ul><li><strong>System View.</strong> Version insights (is the installed SAP S/4HANA product version up to date), tool readiness (are the tools for clean core data collection active, for example SAP EarlyWatch Alerts) and upgrade preparation (assess current extensions to anticipate upgrade risks). Insights cover all SAP S/4HANA systems (development, test, production), helping to identify non-compliant code and keep it from reaching production.</li><li><strong>Operations View.</strong> Available for RISE with SAP customers, with daily insights and up to 30 days of history on system health KPIs, aligned with the operations dimension. Metrics come from SAP Cloud ALM applications for configured and productive SAP S/4HANA systems, are evaluated daily against thresholds and are aggregated into KPIs and scores. It shows the System Health score for all productive SAP S/4HANA systems (Cloud Private Edition and on-premise), a system-specific view of metric deviations, and jump-ins to SAP Cloud ALM applications. Metrics, thresholds and algorithms are shared so calculation is consistent across all RISE with SAP customers.</li></ul><p>The dashboard is a continuous monitoring tool. The Quality Gates, in contrast, are phase-based questionnaires with a feedback report reviewed in expert meetings (SL_RISE419).</p><section class="practice"><h2>Practice</h2><p>Build a one-page clean core checklist with one section per dimension (processes, extensions, data, integrations, operations). In each section record the mantra, two principles from the course and the SAP tool or method named for that dimension. Then add a short timeline of the RISE with SAP phases (Discover, Prepare, Explore to Run) that shows where the four onboarding calls and the Clean Core Quality Gates occur.</p></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain what a clean core is, why it is needed, and how the RISE with SAP Methodology supports it to a project sponsor without notes?</p></section>` },

<header class="top">
  <h1 id="mast-subject"></h1>
  <span class="dom" id="mast-domain"></span>
  <span class="count" id="mast-count"></span>
</header>

<div class="shell">
  <nav class="side" id="nav-side" aria-label="Sessions">
    <h2 id="nav-title">Sessions</h2>
    <ol id="nav-list"></ol>
    <select class="jump" id="nav-select" aria-label="Jump to session"></select>
  </nav>
  <main id="content" tabindex="-1"></main>
</div>

<script>
(function(){
  "use strict";
  var navList = document.getElementById("nav-list");
  var navSel  = document.getElementById("nav-select");
  var content = document.getElementById("content");
  var KEY     = "gw-studyguide-seen:" + SUBJECT;
  var current = -1;

  var L = { studyGuide:"Study Guide", sessions:"Sessions", session:"session",
            sessionsCount:"sessions", sessionLabel:"Session", jump:"Jump to session",
            skip:"Skip to content", empty:"No sessions compiled yet.", previous:"Previous",
            next:"Next", start:"Start of guide", end:"End of guide" };
  if (typeof LABELS === "object" && LABELS){
    for (var lk in LABELS){ if (LABELS[lk]) L[lk] = String(LABELS[lk]); }
  }
  document.getElementById("skip").textContent = L.skip;
  document.getElementById("nav-side").setAttribute("aria-label", L.sessions);
  document.getElementById("nav-title").textContent = L.sessions;
  navSel.setAttribute("aria-label", L.jump);

  function filled(v){ return (v && !/^\{.*\}$/.test(v)) ? v : ""; }
  var heading = filled(SUBJECT) ? filled(SUBJECT) + " — " + L.studyGuide : L.studyGuide;
  document.title = heading;
  document.getElementById("mast-subject").textContent = heading;
  document.getElementById("mast-domain").textContent  = filled(DOMAIN);
  document.getElementById("mast-count").textContent   =
    SESSIONS.length ? SESSIONS.length + " " + (SESSIONS.length === 1 ? L.session : L.sessionsCount) : "";

  function seen(){
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; }
  }
  function markSeen(n){
    try {
      var s = seen();
      if (s.indexOf(n) < 0){ s.push(n); localStorage.setItem(KEY, JSON.stringify(s)); }
    } catch(e){}
  }

  if (!SESSIONS.length){
    content.innerHTML = '<p class="empty">' + esc(L.empty) + '</p>';
    return;
  }

  SESSIONS.forEach(function(s, i){
    var li = document.createElement("li");
    var b  = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="n"></span><span class="t"></span>';
    b.querySelector(".n").textContent = s.n;
    b.querySelector(".t").textContent = s.title;
    b.addEventListener("click", function(){ show(i, true); });
    li.appendChild(b);
    navList.appendChild(li);

    var o = document.createElement("option");
    o.value = String(i);
    o.textContent = s.n + " — " + s.title;
    navSel.appendChild(o);
  });

  navSel.addEventListener("change", function(){ show(parseInt(navSel.value, 10), true); });

  function show(i, push){
    if (i < 0 || i >= SESSIONS.length || i === current) return;
    current = i;
    var s = SESSIONS[i];
    var been = seen();

    var btns = navList.querySelectorAll("button");
    for (var k = 0; k < btns.length; k++){
      btns[k].setAttribute("aria-current", k === i ? "true" : "false");
      if (been.indexOf(SESSIONS[k].n) >= 0) btns[k].classList.add("seen");
    }
    navSel.value = String(i);

    content.innerHTML =
      '<p class="eyebrow">' + esc(L.sessionLabel) + ' ' + esc(s.n) + '</p>' +
      '<h1>' + esc(s.title) + '</h1>' +
      s.html +
      pager(i);

    content.querySelectorAll("[data-go]").forEach(function(b){
      b.addEventListener("click", function(){ show(parseInt(b.getAttribute("data-go"), 10), true); });
    });

    if (push && location.hash !== "#session-" + s.n){
      history.replaceState(null, "", "#session-" + s.n);
    }
    markSeen(s.n);
    window.scrollTo(0, 0);
    content.focus({ preventScroll:true });
  }

  function pager(i){
    var prev = SESSIONS[i - 1], next = SESSIONS[i + 1];
    return '<div class="pager">' +
      '<button type="button"' + (prev ? ' data-go="' + (i - 1) + '"' : " disabled") + '>' +
        '<span>' + esc(L.previous) + '</span>' + (prev ? esc(prev.n + " — " + prev.title) : esc(L.start)) +
      '</button>' +
      '<button type="button"' + (next ? ' data-go="' + (i + 1) + '"' : " disabled") + '>' +
        '<span>' + esc(L.next) + '</span>' + (next ? esc(next.n + " — " + next.title) : esc(L.end)) +
      '</button></div>';
  }

  function esc(t){
    return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  document.addEventListener("keydown", function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = (e.target.tagName || "").toLowerCase();
    if (t === "select" || t === "input" || t === "textarea") return;
    if (e.key === "ArrowRight" || e.key === "j") show(current + 1, true);
    if (e.key === "ArrowLeft"  || e.key === "k") show(current - 1, true);
  });

  var want = 0;
  var m = /^#session-(.+)$/.exec(location.hash);
  if (m){
    SESSIONS.forEach(function(s, i){ if (s.n === m[1]) want = i; });
  }
  show(want, false);
})();
</script>

</body>
