  { n:"12", title:"Dangerous Goods and Basic Functions", html:`<h2>Overview</h2><p>This session covers how TM handles dangerous goods (DG): where the DG data comes from, how the checks are configured, and where in the process chain they run, from the forwarding order to the freight document. It also covers the ADR 1.1.3.6 points exemption, the user interface for document-based DG records, content loading, and the DG print documents. Nearly all of it comes from the "Considering Dangerous Goods" part of the Basic Functions help (H12). In a project, a DG scenario fails mostly because one Customizing prerequisite is missing, such as the DG profile on the document type, the block reason, or the FUB_DG and VSR_DG methods. Knowing the whole chain lets you find the gap.</p><h2>Purpose of the dangerous goods (DG) functions in TM: to transport dangerous goods in compliance with international regulations (H12, Considering Dangerous Goods). Dangerous goods are solids, liquids or gases that pose risks to people, living organisms, property or the environment, and the chemical safety laws governing them vary between countries (S48600, Dangerous Goods)</h2><p>The DG functions in TM "enable you to transport dangerous goods (DG) in compliance with international regulations" (H12).</p><p>S48600 defines the subject. Dangerous goods, also called hazardous materials or hazmat, are solids, liquids or gases that pose risks to people, living organisms, property or the environment. They are subject to chemical safety laws that vary between countries. The list in S48600 includes radioactive, flammable, explosive, corrosive, oxidizing, asphyxiating, biohazardous, toxic, pathogenic and allergenic materials. Physical conditions such as compressed gases, liquids or hot materials are also included. The category covers goods that contain such materials or chemicals, or that show hazardous characteristics under specific circumstances.</p><p>S48600 also describes the idea behind the checks. DG experts classify products according to the applicable regulations. A compliance check then runs in all relevant business documents in the value chain, for example intracompany stock transfer orders, sales orders, outbound deliveries and freight orders. It verifies whether transporting the product is allowed. If it is not, the check blocks the business document.</p><p>H12 adds that when business documents are printed, the system also prints the required DG information, if the required settings have been made.</p><h2>Two DG processing options, Dangerous Goods Processing Based on PS&amp;S and Dangerous Goods Processing Based on Product Compliance; they are mutually exclusive, so only one can be activated at a time (H12, Considering Dangerous Goods; S48600, Dangerous Goods)</h2><p>H12 lists the two ways of working with DG in TM:</p><ul><li><strong>Dangerous Goods Processing Based on PS&amp;S</strong></li><li><strong>Dangerous Goods Processing Based on Product Compliance</strong></li></ul><p>S48600 states it as a note: "One can choose between DG processing based on PS&amp;S and DG processing based on product compliance. Since these two solutions are mutually exclusive, only one can be activated at a time."</p><p>What each option rests on, according to the sources:</p><table><thead><tr><th></th><th>PS&amp;S</th><th>Product Compliance</th></tr></thead><tbody><tr><td>Data the checks use</td><td>DG master data and document-based DG records held in TM, plus PS&amp;S phrase management (H12)</td><td>Product Compliance data; DG statuses of freight orders, freight units and freight bookings can be viewed (H12)</td></tr><tr><td>Modes named</td><td>The PS&amp;S section names the ADR points check (road) and the IATA shipper's declaration (air) (H12)</td><td>Road, rail, air and ocean freight (H12)</td></tr><tr><td>Where it is switched on</td><td>Customizing under Dangerous Goods Processing Based on PS&amp;S (H12)</td><td>Customizing under Dangerous Goods Processing Based on PC (H12)</td></tr></tbody></table><p><em>What the material does not establish:</em> why the two are mutually exclusive, beyond the statement that only one can be active. It also does not say how to switch from one option to the other.</p><h2>DG data that the checks rely on: dangerous goods master data (created by shippers for products classified as DG, displayed with the Display Dangerous Goods Data app) and document-based dangerous goods records (created by logistics service providers at item level in the business document) (H12, Dangerous Goods Processing Based on PS&amp;S)</h2><p>In the PS&amp;S-based processing, the DG checks are based on the available DG data, which is created in two ways (H12):</p><ul><li><strong>Dangerous goods master data (created by shippers).</strong> When a shipper enters a product in the product master data in TM and the product is classified as dangerous goods, the shipper also creates a DG master data record for it. You display it with the Display Dangerous Goods Data app on the launchpad.</li><li><strong>Document-based dangerous goods records (created by logistics service providers).</strong> When an LSP receives DG data from a shipper, it enters that data in the business document by creating a document-based DG record at item level.</li></ul><p>The checks run in TM. They use DG master data or the document-based records created for forwarding orders, freight orders or freight bookings (H12).</p><p>The reason for the second kind: an LSP transporting DG for customers "may not always have the required dangerous goods master data in your SAP TM system" (H12, Document-Based Dangerous Goods Records). So the practical rule is that a shipper maintains master data, and an LSP works with records in the documents. The records can be typed in manually or created automatically when TM creates a forwarding order from a business partner's data, through the relevant enterprise service (H12). The two options are covered in more detail below.</p><h2>Dangerous Goods Indicator Profile: defined in SAP EHS Management, assigned to the material in the master data, selectable when the material is relevant for dangerous goods; the examples listed are Environmentally Relevant and Highly Viscous and In Bulk/Liquids. Indicator profiles are specified in Customizing under Specify Indicator Profiles for the Material Master (S48600, Dangerous Goods Indicator Profile; H12, Configuration of Dangerous Goods Processing)</h2><p>S48600 says the DG indicator profile field is defined in SAP Environment, Health, and Safety Management (SAP EHS Management). A profile can be selected if the material being added is relevant for dangerous goods and for any documentation that accompanies that kind of material. The examples listed are:</p><ul><li>Environmentally Relevant</li><li>Highly Viscous and In Bulk/Liquids</li></ul><p>In H12 (Configuration of Dangerous Goods Processing), the indicator profile is one of the settings for DG master data. In the master data you assign an indicator profile to the material. You define the profiles in Customizing for Transportation Management under Basic Functions &gt; Dangerous Goods &gt; Dangerous Goods Processing Based on PS&amp;S &gt; PS&amp;S Services &gt; Dangerous Goods Management &gt; Dangerous Goods Checks and Dangerous Goods Documents &gt; Common Settings &gt; Specify Indicator Profiles for the Material Master. The other master data step is to create the DG master data record for the product with the Display Dangerous Goods Data app.</p><p><em>What the material does not establish:</em> what the profiles do technically beyond "selectable when the material is DG-relevant", and which other profiles exist besides the two examples.</p><h2>Configuration of DG processing (PS&amp;S): environment parameters for PS&amp;S Services, phrase management and a text pattern in the DG master, a DG profile that activates the DG checks (and is also required to enter DG data without checks), assignment of the DG profile to forwarding order, forwarding quotation, freight unit, freight order and freight booking types, the transportation mode, the block reason Error During Dangerous Goods Check, and the methods FUB_DG and VSR_DG assigned to the process controller strategy (H12, Configuration of Dangerous Goods Processing)</h2><p>H12 lists the settings that apply to both DG master data and document-based records. Use it as a checklist:</p><ol><li><strong>Environment parameters</strong> for the processes in PS&amp;S Services: Customizing under Dangerous Goods Processing Based on PS&amp;S &gt; PS&amp;S Services &gt; Basic Services &gt; Specify Environment Parameters.</li><li><strong>Phrase management and a text pattern.</strong> TM uses the PS&amp;S framework to extract DG information, as phrases, for printing. To enable it you set up phrase management in PS&amp;S Services, assign a text pattern in the DG master, and define phrases in phrase management.</li><li><strong>A DG profile</strong> (Define Dangerous Goods Profile) that activates the DG checks. It defines general conditions for processing DG, such as conditions for displaying error messages.</li><li><strong>Assignment of the DG profile to the document types you use:</strong><ul><li>Freight Order Management &gt; Freight Order &gt; Define Freight Order Types</li><li>Freight Order Management &gt; Freight Booking &gt; Define Freight Booking Types</li><li>Planning &gt; Freight Unit &gt; Define Freight Unit Types</li><li>Forwarding Order Management &gt; Forwarding Order &gt; Define Forwarding Order Types</li><li>Forwarding Order Management &gt; Forwarding Quotation &gt; Define Forwarding Quotation Types</li></ul></li></ol><p>If you want to enter DG data in a document without performing any DG checks, you still have to assign a DG profile to the document type.</p><ol><li><strong>General settings</strong> for DG processing (Define Common Settings for Dangerous Goods Processing). These include the settings needed for printing DG data.</li><li><strong>The transportation mode</strong>, defined in Master Data &gt; Transportation Network &gt; Transportation Lane &gt; Define Transportation Mode.</li><li><strong>The methods FUB_DG and VSR_DG</strong> assigned to the relevant process controller strategy (Basic Functions &gt; Process Controller &gt; Assign Methods to a Strategy). This is what enables the DG checks during freight unit (FU) building and vehicle scheduling and routing (VSR) optimization.</li><li><strong>The block reason.</strong> You define which processes are blocked when an error occurs in a DG check, for the block reason Error During Dangerous Goods Check (Basic Functions &gt; General Settings &gt; Define Block Reason Codes).</li></ol><p>For document-based records there are two further prerequisites, covered below: a UI profile, and the check method set-up. Loaded SAP EHS Regulatory Content can be used as the basis for the records (H12).</p><h2>Adapting DG processing: create a function module, specify it as a DG check method, assign the method to a check schema; BAdIs can change the input data for checks and printing or read template data from an external database (H12, Adapting DG Processing)</h2><p>H12 describes four ways to adapt DG processing:</p><ul><li><strong>Your own check.</strong> Create a function module, specify it as a DG check method (Customizing: PS&amp;S Services &gt; Dangerous Goods Management &gt; Dangerous Goods Checks and Dangerous Goods Documents &gt; Dangerous Goods Checks &gt; Specify Dangerous Goods Check Methods), then assign the method to a check schema (Specify Dangerous Goods Check Schemas).</li><li><strong>Input data.</strong> You can change, delete or extend the input data for the DG check and for printing data with the BAdI: Definition of Data for Printing and Checking for Dangerous Goods (under Integration with PS&amp;S).</li><li><strong>Template data.</strong> You can read template data from an external database instead of the PS&amp;S Services database with the BAdI: Dangerous Goods Processing (under Template Data).</li></ul><p>The same method, schema and business context mechanism is used for delivered methods. The ADR points check has the prerequisite that you assign a check schema to the relevant business documents and then assign the new check method to that schema. The business context is specified under Common Settings &gt; Specify Business Context (H12).</p><h2>Dangerous goods checks process: the check runs for forwarding orders, forwarding quotations, freight orders and freight bookings, on save or manually; it is repeated during freight unit building (for example the mixed loading check), on the freight units, during VSR planning (transportation proposal, freight unit vehicle check) and on the resulting freight document. Errors block the document or FU with the block reason Error During Dangerous Goods Check; messages are in the application log (object /SCMTMS/TMS, subobject DG) (H12, Dangerous Goods Checks)</h2><p><strong>Why several checks.</strong> H12 says that "due to different risks involved in transporting DG, the system carries out checks in different ways and at different process steps". The aim is to ensure compliance of the successor documents, the FUs and freight orders (FOs).</p><p><strong>Prerequisite.</strong> DG master data or document-based records exist, and the configuration above is done. During planning, document-based records created at item level in forwarding orders are transferred automatically to the freight orders or freight bookings. They are read-only there. You can also create records at item level in the freight documents.</p><p><strong>The chain (H12):</strong></p><table><thead><tr><th>Step</th><th>What happens</th></tr></thead><tbody><tr><td>1. Forwarding order</td><td>The check runs on save, or manually with the Check pushbutton or menu entry. If the system identifies DG, it selects the Dangerous Goods checkbox. If there are DG errors, the forwarding order is blocked.</td></tr><tr><td>2. Freight unit building</td><td>The system can check DG during FU building, for example with the <strong>mixed loading check</strong>. It analyzes how items can be combined and considers incompatibilities. If the check returns errors, items are prevented from being transported in the same FU.</td></tr><tr><td>3. Freight units</td><td>The FUs are checked after creation and each time the FU changes. The Dangerous Goods checkbox is selected when DG is identified, and the FU is blocked if there are DG errors.</td></tr><tr><td>4. VSR planning, transportation proposal</td><td>VSR optimization assigns FUs to vehicle resources and creates freight documents. When creating transportation proposals the system runs the DG check and offers an alternative proposal. In batch processing it selects the first solution without DG errors. The mixed-loading check covers incompatible FUs. A <strong>freight unit vehicle check</strong> avoids planned documents that contain DG FUs incompatible with certain resources. These incompatibilities go into the optimization run.</td></tr><tr><td>5. Freight document</td><td>The resulting freight document is checked after the VSR run and each time it changes. In manual planning it is checked on every save or when triggered manually. At this point you can create document-based DG records in the freight document, and they are included in the checks.</td></tr></tbody></table><p><strong>What blocks.</strong> If a DG check has errors, the Statuses tab page shows the block reason Error During Dangerous Goods Check in the Blocking Information group box. The system blocks the relevant processes according to the Customizing for that block reason. The details show every check performed, including the DG check.</p><p><strong>Where to look afterwards.</strong> DG information is shown on the forwarding order, forwarding quotation, freight unit, freight order, freight booking and transportation proposal user interfaces, with the check result in the document. Further item-level DG information is on the Dangerous Goods tab page. In the forwarding order overview you can define a query that selects forwarding orders by DG data, for example by a specific DG number and regulation. Messages from the checks during FU building and VSR optimization are in the application log, object /SCMTMS/TMS and subobject DG, which you open from the Application Log app on the launchpad.</p><h2>ADR 1.1.3.6 points check: exemption if the points total does not exceed 1000 points; check method /SCMTMS/DG_ADR_1000_POINTS; Points = Relevant Quantity x Multiplication Factor; the relevant quantity depends on the aggregate state (master data uses item-level gross weight, net weight or gross volume; DG records use gross weight, net weight or nominal volume of receptacle); points are summed per document item, header and stage, with FWO, FWQ, OTR and FU as the sum of items and the road freight order as the maximum of the stages (H12, ADR 1.1.3.6 Points Check Calculation)</h2><p><strong>Background.</strong> ADR is the European agreement on the international carriage of dangerous goods by road. Its section 1.1.3.6 describes an exemption based on a points calculation. If the total does not exceed 1000 points, the exemption can be applied (H12).</p><p><strong>Set-up.</strong> The check method is /SCMTMS/DG_ADR_1000_POINTS. You enable the points check in Customizing (Specify Dangerous Goods Check Methods) and assign the method to the check schema and business context, as in the configuration section above.</p><p><strong>Formula.</strong> Points = Relevant Quantity x Multiplication Factor.</p><p><strong>Relevant quantity.</strong> It depends on the aggregate state specified for transport:</p><table><thead><tr><th>Data source</th><th>Quantity taken from</th><th>Options</th></tr></thead><tbody><tr><td>DG master data (shippers)</td><td>Item level</td><td>Gross Weight, Net Weight, Gross Volume</td></tr><tr><td>Document-based DG records (LSPs)</td><td>DG record level</td><td>Gross Weight, Net Weight, Nominal Volume of Receptacle</td></tr></tbody></table><p>For each aggregate state in the DG master or DG record you assign a relevant quantity, in Customizing under Define Points-Relevant Quantities for ADR 1.1.3.6 DG Exemption. The multiplication factor is entered in the DG master (master data) or in the DG record (document-based records).</p><p><strong>Totals</strong> are calculated at three levels (H12):</p><ul><li>Document item: the sum of points for an item in a document.</li><li>Document header: the sum of points for all items in the document.</li><li>Document stage detail: the sum of points for all items assigned to a stage.</li></ul><p><strong>Document-level rule:</strong></p><table><thead><tr><th>Document</th><th>Points are</th></tr></thead><tbody><tr><td>Forwarding order (FWO), forwarding quotation (FWQ), order-based transportation requirement (OTR), freight unit (FU)</td><td>the sum of the points of the assigned items</td></tr><tr><td>Road freight order (FO)</td><td>the maximum of the points of each stage</td></tr></tbody></table><p><em>What the material does not establish:</em> why the road freight order uses the maximum of the stages. The help gives the rule only. Reading it as "a stage is one leg of the vehicle's load" would be an inference and is not stated.</p><h2>Transport restrictions Prohibited (not eligible under ADR 1.1.3.6) and Unlimited (not considered in the points calculation); if either flag is set, no points are calculated (H12, Transport Restrictions)</h2><p>For DG you can specify that a product or material is (H12):</p><ul><li><strong>Prohibited</strong>: not eligible for consideration under ADR 1.1.3.6.</li><li><strong>Unlimited</strong>: not considered in the points calculation under ADR 1.1.3.6.</li></ul><p>If either flag is set, no points are calculated for that product or material. For master data you set the flags in the DG master. For document-based records you set them in the DG record, using the UI profile (see the UI profile section below).</p><h2>Points check in planning: the ADR points check is activated in the freight unit building rule; the VSR optimizer uses vehicle resources with dimensions flagged as relevant for the ADR points check, and the check can be deactivated in the planning profile or in the transportation cockpit (H12, VSR Optimization)</h2><p><strong>In FU building.</strong> You activate the ADR points check in the freight unit building rule for the relevant document type, and the system considers the points limit when building FUs. The H12 example: with a limit of 1000 points per FU and three items of 500 points each, the system generates two freight units. The reasoning is that one FU can hold at most two of the items, because three would reach 1500.</p><p><strong>In VSR optimization.</strong> To activate the points check in the optimizer, you create vehicle resources, maintain their dimensions and flag them as relevant for the ADR points check. If these resources are maintained in the Capacity Selection Settings of the planning profile, the VSR optimizer takes the ADR 1.1.3.6 points limit into account as a planning-relevant capacity for the resource.</p><p><strong>Switching off.</strong> You can deactivate the points check in the optimizer settings of the planning profile, or during manual planning in the transportation cockpit.</p><h2>Document-based dangerous goods records: entered manually on the Dangerous Goods tab page at item level or created automatically from a business partner's data; records from forwarding orders are copied to the freight documents as read-only; item check method /SCMTMS/DG_CHECK_WITH_CONTENT; they can be saved as released or unreleased templates and searched by DG Number Type, DG Number, Packing Group and Variant ID (H12, Document-Based Dangerous Goods Records; Creation and Editing of Document-Based Dangerous Goods Records; Creation and Use of Dangerous Goods Templates)</h2><p><strong>Entering records.</strong> You create, edit or delete a record at item level on the Dangerous Goods tab page of a forwarding order, freight order or freight booking. The system uses the UI profile assigned to the forwarding order item type or to the freight document type. You can create a record from a template or without one, and the UI profile is shown at the top of the tab page. Alternatively, records are created automatically when TM creates a forwarding order from data received from a business partner, using the UI profile of the forwarding order item type. The profile DG_INBOUND_PROFILE contains the full set of fields that can be received in the inbound message. It is useful when you do not know which DG data will be sent. During planning, records from forwarding orders are copied to freight orders or freight bookings as read-only, and you can add further records at item level there.</p><p><strong>Prerequisites for a user to enter a record (H12):</strong></p><ol><li>The general DG settings from the configuration section.</li><li>A UI profile for document-based DG records.</li><li>For field checks, enhanced check methods. To have an individual field checked during a consistency check of the whole document, you enhance the check methods in Specify Dangerous Goods Check Methods, and you must use the existing function module /SCMTMS/DG_CHECK_WITH_CONTENT as the item check method.</li><li>Authorizations. The help names the authorization objects C_EHSP_TPP (phrase items) and C_SHEP_TPG (phrase library and phrase group) for phrases, and M_MATE_DGM for DG master data.</li></ol><p><strong>What limits the consistency check.</strong> The system checks a record against the available DG records in TM. These exist when you save a record as a template. If no template data has been saved, the system cannot perform any checks. Loading SAP EHS Regulatory Content provides master data records that serve as templates. Only fields marked in the UI profile as relevant for the check are checked. A field not flagged for the check is not checked.</p><p><strong>Templates.</strong> You save a record together with the business document. If you are authorized, you can also save it as a reusable template, either released or unreleased. Only released templates can be used to create new records. To find a released template, filter by DG Number Type, DG Number, Packing Group and Variant ID. You can check the processing status of templates in the DG master data with the Display Dangerous Goods Data app.</p><h2>UI profiles for document-based DG data: fields organized in UI groups, assigned to regulations (one tab page per regulation), field properties (separate editing per regulation, checkbox, table view, corresponding field, custom label, consistency check), phrase sets; defined in the Edit UI-Profile for Dangerous Goods app; a profile in use cannot be changed but can be copied; DG_INBOUND_PROFILE and Generate Inbound Profile support automatic record creation (H12, Definition of UI Profiles for Document-Based DG Data)</h2><p>A UI profile controls which fields and regulations are available on the Dangerous Goods tab page at item level and how the information is laid out (H12). LSPs can build profiles around the DG they regularly carry for customers. You define profiles in the <strong>Edit UI-Profile for Dangerous Goods</strong> app.</p><p><strong>Building blocks:</strong></p><ul><li><strong>Fields.</strong> You select them from the PS&amp;S Services master data, or use fields you defined yourself.</li><li><strong>UI groups.</strong> They organize the fields. You define a group title (for example "Substance Rating") and its position by column and row number. A group can be shown as a table. If a phrase set is assigned to a field in such a group, the table gets a link for creating or changing the phrase.</li><li><strong>Regulations.</strong> Every field belongs to at least one regulation, and each regulation gets its own tab page within the Dangerous Goods tab page. You assign regulations at profile level, group level or field level. Fields inherit them from the profile or group and you can change them per field. If none is set at profile or group level, assign at least one at field level.</li><li><strong>Field properties.</strong> Whether a field is edited separately per regulation (otherwise the value from the first regulation tab page carries over to the others). Whether the shown value is an initial value. Whether it is a checkbox. Whether it also appears in the table view. A corresponding field, such as a unit of measure for a gross weight field. A custom label. Whether a consistency check applies to it (if not specified, the field is not checked).</li><li><strong>Phrase sets.</strong> If PS&amp;S master data already has a phrase set assigned, the system shows it and you cannot change it. Otherwise you can select phrase sets for fields of the same data type as fields with assigned phrase sets.</li><li><strong>Preview</strong> of the layout before saving, and <strong>download and upload</strong> of profiles to move them between clients.</li></ul><p><strong>Rules and links to document types.</strong></p><ul><li>A profile in use (for example assigned to a forwarding order item type that has an order with DG data) cannot be changed. You can copy it to create a new one.</li><li>For forwarding orders, assign the UI profile to the forwarding order item types (Define Item Types for Forwarding Order Management).</li><li>For freight orders and freight bookings, assign the UI profile to the DG profile (Define Dangerous Goods Profile), then assign the DG profile to the freight order types or freight booking types.</li><li>The Generate Inbound Profile pushbutton creates a profile that supports automatic record creation from business partner data.</li><li>The multiplication factor, the relevant quantity per aggregate state and the Prohibited and Unlimited flags for document-based records are defined through the UI profile.</li></ul><h2>Phrase management and Loading Dangerous Goods Content: phrases are maintained with the Manage Phrases app; the Dangerous Goods Content Loader loads purchased content (regulations, phrases, Customizing data) in steps, phrases before regulations, and generates DG master data records whose product number contains the UN number (for example UN-1993-III-0101) (H12, Loading Dangerous Goods Content)</h2><p><strong>Phrase management.</strong> You open phrase management from the Manage Phrases app on the launchpad. In a DG record, a link next to a phrase field opens a dialog where you create, change or display phrase texts in several languages. You can also search for existing phrases and select them.</p><p><strong>Content loading.</strong> The Dangerous Goods Content Loader app loads content you have bought from a content provider (H12).</p><ul><li><strong>Prerequisites.</strong> You have downloaded the zip file. It contains a CSV file per regulation, CSV files for phrases, and a CSV file mapping the 3-character regulation prefix to the 12-character regulation name. You have specified the regulations to load in Customizing (Specify Dangerous Goods Regulations), entering the 12-character name from the CSV file.</li><li><strong>Steps in the app:</strong> 1 Upload Zip File (to a staging area). 2 Load Phrase Data (load the phrases before the regulations). 3 Load Regulation Data (select regulations from the list; if one cannot be selected, check it is specified in Customizing; load mode lets you repeat for data with errors). 4 Monitor Import Processes. 5 Check Generated Messages (filter by regulation type, message type, or context such as PHRASES_LOAD or REGULATIONS_LOAD). 6 Summary.</li><li><strong>Why it matters.</strong> The content comprises DG regulations, regulation texts such as substance names, phrases and the required Customizing data. It is useful if you do not have DG master data, for example as an LSP. The generated DG master data records serve as templates for document-based records and as the basis for consistency checks, for example to check whether a shipper gave the correct temperature data for a UN number.</li><li><strong>Result.</strong> For each content record the system creates a DG master data record. Its product has a generated product number that contains the UN number, for example UN-1993-III-0101, so you can search for imported content by UN number. You display the records with the Display Dangerous Goods Master app.</li></ul><h2>Dangerous goods documents: the shipper's declaration (IATA, generated for a freight booking from the DG master, viewable in the Output Management tab) and the standard print forms ADR Dangerous Goods Note, RID Dangerous Goods Note and IMO Dangerous Goods Declaration (H12, Shipper's Declaration; Standard Print Forms)</h2><p><strong>Shipper's declaration (H12).</strong> IATA requires that shipments classified as DG tendered to air carriers and air freight forwarders are accompanied by the IATA shipper's declaration for dangerous goods. The shipper is responsible for completing it correctly. Based on the freight booking, the system finds the relevant DG master and generates a declaration stating the nature and quantity of the DG and the type of packing material. You view it in the Output Management tab of the freight order. SAP provides a template that the shipper must implement and review, adapting it to its processes, in particular the packing function and country-specific or region-specific deviations. Integration is with SD and MM based on the sales order business object.</p><p>Prerequisites: Output Management is configured, the output profile is specified for the freight booking type (Define Freight Booking Types), and the PPF action settings and the action definition /SCMTMS/PRINT_SHPRS_DCL are specified for the output agents of the relevant business objects.</p><p>Example in the help: as a shipper you create a forwarding order, assign FUs with DG items, and assign the order to an air freight booking. The system finds DG in the booking and generates the declaration with information from the DG master.</p><p><strong>Standard print forms (H12).</strong> SAP delivers default templates for:</p><ul><li><strong>ADR Dangerous Goods Note</strong>: jurisdictions under the UNECE Agreement of 30 September 1957 on the international carriage of dangerous goods by road.</li><li><strong>RID Dangerous Goods Note</strong>: jurisdictions under the UNECE regulation on the international carriage of dangerous goods by rail.</li><li><strong>IMO Dangerous Goods Declaration</strong>: jurisdictions under the IMDG Code of the International Maritime Organization.</li></ul><p>You can build custom forms instead. For the ADR Dangerous Goods Note, you print it from a freight order, and it is only produced when products in the freight order are classified as dangerous goods. The help says that classification is determined by Product Compliance (see the next section).</p><p><em>What the sources show side by side:</em> the shipper's declaration is generated from the DG master (the PS&amp;S side), while the ADR note prerequisite refers to classification by Product Compliance. The help does not explain how the two fit together. Treat this as a point to verify. I only read the ADR note's prerequisites in detail, and did not check the RID and IMO prerequisite texts.</p><h2>DG processing based on Product Compliance: covers road, rail, air and ocean freight; activated in Customizing under Activate Product Compliance and Activate Business Features for Product Compliance; the DG statuses of freight orders, freight units and freight bookings can be viewed; FUB_DG and VSR_DG are also assigned (H12, Dangerous Goods Processing Based on Product Compliance)</h2><p>H12 says this option lets you transport DG by road, rail, air and ocean freight in compliance with international regulations. You can view DG statuses for freight orders, freight units and freight bookings.</p><p><strong>Configuration (H12):</strong></p><ol><li>Enable the Product Compliance processes: Customizing under Basic Functions &gt; Dangerous Goods &gt; Dangerous Goods Processing Based on PC &gt; Activate Product Compliance.</li><li>Specify which business features from Product Compliance you want to use (Activate Business Features for Product Compliance).</li><li>Assign the methods FUB_DG and VSR_DG to the relevant process controller strategy, to use DG checks during FU building and VSR optimization.</li><li>Optionally, use the BAdI: Definition of Data for Product Compliance Integration to change the parameters of the API calls for DG checks, document description and EDI structure.</li></ol><p>S48600 gives the surrounding picture. Compliance checks run across the value chain (stock transfer orders, sales orders, outbound deliveries, freight orders) and block a document when transport is not allowed.</p><p><em>What the material does not establish:</em> how a Product Compliance check proceeds step by step inside TM, or how the check chain above (forwarding order, FU building, VSR, freight document) behaves in this option. The chain is documented for the PS&amp;S option only. The statuses and process details are in the Product Compliance topic that H12 refers to, which is not part of the corpus.</p><section class="practice"><h2>Practice</h2><p>Write a one-page DG checklist for one business document type of your choice, for example a forwarding order type or a freight order type. List:</p><ol><li>The Customizing prerequisites: the DG profile and its assignment to the document type, the block reason Error During Dangerous Goods Check, the methods FUB_DG and VSR_DG on the process controller strategy, and the UI profile (document-based records) or DG master data (shipper case).</li><li>The checks the document goes through along the process chain, from the forwarding order through FU building and VSR planning to the freight document, with what is blocked at each step.</li><li>If you use the ADR 1.1.3.6 exemption: the check method, the check schema and business context, the points-relevant quantities, the activation in the freight unit building rule, and the vehicle resource and planning profile settings.</li></ol></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain how TM checks dangerous goods along the process chain, from the forwarding order to the freight document, to a transportation planner without notes?</p></section>` },
  { n:"13", title:"Analytics", html:`<h2>Overview</h2><p>This session covers TM analytics, the fifth stage of the TM process: Analytics and Collaboration. TM delivers Fiori apps called overview pages (OVPs). Each one shows the KPIs for one area, such as cost, allocation, business share, execution, quantity or tendering. Each page has cards, detailed views behind the cards, and CDS views and OData services underneath. In practice you meet this in two ways. A transportation manager asks "which page shows me X", and a consultant has to find out why a page is empty. The second needs the technical chain: CDS view, OData service in the Gateway system, authorizations and input parameters. Almost all content is from the Analytics chapter of the SAP Help (H13).</p><h2>TM analytics overview pages (OVP): apps on the Fiori launchpad that show KPIs for operational business; each page covers one area of TM (for example freight booking, freight ordering, tendering, business share); made of cards that are read-only, show data in real time, can be resized and reordered (H13, Analytics Overview Pages; S48600, Analytics and Collaboration)</h2><p>TM analytics provide apps, called overview pages, that show the KPIs you need to manage your operational business, "at a glance" for daily decisions. Each page shows information from a different area of TM (H13). You open them from the Fiori launchpad.</p><p>S48600 places this in the fifth process stage, Analytics and Collaboration. Overview pages, reports and KPI dashboards have been created for shippers and logistics service providers. They give a consolidated view of day-to-day activity and help real-time decision-making. They can be tailored to business roles.</p><p><strong>Cards (H13):</strong></p><ul><li>Each page is made of cards, similar to tiles, based on one or more KPIs.</li><li>Cards are read-only: you cannot enter information or run queries or searches on them.</li><li>They present data as lists, tables or charts. Some show summary information you can drill down from, for example to individual transactions.</li><li>They show data in real time, which helps you spot delays and bottlenecks and act quickly.</li><li>You can resize them and change their order.</li></ul><p>Each page is based on one or more Core Data Services (CDS) views (see the CDS views section below).</p><h2>Detailed views: reached by selecting a card header (unfiltered) or a chart data point (filtered); they combine donut, bar and line charts with a table, are read-only, and let you navigate to the document (for example freight order or freight booking) to change it; some overview pages have two detailed views (H13, Analytics Overview Pages; Detailed Views)</h2><p><strong>How you get there (H13):</strong></p><ul><li>For cards with graphical charts, selecting the <strong>header</strong> takes you to a detailed view with all the unfiltered data.</li><li>Selecting a <strong>data point</strong> in a chart takes you to a detailed view filtered to the information relevant to that data point.</li><li>Selecting a card header or information line also leads to the detailed view for non-chart cards.</li></ul><p><strong>What it contains.</strong> A combination of donut, bar and line charts, and a table that lists the relevant TM documents. The page layout described for each detailed view has these areas:</p><ul><li><strong>Information filter</strong> at the top. By default the graphics view is shown, and you can switch to a field view (compact filter) with fields such as units, currency or tolerances.</li><li><strong>Chart</strong> in the middle. It can be changed to a table or a combination, and a View By filter gives more specific cuts, for example by means of transport, carrier or block reason.</li><li><strong>Table</strong> at the bottom. You add or remove columns in Settings. Selecting a row, or a button such as Change Transportation Allocation or Change Tendering, opens the document in Transportation Management in edit mode.</li></ul><p><strong>Read-only, but actionable.</strong> Detailed views are read-only as well, with no entry and no queries or searches. You act by navigating from the table straight to the document, such as a freight order or freight booking, and changing it there (H13). That answers how a manager acts on what a card shows.</p><p><strong>One or two detailed views.</strong> Some pages have two, each for specific cards. In the Cost Analysis page, the Invoicing Block Analysis card opens the Transportation Invoice Blocked Detailed View, and any other card opens the Transportation Costs Detailed View. Freight Order Execution Monitoring also has two (see its section below). Each detailed view has its own Fiori ID.</p><p><strong>Time basis.</strong> Detailed views show a two-month rolling basis, the current and previous month (H13).</p><h2>CDS views: query views (SQL queries on the database) that feed each overview page; top-level consumption views containing other contributing CDS views, made of key figures and attributes; appropriate authorization objects are needed; the OData service of each Fiori ID must be activated in the Gateway system (H13, CDS Views; S4TM3, Determination of Procurement Needs)</h2><p>H13: "A CDS view is a query view, that is, an SQL query on the database requesting certain data to be returned." One or more CDS views feed each OVP. They are top-level views, called <strong>consumption views</strong>, containing other contributing CDS views, and they consist of <strong>key figures and attributes</strong>. You need the appropriate authorization objects to access them.</p><p>S4TM3 gives the same picture and adds the activation requirement. You must activate the respective OData service for each Fiori ID of the analytics area in the Gateway system. SAP Help lists all analytics areas and technical IDs under the search topic "Analytics".</p><p><strong>What must be in place technically for a page to work (from the sources):</strong></p><ol><li>The CDS view (delivered, named in each page's Technical Basis section).</li><li>The OData service for that Fiori ID activated in the Gateway system. For example, the Allocation Analysis page requires C_TRANSPALLOCCOMPLIANCEQ_CDS. A page with two data sources needs two services.</li><li>Authorization objects for the CDS view. The help lists them per view. For Allocation Analysis these include T_ADMIN (activity H1) or T_TAL (activity 03), plus B_BUP_PCPT for business partners and /SCMB/LOCB for locations. The execution and quantity views list objects such as T_TOR_PUR, T_TOR_EXE and TM_* objects.</li><li>The mandatory unit and currency input parameters (see the parameters section below).</li></ol><p><em>What the material does not establish:</em> the full authorization set for every view. I read the Allocation Analysis one only, so check the Prerequisites sections of the other views in H13.</p><h2>Mapping of overview pages to CDS views: Allocation Analysis and Business Share Analysis to C_TranspAllocComplianceQ and C_BusinessShareComplianceQ, Cost Analysis to C_FreightSettlementCostQ and C_TranspOrdInvcgBlockStsQ, Freight Booking and Freight Order monitoring and quantity pages to their Execution, Execution Status and Quantity queries, Tendering Analysis to C_TenderingQuery (H13, Summary table)</h2><p>The H13 summary table, completed with the Fiori IDs from each page's Technical Basis section:</p><table><thead><tr><th>Overview page</th><th>Fiori ID</th><th>Detailed views (Fiori ID)</th><th>CDS views</th></tr></thead><tbody><tr><td>Allocation Analysis</td><td>F2673</td><td>Transportation Allocation (F2745)</td><td>C_TranspAllocComplianceQ</td></tr><tr><td>Business Share Analysis</td><td>F2674</td><td>Business Share (F2746)</td><td>C_BusinessShareComplianceQ</td></tr><tr><td>Cost Analysis</td><td>F2672</td><td>Transportation Costs (F2754); Transportation Invoice Blocked (F2755)</td><td>C_FreightSettlementCostQ; C_TranspOrdInvcgBlockStsQ</td></tr><tr><td>Freight Booking Execution Monitoring</td><td>F2677</td><td>Freight Booking Execution (F2747); Freight Booking Execution Status (F2748)</td><td>C_FrtBkgExecutionQuery (Event Query); C_FrtBkgExecutionStsQ (Status Query)</td></tr><tr><td>Freight Booking Quantity Analysis</td><td>F2678</td><td>Freight Booking Quantity (F2749)</td><td>C_FrtBkgQuantityQuery</td></tr><tr><td>Freight Order Execution Monitoring</td><td>F2675</td><td>Freight Order Execution (F2750); Freight Order Execution Status (F2751)</td><td>C_FrtOrdExecutionQuery (Event Query); C_FrtOrdExecutionStsQ (Status Query)</td></tr><tr><td>Freight Order Quantity Analysis</td><td>F2676</td><td>Freight Order Quantity (F2752)</td><td>C_FrtOrdQuantityQuery</td></tr><tr><td>Tendering Analysis</td><td>F2679</td><td>Tendering (F2753)</td><td>C_TenderingQuery</td></tr></tbody></table><p>Note that two pages are fed by two CDS views, called data sources 1 and 2, each producing different cards: Cost Analysis, and the Freight Booking and Freight Order Execution Monitoring pages. In each case a card resolves to a detailed view, the detailed view to its CDS view, and the CDS view to an OData service with the same name plus _CDS, for example C_TENDERINGQUERY_CDS.</p><p>In the Freight Order Execution Monitoring page, the blocking and non-blocking discrepancies, carrier, location and activity on time performance, and unexpected events cards open the Freight Order Execution Detailed View. The life cycle status analysis, execution and planning block analysis, and delayed-in-transit cards open the Freight Order Execution Status Detailed View (H13).</p><h2>Delivered time filters: all CDS views behind the OVPs and analytical list pages contain the current and previous month on a two-month rolling basis; they can be changed with metadata extensions (SAP Note 2779334) (H13, Metadata Extensions to Replace Delivered Time Filters)</h2><p>SAP provides time filters with all the CDS views behind the OVPs and analytical list pages (ALPs) in TM. In all cases they contain the current and previous month, on a two-month rolling basis. You can change them with metadata extensions, per SAP Note 2779334 (H13). So every page and detailed view you read covers this window unless a customer has changed it, which matters when a user asks why last quarter's data is missing.</p><h2>Allocation Analysis (Fiori ID F2673; detailed view F2745): KPIs for weight, volume and amounts of the transportation allocation including net, gross, minimum and maximum values and total and average utilization; cards such as Trade Lane Weight, Volume and Container Load Analysis, Transportation Mode Category Analysis, Overall Weight and Container Utilization Distribution; Change Transportation Allocation opens the allocation in edit mode (H13, Allocation Analysis; Transportation Allocation Detailed View)</h2><p><strong>Audience.</strong> A transportation manager for a shipper who works with carriers (H13).</p><p><strong>KPIs.</strong> Weight, volume and amounts of the transportation allocation, including net, gross, minimum and maximum values, plus total and average utilization for all units of measure. Data covers the current and previous month.</p><p><strong>Cards:</strong></p><ul><li>Trade Lane Weight Load Analysis: total current, minimum and maximum weights by orientation (for example along) for each carrier. It may help identify the most effective trade lane for goods of a given size and orientation.</li><li>Trade Lane Volume Load Analysis: the same for aggregated volumes.</li><li>Trade Lane Container Load Analysis: the same for container counts.</li><li>Transportation Mode Category Analysis: weight, volume and quantities transported per mode category, for example air or sea.</li><li>Overall Weight Utilization Distribution: the total weight per carrier per month, and any increase above the average minimum threshold or decrease from the average maximum threshold.</li><li>Overall Container Utilization Distribution: the same for container counts.</li></ul><p><strong>Detailed view (F2745).</strong> It shows a donut chart of total gross weight for the current and previous month, a line chart of gross weight by mode category, and bar charts of gross volume per means of transport and number of containers by orientation. The table lists allocation, orientation, source and destination location, gross weight and volume. Selecting an allocation and choosing <strong>Change Transportation Allocation</strong> opens it in edit mode in TM. The field view accepts weight, volume and quantity unit, minimum and maximum tolerance (percentage), mode, means of transport and orientation.</p><p><strong>Use case in the help.</strong> Find the destinations that took the highest gross weight by road last month and the number of containers used. One location has low weight but many containers, so you open the allocation and look at the carrier and details.</p><p><strong>Technical.</strong> CDS view C_TranspAllocComplianceQ, OData service C_TRANSPALLOCCOMPLIANCEQ_CDS. The view is built on the Transportation Allocation business object.</p><h2>Business Share Analysis (F2674): current amount and target quantity per carrier, ratio and business share per month; Weight Fulfillment Ratio, Volume Fulfillment Ratio, Trade Lane Fulfillment, Road, Sea and Air Fulfillment Distribution compare actual booked carrier quantity with target quantity (H13, Business Share Analysis)</h2><p><strong>KPIs.</strong> The current amount and target quantity of each carrier's transports, the current value to target quantity ratio, and business share quantities per month, for the current and previous month (H13).</p><p><strong>Cards:</strong></p><ul><li><strong>Weight Fulfillment Ratio</strong>: how much of their allocated share carriers achieved, also as a percentage. The help's example is 328,750 kg out of an allocation of 493,125 kg (66.67%).</li><li><strong>Volume Fulfillment Ratio</strong>: the same for volume, for example 5000 m3 out of 10000 m3 (50%).</li><li><strong>Trade Lane Fulfillment</strong>: how each trade lane performs against its allocated share for all units of measure, for example 987,500 kg out of 987,500 kg (100%).</li><li><strong>Road Fulfillment Distribution (Weight), Sea Fulfillment Distribution, Air Fulfillment Distribution</strong>: actual booked carrier quantity against the target quantity, shown as a graph.</li></ul><p><strong>Detailed view (F2746).</strong> The help example: you planned 70% of shipments to one carrier and 30% to another, but the first carrier took 90% and the second none. You already incurred penalties past the 70% threshold. You research why, and change the business share information in favor of the second carrier.</p><p><strong>Technical.</strong> CDS view C_BusinessShareComplianceQ, OData service C_BUSINESSSHARECOMPLIANCEQ_CDS, built on the Business Share business object. The weight and volume unit parameters are mandatory.</p><h2>Cost Analysis (F2672): two data sources, C_FreightSettlementCostQ for cost cards (Cost Distribution, Carrier Cost Analysis, Charge Type Analysis, Purchasing Organization Cost Analysis and others) and C_TranspOrdInvcgBlockStsQ for Invoicing Block Analysis; the Invoicing Block Analysis card opens the Transportation Invoice Blocked Detailed View, any other card the Transportation Costs Detailed View (H13, Cost Analysis)</h2><p><strong>Audience.</strong> A transportation manager or person responsible for costs, who tracks costs and issues with freight orders or freight bookings blocked for invoicing (H13). KPIs cover cost amounts by invoicing week, mode category (with weights and volumes), carrier, charge type, purchasing organization, source and destination country or region, and the number of transportation orders blocked for invoicing, with reasons.</p><p><strong>Data source 1, C_FreightSettlementCostQ:</strong></p><ul><li><strong>Cost Distribution</strong>: invoiced, credit and cost amounts for each invoicing week.</li><li><strong>Cost and Quantity Analysis</strong>: total cost per transportation mode category, with gross weight and volume. It is a bubble chart.</li><li><strong>Logistic Network Analysis</strong>: total cost per source and destination country or region, highest first.</li><li><strong>Carrier Cost Analysis</strong>: carriers with the highest costs first.</li><li><strong>Charge Type Analysis</strong>: charge types with the highest costs first, for example basic freight charges or pick up charges.</li><li><strong>Purchasing Organization Cost Analysis</strong>: purchasing organizations with the highest costs first.</li></ul><p><strong>Data source 2, C_TranspOrdInvcgBlockStsQ:</strong> the <strong>Invoicing Block Analysis</strong> card shows how many freight orders or freight bookings are blocked for invoicing, per blocking reason, such as time conflict, compliance or incomplete for planning.</p><p><strong>Where the cards lead.</strong> Invoicing Block Analysis opens the Transportation Invoice Blocked Detailed View (F2755). Any other card opens the Transportation Costs Detailed View (F2754).</p><p><strong>Help examples.</strong></p><ul><li><em>Blocked for invoicing.</em> Three sea freight orders are blocked with block category time conflict and block reason penalty charges. You open the orders, find that the carrier arrived late for its customs slot twice, and contact the carrier about the penalty dispute.</li><li><em>Costs.</em> High air freight cost in one invoicing week. You navigate to the freight settlement document and the air freight booking.</li></ul><p><strong>Technical.</strong> OData services C_FREIGHTSETTLEMENTCOSTQ_CDS and C_TRANSPORDINVCGBLOCKSTSQ_CDS. This page uses the most parameters: P_DisplayTimeUnit, P_DisplayWeightUnit, P_DisplayVolumeUnit, P_DisplayQuantityUnit, P_DisplayLengthUnit and P_DisplayCurrency, all mandatory.</p><h2>Freight Order Execution Monitoring (F2675) and Freight Booking Execution Monitoring: Life Cycle Status Analysis, Execution Block and Planning Block Analysis, Delayed Freight Orders in Transit, Blocking and Non-Blocking Discrepancies, Carrier, Location and Activity On Time Performance, Unexpected Events; a freight order is on time if all its events are classed as on time, and the on time cards use time-relevant events with expected and actual date and time and event status Reported (H13, Freight Order Execution Monitoring)</h2><p><strong>Purpose.</strong> KPIs on critical process statuses that lead to blocking situations, and a carrier's on time performance, which helps when allocating future business (H13). The Freight Booking page (F2677) is built the same way for freight bookings.</p><p><strong>Data source 1, C_FrtOrdExecutionStsQ (status):</strong></p><ul><li><strong>Life Cycle Status Analysis</strong>: execution-relevant freight orders by life cycle status. Execution-relevant means execution status In Execution (03), with a departure event but no arrival event at the final destination. For freight bookings, the counts per status Draft (00), New (01) or In Process (02) are shown in descending order.</li><li><strong>Execution Block Analysis</strong> and <strong>Planning Block Analysis</strong>: freight orders with a block, grouped by reason, in descending order. The reasons are specified in the TM Freight Order transaction. If you have not done so, the system creates them from the blocking category.</li><li><strong>Delayed Freight Orders in Transit</strong>: freight orders whose latest time-relevant event is delayed. Both the expected and actual date and time fields must exist and the event status must be Reported. The delay is the difference between the actual and expected date.</li></ul><p><strong>Data source 2, C_FrtOrdExecutionQuery (events):</strong></p><ul><li><strong>Blocking Discrepancies</strong> and <strong>Non-Blocking Discrepancies</strong>: discrepant events that did or did not lead to a block, by event code and discrepancy type.</li><li><strong>Carrier On Time Performance</strong>: the percentage of freight orders each carrier delivered on time, also as numbers, for example 6 / 14. A freight order is on time if all its events are classed as on time. Otherwise it is classed as delayed.</li><li><strong>Location On Time Performance</strong>: the percentage of on time events per location, lowest first, for example 6 / 8.</li><li><strong>Activity On Time Performance</strong>: the percentage of on time events per event code, such as loading or unloading, lowest first, for example 12 / 27.</li><li><strong>Unexpected Events</strong>: events such as accident or delay, grouped by event code, highest count first.</li></ul><p><strong>Definition of on time.</strong> The calculation for all on time cards uses all time-relevant events that have both expected and actual date and time and the event status Reported (H13).</p><p><em>Source wording to note:</em> in the freight order section, the help text says freight bookings in the Life Cycle Status Analysis description and in the "Freight bookings delayed in transit" card reference. That looks like carry-over from the booking page. The card is named Delayed Freight Orders in Transit in the key features list.</p><h2>Freight Order Quantity Analysis (F2676) and Freight Booking Quantity Analysis: gross weight, gross volume and quantity distribution by week for completed freight orders, carrier, shipper and ship-to party quantity analysis, Utilization Distribution, Distance Analysis (H13, Freight Order Quantity Analysis)</h2><p><strong>KPIs.</strong> Current weight, volume and numbers being transported weekly by each carrier, shipper and ship-to party, by transportation mode, and by source and destination country or region. Each carrier's utilization performance is also shown (H13). Cards cover <strong>completed</strong> freight orders, that is, life cycle status Completed.</p><p><strong>Cards:</strong></p><ul><li>Gross Weight, Gross Volume and Quantity Distribution: change by completion week over the current and previous month.</li><li>Transportation Mode Category Analysis: gross weight and gross volume as axes, with the number of freight orders per mode category.</li><li>Logistic Network Analysis: source and destination countries or regions with total gross weight, highest first.</li><li>Carrier, Shipper and Ship-To Party Quantity Analysis: total gross weight, gross volume and container count per party.</li><li><strong>Utilization Distribution</strong>: the lowest average utilization per carrier as a percentage, lowest first.</li><li>Quantity Analysis: gross volume and gross weight per mode category.</li><li><strong>Distance Analysis</strong>: total net duration and total distance per mode category.</li></ul><p><strong>Technical.</strong> F2676 uses C_FrtOrdQuantityQuery (OData service C_FRTORDQUANTITYQUERY_CDS). The detailed view is F2752. The booking equivalent is F2678, with C_FrtBkgQuantityQuery and detailed view F2749. I read the freight order page in full and the booking page only at the card-name level.</p><h2>Tendering Analysis (F2679): Open Requests, Overdue Requests, Acceptance Analysis, Tendering Peer-to-Peer Cycle Analysis, Tendering Cycle Time Analysis, Tendering Ratio, Original Carrier Changed (comparison of awarded business against the carrier the system proposed) (H13, Tendering Analysis)</h2><p><strong>Audience.</strong> A tendering manager or transportation manager. The page helps you identify the best carriers, assess them for peer-to-peer freight requests for quotation (RFQs) and across all tendering types, find the best tendering type per carrier, and investigate why a system-proposed carrier was manually replaced (H13).</p><p><strong>Cards:</strong></p><ul><li><strong>Open Requests</strong>: your current worklist of freight RFQs sent out that have not yet reached their deadline. You drill down and open the request in TM.</li><li><strong>Overdue Requests</strong>: RFQs past their deadline. You can work with critical requests where there may still be time to answer.</li><li><strong>Acceptance Analysis</strong>: the proportion of RFQs an individual carrier responded to, and the number accepted out of the total, for example 2 / 4.</li><li><strong>Tendering Peer-to-Peer Cycle Analysis</strong>: the proportion of peer-to-peer requests a carrier answered with a quotation, and response times. It shows who responds immediately, who delays, and who delays and then submits a higher amount.</li><li><strong>Tendering Cycle Time Analysis</strong>: the average cycle time in hours and the number of cycles per carrier, across a mix of tendering types, for example peer-to-peer and broadcast.</li><li><strong>Tendering Ratio</strong>: the most successful tendering type per carrier, answering which type gets the most or the quickest responses.</li><li><strong>Original Carrier Changed</strong>: the percentage and number of times the carrier the system proposed was manually replaced by another carrier, with reasons. It compares the business you actually awarded against the business the system proposed.</li></ul><p><strong>Detailed view (F2753).</strong> A bar chart of cycle time by requested carrier. The view-by options include freight RFQ status, life cycle status and negative responses. The <strong>Change Tendering</strong> button opens the freight order in edit mode.</p><p><strong>Technical.</strong> CDS view C_TenderingQuery, OData service C_TENDERINGQUERY_CDS.</p><h2>Main input parameters: P_Language, P_TodayDate (system date; data from the beginning of the previous month up to the system date), P_DisplayTimeUnit, P_DisplayWeightUnit, P_DisplayVolumeUnit, P_DisplayQuantityUnit, P_DisplayLengthUnit, P_DisplayCurrency; the unit and currency parameters are mandatory; Allocation Analysis adds P_TrAlcMinToleranceInPercent and P_TrAlcMaxToleranceInPercent (H13, Main Input Parameters of each view)</h2><p>Each view's Structure section lists main input parameters (H13). The subset differs by view.</p><table><thead><tr><th>Parameter</th><th>What it does</th></tr></thead><tbody><tr><td>P_Language</td><td>Display language of texts. The system uses the system language automatically.</td></tr><tr><td>P_TodayDate</td><td>Timeframe of the data. The system uses the system date, usually your local date, and retrieves data from the beginning of the previous month up to the system date.</td></tr><tr><td>P_DisplayTimeUnit</td><td>Units of time, for example Event Delay in hours or minutes.</td></tr><tr><td>P_DisplayWeightUnit</td><td>Units of weight, for example Gross Weight in kilograms.</td></tr><tr><td>P_DisplayVolumeUnit</td><td>Units of volume, for example Item Volume in meters cubed.</td></tr><tr><td>P_DisplayQuantityUnit</td><td>Units of quantity, for example Number of Containers in pieces.</td></tr><tr><td>P_DisplayLengthUnit</td><td>Units of length, for example Package Length in meters.</td></tr><tr><td>P_DisplayCurrency</td><td>Currency, for example Invoice Amount in euros.</td></tr><tr><td>P_TrAlcMinToleranceInPercent, P_TrAlcMaxToleranceInPercent</td><td>Allocation Analysis only: another tolerance value for the minimum and maximum value.</td></tr></tbody></table><p>The unit and currency parameters are mandatory. In the views I read, the Allocation Analysis and Business Share Analysis views name the weight and volume unit parameters as the mandatory ones, and Cost Analysis names all six unit and currency parameters. The help does not list the same set in every view.</p><h2>Analytics in the wider TM processes: overview pages can be tailored to business roles and supervisors of execution can start at the freight order execution overview (S48600, Analytics and Collaboration); analytics can analyze historic transportation volumes to determine procurement needs, but their use is not mandatory for the strategic freight procurement process (S4TM3, Determination of Procurement Needs)</h2><p><strong>In the process landscape (S48600).</strong> Analytics and Collaboration is the fifth stage of TM. Pages can be tailored to business roles, and users who supervise transportation execution can begin their day at the freight order execution overview.</p><p><strong>In strategic freight procurement (S4TM3).</strong> SAP analytic tools can analyze historic transportation volumes to determine procurement needs. That analysis is helpful when creating a forecast for the next period. S4TM3 also names the allocation and business share analysis as examples of the areas a page can cover. However, the analysis of historic data and the creation of a forecast "are not related to the freight agreement master RFQ" created from that information. So using the analysis tools is not mandatory for the SFP process.</p><p>S4TM3 adds, in a different lesson, that trade lanes do not influence optimizer planning, but they are important to analytics (and used in Trade and Commodity Management, and sometimes as restrictions for carrier selection in the case of allocations).</p><p><em>What the material does not establish:</em> the other analytics, such as reports and KPI dashboards that S48600 mentions, beyond the overview pages and ALPs covered in H13. It also does not describe the collaboration half of the stage here.</p><section class="practice"><h2>Practice</h2><p>Build a one-page analytics map. List each TM overview page with its Fiori ID, the CDS views behind it, its detailed views, and one business question it answers. Start from the table in the mapping section and add the question per page, for example which carriers have the highest on time performance, or why freight orders are blocked for invoicing.</p></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain which TM overview page and detailed view answers a given KPI question, and what feeds it technically, to a transportation manager without notes?</p></section>` },
  { n:"14", title:"Enterprise Services, ESR Content and BRFplus", html:`<h2>Overview</h2><p>This session covers two technical topics that sit behind the business processes of earlier sessions. The first is how SAP TM exchanges transportation orders, transportation requests, customs and trade-compliance requests, and other messages with partners and with SAP ERP through enterprise services, and which additional ESR content (integration scenarios and mappings) complements them (H14). The second is BRFplus, the rule framework in which business rules are modeled once and reused by calling applications (H15). In practice you read this material when you must find which operation carries a message, why a message failed, which BAdI can change its content, or how a rule is structured.</p><h2>Enterprise services for SAP TM are documented per process component, each with business process objects, service interfaces and service operations; additional ESR content (integration scenarios, mappings) complements them</h2><p>H14 is organized in a fixed hierarchy. A <strong>process component</strong> (for example Transportation Order Processing) has one or more <strong>business process objects</strong> (for example Transportation Order); each object has <strong>service interfaces</strong> (for example Export Declaration Requesting Out); each interface groups <strong>service operations</strong> (for example Request Export Declaration). Every level has a Definition and a Technical Data table, and the operation level adds Business Context and Use, Related Operations, Features, Message Types, Prerequisites, Error Handling, Integration, Configuration and Enhancements (H14).</p><p>The enterprise services themselves are described in section 2 of H14. Section 3 covers Other Web Services, and section 4 covers Additional ESR Content, that is, integration scenarios and mappings stored in the Enterprise Services Repository (H14). The following items work through each part.</p><p><em>What the material does not establish:</em> the ESR is not explained as a product here, only the content that SAP TM places in it.</p><h2>Process component TransportationOrderProcessing covers the ordering of transportation services from carriers: it lets shippers, logistics service providers and carriers exchange transportation-relevant data and create, change or cancel freight orders, freight requests for quotation or freight bookings, assign transportation demands to capacities, and let shippers create delivery proposals</h2><p>The definition in H14 is short: "the ordering of transportation services from carriers". The process component gives shippers, logistics service providers and carriers functions to exchange transportation-relevant data and to create, change or cancel freight orders, freight requests for quotation and freight bookings. It also lets them assign transportation demands to transportation capacities, and lets shippers create delivery proposals for further processing in the corresponding logistics execution system (H14, Transportation Order Processing).</p><p>From a shipper's perspective a carrier may also be a logistics service provider (LSP), whose business typically consists of consolidating transportation demands from several shippers into containers or full truck loads (H14).</p><p>Do not confuse it with TransportationRequestProcessing: that component is defined as the processing of requests from an ordering party for the provision of transportation services (H14).</p><h2>In the TransportationOrderProcessing scenario a shipper sends a transportation order to a carrier, who receives it as a transportation request and is expected to confirm; the carrier may subcontract the order to other carriers, who reply with confirmations</h2><p>The scenario in H14 runs in three steps.</p><ol><li>During transportation planning, the shipper decides which freight units go on its own vehicle resources and which are subcontracted to carriers.</li><li>The shipper sends a transportation order to a carrier. The carrier receives it in the form of a transportation request and is expected to send a confirmation to the shipper.</li><li>The carrier can then do refined planning on the transportation request and decide whether its own resources or one or more subcontractors execute the service. If it subcontracts, it sends a transportation order to the subcontractors, who can reply with confirmations. These activities happen in the carrier's own business system (H14).</li></ol><p>A concrete pair in H14 shows how this looks at operation level. The outbound operation Request Transportation Order (technical name TransportationOrderRequest_Out, category B2B, asynchronous, released) sends a new or updated freight order to a carrier. The corresponding inbound Maintain Transportation Request (TransportationRequestRequest_In, category B2B, asynchronous, Released with Restrictions) in TransportationRequestProcessing creates or changes a forwarding order from it. The inbound side answers with the outbound Confirm Transportation Request, which says whether the carrier accepted or rejected the freight order, and a Cancel Transportation Request inbound operation cancels the forwarding order when the freight order is cancelled (H14, Request Transportation Order; Maintain Transportation Request).</p><p>Request Transportation Order can also be sent as a notification for late changes, with no further subcontracting or tendering. That use needs an EDI communication profile assigned to the carrier in the business partner master data and a BAdI that determines the freight orders (H14).</p><h2>The business process object TransportationOrder supports requesting a quotation, requesting execution of a transportation service, booking freight space, cancellations, replies (accept, modify, decline), shipping instructions (waybill notification), loading appointments and notifications about loading or unloading</h2><p>The Transportation Order business object is defined as an order from an ordering party to a carrier to transport goods from one or more shippers to one or more consignees under agreed terms; it can include the assignment of vehicle resources and stages, and can have the character of a freight request for quotation (H14, Transportation Order). It enables shippers, logistics service providers, and carriers who subcontract to:</p><ul><li>request a quotation by sending a freight request for quotation;</li><li>request execution of a transportation service by sending a freight order;</li><li>book freight space by sending a freight booking;</li><li>send a cancellation of a freight request for quotation, freight order or freight booking;</li><li>receive replies in which the carrier accepts, modifies or declines;</li><li>send a shipping instruction (also called waybill notification) based on an already confirmed freight booking, or receive one, in which case a replicated freight booking document is created in the receiving system (typically an import organization informed by an export organization in a multinational company);</li><li>request a loading appointment by sending planning information about loading or unloading to a business partner such as a warehouse or container freight station;</li><li>receive notifications that loading or unloading has been executed.</li></ul><p>It also lets a freight order or freight booking be updated from current execution information, for example customs processing information (H14).</p><h2>Process component TransportationRequestProcessing handles customer requests for transportation services: A2A scenarios (Order Integration with order-based transportation requirements OTR, Delivery Integration with delivery-based transportation requirements DTR) and B2B scenarios (Forwarding Quotations, Forwarding Orders, Forwarding Orders Based on Forwarding Quotations)</h2><p>H14 defines this component as the processing of requests from an ordering party for transportation services. A request represents, in a B2B scenario, a forwarding quotation or a forwarding order, and in an intracompany (A2A) scenario an order-based transportation requirement (a preliminary request for a particular order) or a delivery-based transportation requirement (a finalized request for a particular delivery) (H14).</p><table><thead><tr><th>Type</th><th>Scenario</th><th>What happens</th></tr></thead><tbody><tr><td>A2A</td><td>Order Integration</td><td>Orders move from order processing to transportation request processing, where an order is an OTR. Used for sales orders, purchase orders (including stock transport orders) and returns orders</td></tr><tr><td>A2A</td><td>Delivery Integration</td><td>Deliveries move from delivery processing, where a delivery is a DTR. Used for inbound and outbound deliveries</td></tr><tr><td>B2B</td><td>Forwarding Quotations</td><td>The carrier receives a request for quotation, creates a forwarding quotation, then confirms it (sends a quotation) or sends a rejection reason; the customer can cancel the request for quotation</td></tr><tr><td>B2B</td><td>Forwarding Orders</td><td>The carrier receives a new or updated freight order and creates or updates a forwarding order, then confirms; the customer can cancel, if the forwarding order status allows it</td></tr><tr><td>B2B</td><td>Forwarding Orders Based on Forwarding Quotations</td><td>A forwarding order is created with reference to an existing forwarding quotation</td></tr></tbody></table><p>A customer can be a shipper, a logistics service provider, or a carrier who subcontracts to another carrier (H14).</p><p>In practice the A2A entry point is Maintain Transportation Request (IntracompanyTransportationRequestRequest_In, category SAP A2A, inbound, asynchronous, released) in the Intracompany Transportation Requesting In interface. It receives order or delivery data from sales order, purchase order, customer return, outbound delivery and inbound delivery processing and creates or changes OTRs or DTRs. It can also create or change DTRs after a delivery split triggered by SAP ERP, SAP EWM or SAP TM (H14).</p><h2>The business process object TransportationRequest lets a carrier receive requests for quotation and create forwarding orders, and lets a shipper plan and execute order-based and delivery-based transportation requirements</h2><p>For a carrier, the Transportation Request object supports two activities (H14, Transportation Request):</p><ul><li>receive a request for quotation from a customer, submit a forwarding quotation, and, if the customer accepts, create a forwarding order based on it;</li><li>create a forwarding order from an order received from a customer. The carrier uses it to plan and execute and for the customer settlement process.</li></ul><p>For a shipper, the object enables planning and execution for OTRs and DTRs created from orders and deliveries received from a logistics execution system (H14).</p><p>H14 adds a naming link: in the SAP TM back end, a forwarding order, an OTR and a DTR each correspond to an instance of the Transportation Request business object (H14).</p><h2>A service interface groups operations and is described by category (for example SAP A2A, B2B) and direction (inbound or outbound); a service operation is described by release state, technical name, namespace, direction, mode, idempotency and P2P communication enabled</h2><p>Every interface and operation page has a Technical Data table. How to read it (H14):</p><table><thead><tr><th>Level</th><th>Fields in the table</th></tr></thead><tbody><tr><td>Service interface</td><td>Entity type, Category (for example SAP A2A or B2B), Direction (Inbound or Outbound)</td></tr><tr><td>Service operation</td><td>Entity type, Release State, Technical Name, Namespace, Direction, Mode, Idempotency, P2P Communication Enabled. Some operations also show Application Component, Category, Change/Update Behavior or Business Context</td></tr></tbody></table><p>Examples of values in the source: mode Asynchronous or
