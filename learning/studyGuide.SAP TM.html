<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{Subject} — Study Guide</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --ink:#1a1a18; --ink-soft:#5c5c57; --ink-faint:#8a8a84;
  --rule:#e4e4e0; --rule-soft:#efefec; --accent:#2f6f62; --accent-soft:#e8f0ee;
  --code-bg:#f4f4f2; --sidebar:300px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15161a; --panel:#1c1e23; --ink:#e8e8e4; --ink-soft:#a8a8a2; --ink-faint:#77776f;
    --rule:#2d3038; --rule-soft:#24262b; --accent:#6fb3a1; --accent-soft:#1f2a28;
    --code-bg:#22252b;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.skip{position:absolute;left:-9999px}
.skip:focus{left:8px;top:8px;z-index:10;background:var(--panel);padding:8px 12px;border-radius:6px}

/* masthead */
header.top{
  position:sticky; top:0; z-index:5; background:var(--panel);
  border-bottom:1px solid var(--rule); padding:14px 24px;
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
header.top .dom{font-size:13px;color:var(--ink-faint)}
header.top .count{margin-left:auto;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

/* shell */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}

/* sidebar */
nav.side{
  width:var(--sidebar); flex:0 0 var(--sidebar); position:sticky; top:57px;
  max-height:calc(100vh - 57px); overflow-y:auto; padding:20px 12px 40px;
  border-right:1px solid var(--rule-soft);
}
nav.side h2{
  font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);
  margin:0 0 10px 10px;font-weight:650;
}
nav.side ol{list-style:none;margin:0;padding:0}
nav.side button{
  display:flex;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:none;border:0;border-radius:7px;padding:9px 10px;margin-bottom:1px;
  color:var(--ink-soft);font:inherit;font-size:14px;line-height:1.4;
}
nav.side button:hover{background:var(--rule-soft);color:var(--ink)}
nav.side button .n{
  color:var(--ink-faint);font-variant-numeric:tabular-nums;font-size:12.5px;
  padding-top:1px;flex:0 0 auto;
}
nav.side button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
nav.side button[aria-current="true"] .n{color:var(--accent)}
nav.side button.seen .n::after{content:"·";margin-left:4px;color:var(--accent)}

select.jump{
  display:none;width:100%;margin:12px 0 0;padding:10px 12px;font:inherit;font-size:14px;
  color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px;
}

/* content */
main{flex:1 1 auto;min-width:0;padding:36px 48px 100px;max-width:76ch}
main h1{font-size:27px;line-height:1.25;margin:0 0 6px;letter-spacing:-.02em;font-weight:680}
main .eyebrow{
  font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);
  font-weight:650;margin-bottom:10px;
}
main h2{
  font-size:19px;margin:38px 0 10px;padding-top:16px;border-top:1px solid var(--rule-soft);
  letter-spacing:-.01em;font-weight:650;
}
main h2:first-of-type{border-top:0;padding-top:0}
main h3{font-size:16px;margin:24px 0 8px;font-weight:650}
main p{margin:0 0 14px}
main ul,main ol{margin:0 0 14px;padding-left:22px}
main li{margin-bottom:6px}
main li>ul,main li>ol{margin:6px 0 0}
main strong{font-weight:650}
main a{color:var(--accent);text-underline-offset:2px}
main code{
  font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--code-bg);padding:.12em .38em;border-radius:4px;
}
main pre{
  background:var(--code-bg);padding:14px 16px;border-radius:9px;overflow-x:auto;
  margin:0 0 16px;border:1px solid var(--rule-soft);
}
main pre code{background:none;padding:0;font-size:13px;line-height:1.6}
main blockquote{
  margin:0 0 16px;padding:2px 0 2px 16px;border-left:3px solid var(--rule);
  color:var(--ink-soft);
}
main table{border-collapse:collapse;width:100%;margin:0 0 18px;font-size:14.5px;display:block;overflow-x:auto}
main th,main td{border:1px solid var(--rule);padding:8px 11px;text-align:left;vertical-align:top}
main th{background:var(--rule-soft);font-weight:650}
main hr{border:0;border-top:1px solid var(--rule);margin:30px 0}

/* section landmarks produced from the session markdown */
main section.practice,main section.selfcheck{
  background:var(--panel);border:1px solid var(--rule);border-radius:11px;
  padding:18px 20px 4px;margin:34px 0 0;
}
main section.practice h2,main section.selfcheck h2{border-top:0;padding-top:0;margin-top:0}

/* pager */
.pager{display:flex;gap:12px;margin-top:48px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{
  flex:1 1 0;min-width:0;cursor:pointer;background:var(--panel);color:var(--ink-soft);
  border:1px solid var(--rule);border-radius:9px;padding:12px 15px;font:inherit;
  font-size:13.5px;text-align:left;
}
.pager button:last-child{text-align:right}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:3px}

.empty{color:var(--ink-faint);padding:60px 0;text-align:center}

@media (max-width:860px){
  .shell{display:block}
  nav.side{
    position:static;width:auto;flex:none;max-height:none;overflow:visible;
    border-right:0;border-bottom:1px solid var(--rule-soft);padding:14px 20px;
  }
  nav.side ol{display:none}
  nav.side h2{margin-left:0}
  select.jump{display:block}
  main{padding:26px 20px 80px;max-width:none}
}

@media print{
  header.top{position:static}
  nav.side,.pager,select.jump{display:none}
  main{max-width:none;padding:0}
}
</style>
</head>

<!-- ============================================================
     FILL PER COMPILE — studyGuideCreator writes only this block.
     ============================================================
     SUBJECT   the assistant's subject, from CLAUDE.md
     DOMAIN    the {DOMAIN} token, from CLAUDE.md. Empty string is fine.
     SESSIONS  one entry per file in learning/study guides/, in session order:
                 n     two-digit session number as a string, e.g. "01"
                 title the session title, with no number prefix
                 html  the session's markdown converted to an HTML fragment

     Inside the html backtick string, escape every literal backtick as \` and
     every literal ${ as \${ — otherwise the template literal breaks.
     Wrap the Practice and Self-check sections as
       <section class="practice"> and <section class="selfcheck">
     Do not emit an <h1>; the engine renders the session title itself.
     Strip every (tier: inferred) marker — they never reach the learner.

     LABELS    the interface text, in the learning language. Leave it empty
               for English. Otherwise give every key, translated:
                 studyGuide sessions session sessionsCount sessionLabel
                 jump skip empty previous next start end
     ============================================================ -->
<script>
const SUBJECT = "SAP TM";
const DOMAIN  = "SAP S/4HANA Transportation Management (SAP TM)";
const LABELS  = {};
const SESSIONS = [
  { n:"01", title:"SAP TM in SAP S/4HANA: Overview and Fiori Experience", html:`<h2>Overview</h2><p>This session places SAP Transportation Management (TM) inside SAP S/4HANA. It covers how TM relates to the older basic shipping (LE-TRA), what TM does across its five stages, the six objects you will meet in every later session, and how users reach TM through SAP Fiori. Nearly every later session builds on these objects, so learn the abbreviations here.</p><h2>Basic shipping (LE-TRA) versus Transportation Management: LE-TRA is part of the compatibility scope and its code line is kept within SAP S/4HANA Enterprise Management until end of 2030; TM has been part of SAP S/4HANA since 1709, and its advanced functions require an additional license</h2><p>Logistics Execution in SAP ERP covered warehouse management, shipping and transportation. Inbound shipments follow procurement: purchase order, vendor confirmation, inbound delivery, inbound shipment, goods receipt, invoice verification. Outbound shipments follow sales: sales order, outbound delivery, outbound shipment, goods issue, invoice (S4611).</p><p>The software component LE-TRA carried this transportation content in SAP ECC. It is part of the compatibility scope, and its code line stays in SAP S/4HANA Enterprise Management until end of 2030. Its functionality is called <strong>basic shipping</strong>.</p><p>From SAP S/4HANA 1709, <strong>Transportation Management</strong> is part of SAP S/4HANA Enterprise Management. It offers much more comprehensive functionality, and its advanced functions need an additional license. It can also be used with limited scope, offering the same capabilities as LE-TRA, and that use needs no specific license. Before release 2020 the name "Basic Shipping" was also used for the base variant of SAP S/4HANA TM. From 2020 that capability is called Transportation Management.</p><p>Basic shipping and TM are independent. They can run in parallel on the same SAP S/4HANA database instance, but they have no data exchange and no integration within the shipping process. The course material points to SAP note 3065464 for which objects and functions belong to the basic scope and which need the additional license, and to SAP note 3097186 for a tool that analyzes LE-TRA usage and how to migrate it to TM. Best practices for implementing TM scenarios are in SAP notes 2535942 (1709), 2849554 (1809) and 2970208 (1909).</p><h2>Advanced TM plans from orders (sales orders, purchase orders, MM scheduling agreements) as well as from deliveries, and can combine inbound and outbound deliveries in one freight order; its differentiators are vehicle scheduling and routing, carrier selection, load consolidation and load planning; long term the LE-TRA shipment is replaced by the TM freight order</h2><p>Advanced TM addresses shipping industries and also freight forwarders. In basic shipping, planning is based on deliveries only (outbound and inbound). Advanced TM adds early planning from orders: sales orders, purchase orders and MM scheduling agreements. It also allows inbound and outbound deliveries to be planned together in one freight order.</p><p>The key differentiators over basic shipping are sophisticated planning and optimization options: vehicle scheduling and routing, carrier selection, load consolidation and load planning.</p><p>The direction is clear in the material: long term, the collection of transportation processes is realized only with selected TM functions, and the LE-TRA shipment is replaced by the TM <strong>freight order</strong>. Because the freight processes were developed further in TM, some functions may be realized differently than in LE-TRA (S4611).</p><h2>The five main stages of TM: Requirements and Order Management, Transportation Planning, Transportation Execution, Freight Costing and Settlement, Analytics and Collaboration; and the scenario, shipping, movement and stage types TM supports</h2><p>TM supports many scenarios for shippers and logistics service providers. S48600 lists, for example:</p><ul><li>scenario types: inbound, outbound, domestic, international</li><li>shipping types: LTL, FTL, LCL, FCL and CEP</li><li>movement types: direct shipment, uni-modal, multimodal, port-to-port, door-to-door, export shipment</li><li>stage types: pickup, precarriage, main carriage, on-carriage, delivery, drayage, haulage</li><li>parties and roles, such as ordering party, shipper, consignee, invoicing party, payment party, forwarder or carrier</li><li>legal documents, such as HBL, HAWB, manifests and delivery notes</li></ul><p>H01 adds that TM supports activities such as creating forwarding orders, freight units, delivery proposals, freight orders and freight bookings, performing carrier selection, creating agreements, tendering, dispatching and monitoring, charge calculation, and considering foreign trade and dangerous goods regulations.</p><p>The processes fall into five stages (S48600):</p><ol><li><strong>Requirements and Order Management.</strong> Transportation requirements are created from orders. For shippers this happens either embedded (sales order and delivery in the same system as TM, using SD, MM and LE documents) or decentralized (orders and deliveries in a separate system, represented by order-based or delivery-based transportation requests). The requirements' data, together with freight unit building rules, forms freight units.</li><li><strong>Transportation Planning.</strong> Freight units are assigned to means of transport to create freight orders, manually, with optimization, or semi-automatically (for example transportation proposals, unified package building, load optimization). Planning happens in the transportation cockpit. Carrier selection can be manual, optimized or done by tendering, and produces a ranked list of eligible carriers.</li><li><strong>Transportation Execution.</strong> The freight order is the basis. Cargo movement updates order and cargo status, through manual entries or automatic updates via SAP Event Management and Global Track and Trace.</li><li><strong>Freight Costing and Settlement.</strong> Freight agreements reference calculation sheets that list charge elements. The calculation engine computes the charges, and the result is stored in the freight order. Freight settlement documents are created from freight orders and passed to ERP (accruals, later purchase order and service entry sheet for invoice verification or self-billing).</li><li><strong>Analytics and Collaboration.</strong> Overview pages, reports and KPI dashboards, tailored to business roles.</li></ol><h2>The core TM objects: OTR, DTR, freight unit (FU), freight order (FO), freight agreement (FA) and freight settlement document (FSD)</h2><p>S48600 defines them as follows:</p><table><thead><tr><th>Object</th><th>Abbreviation</th><th>What it is</th></tr></thead><tbody><tr><td>Order-based transportation requirement</td><td>OTR</td><td>Demand from a sales order, purchase order or stock transport order</td></tr><tr><td>Delivery-based transportation requirement</td><td>DTR</td><td>Demand from an inbound or outbound delivery</td></tr><tr><td>Freight unit</td><td>FU</td><td>A set of goods that are transported together across the entire supply chain; the smallest planning unit</td></tr><tr><td>Freight order</td><td>FO</td><td>The object whose execution is planned by a carrier or a shipper</td></tr><tr><td>Freight agreement</td><td>FA</td><td>A contract with the carrier</td></tr><tr><td>Freight settlement document</td><td>FSD</td><td>Used to verify the carrier invoice</td></tr></tbody></table><p>The flow runs from requirement to freight unit (built from the business document data and freight unit building rules), to freight order (planning assigns freight units to means of transport), to freight settlement document (the carrier's charges, based on the freight agreement and calculation sheet, are verified).</p><h2>The SAP Fiori user experience and access to TM: role-based apps and the launchpad, catalogs, groups, spaces and pages; business catalogs and role templates; the three Fiori app types; the SAP Fiori Apps Reference Library; the Personal Object Worklist (POWL)</h2><p><strong>Fiori principles.</strong> SAP Fiori is based on SAPUI5 (HTML5) and is role-based: the large classic transactions are decomposed into discrete apps that fit user roles, all connected, with the launchpad as the central entry point. Users can personalize their launchpad.</p><p><strong>Launchpad structure (S48600).</strong> A tile represents an app. A <strong>catalog</strong> is a set of tiles made available for one role, and catalogs are assigned to business roles. <strong>Groups</strong> define grouping, sort order and appearance of the apps on the home page. The layout can alternatively use <strong>spaces and pages</strong>: a space is the entry point for a business role, consists of one or more pages (self-contained work contexts), and a page consists of sections that structure the tiles. Technical catalogs define apps per solution area; business catalogs reference those apps per user duty; business roles tie business catalogs, groups and spaces to users.</p><p><strong>TM access (H02).</strong> The launchpad is the access point for TM web apps. The tiles a user sees depend on the business catalogs assigned to their business roles. SAP delivers role templates SAP_BR_TRANSPORTATION_MANAGER, SAP_BR_TRANSPORTATION_PLANNER, SAP_BR_FRGHT_CTRC_SPECIALIST and SAP_BR_FRGHT_SETTLEMENT_CLERK. For the Transportation Manager role, the business catalogs include Transportation – Order Management (SAP_TM_BC_OM), Planning (SAP_TM_BC_PLN), Settlement (SAP_TM_BC_STLM), Contract Management (SAP_TM_BC_CTRM) and Charge Management.</p><p><strong>App types (S4611).</strong> Transactional apps use ABAP, the classic approach. Analytical apps use the analytical capabilities of SAP HANA. Fact sheet apps use SAP HANA Enterprise Search.</p><p><strong>SAP Fiori Apps Reference Library (S48600).</strong> It lists all relevant content for the launchpad. You can filter by application type and product version and find the technical data for installation and configuration. Always set the product suite and then the release first, because implementation can differ between releases.</p><p><strong>POWL (S48600).</strong> The Personal Object Worklist gives central, personalized access to document lists. Users define and optionally store queries, similar to ERP selection screen variants. Tables can be filtered and personalized, queries can be refreshed, and refreshes run asynchronously.</p><p><em>What the material does not establish:</em> it gives no complete list of TM role templates beyond the four above, and the Fiori app list file in the corpus is a lookup table, not explained here.</p><section class="practice"><h2>Practice</h2><p>Create a one-page "TM map". Include a table of the five stages, each with its main object and one activity, and a short comparison of basic shipping and advanced TM with two differences taken from this material.</p></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain to a business stakeholder, without notes, how a sales order becomes a freight order and a settled carrier invoice in TM?</p></section>` },
  { n:"02", title:"Business Partners and the Organizational Model", html:`<h2>Overview</h2><p>This session covers the master data that says who takes part in a transportation process (business partners) and which organizational units own the documents (the TM organizational model). It also covers the few material master fields that TM uses. Partner and organization data are read by almost every TM document, from forwarding orders to freight settlement documents. Many questions later come down to which role, partner function or organizational unit applies, so this session sets the vocabulary.</p><h2>Business partner master data: in SAP S/4HANA the master data of customers and vendors is managed as business partners (previously handled separately in SAP ERP); it is maintained with transaction BP or a Fiori app, a business partner can be assigned to multiple company codes, and it is categorized as person, organization or group</h2><p>In SAP ERP, customers and vendors were handled separately. In SAP S/4HANA their master data is managed centrally as business partner master data (S4TM2, S48600). A business partner is any entity with which the company has a business relationship (S48600). Each one is identified by a unique business partner number (H03).</p><ul><li><strong>Maintenance:</strong> with transaction BP or a corresponding app from the SAP Fiori launchpad (S4TM2). In TM, H03 names the launchpad apps Create Customer (Sales), Create Vendor (Purchasing) and Create Forwarding Agent for defining a business partner. The Maintain Business Partner app is used in the carrier review exercise (E01).</li><li><strong>Company codes:</strong> a business partner can be assigned to multiple company codes, and the same business partner number can be maintained across company codes (S4TM2, S48600).</li><li><strong>Categories:</strong> person, organization or group. An organization is an umbrella term for a company, a department of a company or an association. A group is, for example, a shared living arrangement, a married couple or an executive board (S4TM2, S48600).</li></ul><h2>Business partner roles: general data is defined once and roles are assigned for each business context; the role General Business Partner (000000) is assigned automatically on creation; roles most used in TM include FLCU01 Customer, FLCU00 FI Customer, FLVN01 Vendor, FLVN00 FI Vendor, CRM010 Carrier, TM0001 Driver, BUP004 Organizational Unit, BUP001 Contact Person</h2><p>The link between a business partner and other components is a role concept. A BP role corresponds to a business context in which the partner can appear (S4TM2). General data is defined once, such as name, address, communication data, identification numbers and business partner status (H03). Specific data is stored per role. This avoids redundant data, because the general data does not depend on the partner's function or on application-specific extensions (S4TM2). When a business partner is first created, the BP role General Business Partner is assigned automatically (S4TM2, S48600).</p><p>The roles most commonly used in TM (H03, S48600):</p><table><thead><tr><th>Role</th><th>Code</th></tr></thead><tbody><tr><td>Business Partner (General)</td><td>000000</td></tr><tr><td>Customer</td><td>FLCU01</td></tr><tr><td>FI Customer</td><td>FLCU00</td></tr><tr><td>Vendor</td><td>FLVN01</td></tr><tr><td>FI Vendor</td><td>FLVN00</td></tr><tr><td>Carrier</td><td>CRM010</td></tr><tr><td>Global Trade Services: Customs Office</td><td>SLLCOF</td></tr><tr><td>Driver</td><td>TM0001</td></tr><tr><td>Organizational Unit</td><td>BUP004</td></tr><tr><td>Contact Person</td><td>BUP001</td></tr><tr><td>Prospect</td><td>BUP002</td></tr><tr><td>Employee</td><td>BUP003</td></tr><tr><td>Internet User</td><td>BUP005</td></tr></tbody></table><p>S4TM2 also lists Invoicing Party (BBP006) among the roles relevant to shipping. To create a customer, create a generic business partner and assign the roles Customer and FI Customer. For a vendor, assign Vendor and FI Vendor (S48600). Assigning a role activates the additional fields for that context (S48600).</p><p><em>Source difference:</em> H03 and S48600 write the FI Customer role code once as FLCU001 in running text, while their role lists and S4TM2 give FLCU00. This guide uses FLCU00.</p><h2>Organizational levels of the roles: FLCU01 allows data on sales area level (TM defaults distribution channel and division in Define General Settings for TM), FLVN01 and CRM010 on purchasing organization level, FLCU00 and FLVN00 on company code level</h2><p>The level at which a role holds data decides which organizational unit is needed to read it.</p><ul><li><strong>FLCU01 Customer:</strong> data on sales area level. A sales area is a combination of sales organization, distribution channel and division (H03).</li><li><strong>FLVN01 Vendor and CRM010 Carrier:</strong> data on purchasing organization level (H03, S48600). In the carrier simulation, order currency and payment terms agreed with the carrier are maintained on the Purchasing tab (E01).</li><li><strong>FLCU00 FI Customer and FLVN00 FI Vendor:</strong> data on company code level (H03, S48600).</li></ul><p>TM documents such as forwarding orders and forwarding quotations contain no distribution channel and no division. You therefore maintain default values for both in Customizing for Transportation Management, under Master Data, Basic Functions, General Settings, Define General Settings for TM. These defaults are added to the sales organization defined for TM, so that business partner master data stored at sales area level can still be accessed (H03).</p><h2>Carrier and driver data: role CRM010 contains the data of role FLVN01 plus TM-specific data (Regulated Agent Code, IATA Agent Code, CASS Account, SCAC Codes, Airline Codes, Service Level Codes, Carrier Service Codes); the Transport Data tab appears for the Carrier role; role TM0001 holds home location, qualifications, shift sequences, validity periods and absences</h2><p><strong>Carrier (CRM010).</strong> The role contains the data of FLVN01 plus these TM-specific fields (H03, S48600):</p><ul><li>Regulated Agent Code</li><li>IATA Agent Code</li><li>CASS Account</li><li>SCAC Codes</li><li>Airline Codes</li><li>Service Level Codes</li><li>Carrier Service Codes</li></ul><p>In the Review Carrier Information simulation (E01), you open the Maintain Business Partner app and search for the business partner with the string TM*CAR*, then choose TM-CAR-10. When you change the BP role to Carrier, the Transport Data tab appears, and it holds the TM-specific data. The Purchasing tab holds the purchasing organization level data.</p><p><strong>Driver (TM0001).</strong> Drivers operate vehicles and are defined as business partners with the role driver (S4TM2). The role holds home location, qualifications, shift sequences, validity periods and absences (S4TM2, S48600). H03 describes a driver as any person who can operate vehicles and perform transportation-related tasks as a result of certain qualifications. H03 lists availability, absences, qualifications and a Supply Chain Unit as the driver's home location. When you assign a vehicle to a freight order, the system checks the driver assignment. If no driver was assigned, it assigns the vehicle's default driver. If a vehicle resource requires qualifications, the system checks the driver's qualifications against them (H03). Driver types, which categorize drivers by duties and qualification, are defined in Customizing under Master Data, Business Partners, Define Driver Types (H03).</p><h2>Partner functions: a partner function is the role a business partner takes in a process (for example sold-to party, ship-to party, payer, bill-to party, consignee, shipper, carrier, driver, freight forwarder); one partner can have several functions; no special BP roles are needed in Customizing for partner functions, and the system can check that a BP is compatible with a document partner function</h2><p>A partner function is a particular role that a business partner can take during the process. In the S4TM2 example, one customer orders the products (sold-to party) and another receives them (ship-to party). One partner can have several functions. If all partner functions of the customer partner type are assigned to one partner, the same customer is sold-to party, ship-to party, payer and bill-to party (S4TM2).</p><p>Partner functions commonly used in the shipping process (S4TM2): consignee, bill-to party, carrier, shipper, ordering party, driver, payer and freight forwarder. In TM documents such as a forwarding order, the business partner appears as a party that takes part in the process and assumes partner functions such as ship-to party, shipper or sold-to party (H03).</p><p><strong>Roles versus functions.</strong> A BP role is a business context of the master data (what data is held). A partner function is the part played in one document. H03 says you do not need to define special business partner roles in Customizing for the partner functions: you can assign any business partner to the different partner functions. You can still configure the system to assign BP roles to allowed document partner functions. The system then checks whether a business partner is compatible with the document's partner function, and the business partner search help returns only partners that can be used for that function (H03).</p><h2>Business partner determination: a partner determination profile (Customizing, Master Data, Business Partners, Define Partner Determination Profiles) sets the partner functions available in a document, the level of control the user has, and how partners are determined; it is assigned to document types such as forwarding orders, freight orders, freight bookings, settlement documents, agreements and RFQs</h2><p>Business partner determination lets the system determine the partners in a business document. This cuts down manual errors and the need to enter a partner for each partner function (S4TM2, H03, S48600). You create a partner determination profile in Customizing for Transportation Management under Master Data, Business Partners, Define Partner Determination Profiles. The profile determines three things (H03, S4TM2):</p><ol><li><strong>The partner functions available in a business document:</strong> you specify the list of partner functions the system makes available.</li><li><strong>The level of control the user has:</strong> depending on the settings, the user can change or delete a partner function, or add one from the list of available functions. A partner function can also be set so that it cannot be changed or deleted.</li><li><strong>How the system determines the partners</strong> for the partner functions (see the next item).</li></ol><p>You assign the profile to document types, and different profiles can go to different types. For example, one profile controls forwarding orders and another controls forwarding settlement documents (H03). The types are forwarding orders, forwarding quotations, forwarding settlement documents, freight orders, freight bookings, freight settlement documents, freight agreement RFQs, forwarding agreement quotations, freight agreements, forwarding agreements, internal agreements and mutual agreements (H03, S4TM2).</p><p><em>Source difference:</em> S48600 lists only six document types (freight orders, freight bookings, freight settlement documents, freight agreement RFQs, freight agreements, internal agreements). H03 and S4TM2 give the longer list above.</p><p><strong>Incoterms.</strong> When you create a forwarding order of a given type and enter an Incoterm, the system uses the Assign Partner Determination Profiles Based on Incoterms Customizing activity. That profile overwrites the one assigned to the forwarding order type in Define Forwarding Order Types (H03).</p><h2>Ways to determine a partner: partner function with source partner function, source partner function in the BP master data (BP Relationship), a fixed business partner for a partner function (may not yet exist in the Customizing system), and relationship category</h2><p>All four use the invoicing party as the example (S4TM2, H03).</p><table><thead><tr><th>Way</th><th>Customizing setting</th><th>What the system does</th></tr></thead><tbody><tr><td>Partner function with source partner function</td><td>Partner function Invoicing Party, source type Partner Function, source function Sold-to Party</td><td>When the user enters Customer01 as sold-to party, Customer01 becomes the invoicing party.</td></tr><tr><td>Source partner function in the BP master data</td><td>Source type BP Relationship, source role Sold-to Party</td><td>The system reads the Partner Function tab of the BP in transaction BP. For logistics service provider (LSP) customer APP_1 with the role FLCU01, that tab names APP_INV as invoicing party for an organizational unit. For a forwarding order with organization 561234 and sold-to party APP_1, APP_INV is assigned as invoicing party.</td></tr><tr><td>Fixed business partner for a partner function</td><td>Source type Business Partner, business partner CSI_CARR1</td><td>CSI_CARR1 is always assigned as invoicing party. The partner may not exist in the Customizing system, so you can assign a partner in one system and transport the setting to a system where it exists (H03 uses carrier LUF).</td></tr><tr><td>Relationship category</td><td>Source type Relationship Category (for example BBP002 Has Invoicing Party), optionally with Rev. Rel.</td><td>The system uses the relationship maintained in transaction BP. With Rev. Rel. selected, both directions are considered: shipper SHP has invoicing party INV, and invoicing party INV is invoicing party of shipper SHP.</td></tr></tbody></table><p>H03 adds a further option, which is not one of the four above: a Business Add-In. You enter Business Add-In in the Srce Type field and implement BAdI: Specific Partner Assignment.</p><p><em>What the material does not establish:</em> it gives no guidance on when each way is the better choice. Any choice between them must be inferred from the mechanics in the table.</p><h2>Business partner relationships, texts and blocking: relationship category Has Contact Person is used in tendering and Has Subsidiary / Agent describes subsidiaries and agents of a carrier; additional texts serve as printing addresses or signatures; a BP can be blocked for forwarding quotations and orders at complete BP, company code, purchasing organization or sales organization level</h2><p><strong>Relationships.</strong> After defining a BP and assigning roles, you can create relationships between BPs. The category Has Contact Person is used in the tendering process. The category Has Subsidiary / Agent describes subsidiaries and agents of a carrier organization (H03). H03 says TM delivers BP roles for business partners of the type Person, but its extract does not list which ones.</p><p><strong>Additional texts.</strong> On the Additional Texts tab page (transaction BP), role Business Partner (Gen.), you can enter texts such as addresses or signatures. TM uses them as printing addresses or signatures on printing documents such as air waybills. Text types with a maximum number of characters and lines make the texts fit the print areas. Texts can be entered in several languages. The default text type for printing addresses is set in Assign BP Text Types to Partner Functions (H03).</p><p><strong>Blocking.</strong> The block stops a business partner being assigned to a forwarding quotation or a forwarding order. You can also block it so that, within a forwarding order, the system prevents forwarding settlement documents from being created. Blocks are hierarchical in the BP master record and can be set at these levels: complete business partner, company code, purchasing organization, sales organization. They are set manually, from the launchpad apps Create Customer (Sales), Create Vendor (Purchasing) or Create Forwarding Agent (H03). For example, the FLCU00 company code block on a sold-to party makes the system check the forwarding order. H03 also lists the central billing, order and posting blocks.</p><h2>Carrier profile: a profile characterizing a carrier's transportation capabilities, one per carrier with the Carrier role; it can hold freight code sets, transportation lane and carrier-specific parameters, product freight groups, transportation groups, equipment groups and types, fixed transportation costs and dimension costs; it is used for transportation proposals and carrier selection</h2><p>A carrier profile characterizes the transportation capabilities of a carrier. It stores information used in a similar constellation for multiple carriers. Carriers are business partners with the role Carrier, and you can create only one profile per carrier (H03).</p><p>What it can hold (H03): freight code sets, transportation lane and carrier-specific parameters, product freight groups, transportation groups, equipment groups and equipment types, fixed transportation costs and dimension costs.</p><p><strong>Process (H03).</strong> Prerequisites are the Carrier role on the BP and, in Customizing, defined transportation lanes, freight code sets, product freight groups, transportation groups, equipment groups and types, and means of transport.</p><ol><li>Open Define Carrier Profile (SAP Easy Access Master Data, General, or the launchpad app).</li><li>Choose the carrier and save. A performance attribute is the Cont. Move (Continuous Move) checkbox.</li><li>Make settings on the tab pages Transportation Lane (for example business share or priority), Freight Code Set (country or region and means of transport are required), Product Freight Group, Transportation Group, Equipment, Fixed Transportation Costs and Dimension Costs.</li><li>Save. You can then search the settings and find all carriers that have them.</li></ol><p><strong>Where it is read.</strong> H03 states the carrier profile is used when creating transportation proposals and when selecting a carrier.</p><h2>Organizational structure in TM: optional corporate organization, company organization (company code, local currency, legal entity), sales organization (forwarding orders, quotations, forwarding settlements), purchase organization and group (freight orders, bookings, freight settlements), planning and execution organization (resources, freight orders) and forwarding house (sales, purchasing and planning/execution in LSP scenarios); units map to S/4 units through the BSG Org. Unit field; plants and shipping points are created as locations</h2><p>S48600 gives the generic idea first: organizational structures frame the company, segregate data and transactions, restrict user access, and are a basic requirement for authorization and role setups. In TM the structure can be based on a connected SAP system, but you can also create organizational units that do not exist there. TM maps its organizational units to S/4 organizational units through the BSG Org. Unit field. Plants and shipping points are created as locations (S48600). The units, with the documents they serve (S48600, H03):</p><table><thead><tr><th>Unit</th><th>What it is</th><th>Documents and objects</th></tr></thead><tbody><tr><td>Corporate organization</td><td>Optional, a single entry point into the structure in TM, represents the group organization</td><td>None named</td></tr><tr><td>Company organization</td><td>Corresponds to the company code, holds the local currency, legal entity; used by transportation charge management (TCM) for invoicing and charging</td><td>None named</td></tr><tr><td>Sales organization (with office and group)</td><td>Structures and manages the sale of logistics services and their execution; several can sit under one company organization</td><td>Forwarding orders, forwarding quotations, forwarding settlements</td></tr><tr><td>Purchase organization and group</td><td>Procures materials and services</td><td>Freight orders, freight bookings, freight settlements</td></tr><tr><td>Planning and execution organization and group</td><td>Plans and/or executes shipments</td><td>Resources, freight orders</td></tr><tr><td>Forwarding house</td><td>One unit that sells, purchases and plans/executes in LSP scenarios</td><td>Documents of all three functions</td></tr></tbody></table><p><strong>Settlement link.</strong> For settlement integration, the system uses the business system group (BSG) assigned to an organization to decide whether the settlement document is posted to an external system or to internal SD or MM. For a forwarding settlement document it uses the sales organization in the document. If the BSG's logical system differs from the client's logical system, the document goes to external SD through enterprise services. If it is the same, it goes to internal SD (H03).</p><h2>Organizational model rules: organizational units have a unit function (sales 4, purchasing 2, forwarding house 89) and a unit role (Organization, Office, Group); the hierarchy is fixed (for example Group under Office or Organization, Office under Organization; for purchasing and planning/execution only Group under Organization); /SCMTMS/ORG_INT transfers units from S/4HANA core components; optional checks ensure carrier and customer BPs belong to a sales or purchasing organization of their company or of the document header</h2><p><strong>Unit function and role (H03).</strong> Each organizational unit is defined by its unit function and unit role.</p><ul><li>Sales organization: function 4 (Sales), role 1 (Organization).</li><li>Purchasing organization: function 2 (Purchasing), role 1 (Organization).</li><li>Forwarding house: function 89 (Forwarding House), role 1 (Organization). It is used both as a sales and as a purchasing organization. The BSG Org. Unit assigned to it is the ID of both, so the sales and purchasing organization IDs are identical.</li><li>For each sales organization, purchasing organization and forwarding house you assign a BSG Org. Unit. It is the ID used to retrieve organization-dependent business partner data, and it is maintained in Customizing.</li></ul><p><strong>Hierarchy rules (H03).</strong> The hierarchical relationship is fixed.</p><ul><li>Sales unit function: roles Organization, Office and Group. A Group can go under an Office or an Organization, and an Office under an Organization.</li><li>Purchasing or Planning and Execution unit function: only the roles Organization and Group, and a Group can only go under an Organization.</li></ul><p>For example, to rebuild a purchasing or planning and execution structure, you create one unit with the Organization role and one with the Group role, then assign the Group to the Organization (H03).</p><p><strong>Creating and changing the model (H03).</strong> Create the model with PPOCE and change it with PPOME. The recommendation is to use /SCMTMS/ORG_INT to transfer organizational units from the core components of SAP S/4HANA to TM. Employees are assigned through positions in PPOME by assigning a BP with the role Employee. When you save a change, the system adds a technical business partner and sets the business system group.</p><p><strong>Optional checks (H03).</strong> You can activate checks that every business partner with the carrier or customer role in the document is assigned to a sales or purchasing organization in the partner's own company, to the sales or purchasing organization in the document header, or to both. They apply to forwarding orders, forwarding agreements, forwarding settlement documents, freight orders, freight bookings, freight agreements and freight settlement documents. You activate them under Basic Functions, General Settings, Define General Settings for TM.</p><p><em>What the material does not establish:</em> it does not explain why TM needs its own units beyond the mapping and access purposes stated above.</p><h2>Material master attributes relevant to TM: base unit of measure, alternative units of measure, gross weight, net weight, volume, transportation group (for example palletized or refrigerated goods) and material freight group, which is transferred from the sales order item to the product item of the freight unit</h2><p>The material master (also called product master data) is the central record of materials transported, manufactured, sold or purchased, accessible to purchasing, inventory management, MRP, transportation and warehousing (S48600). The material type, for example FERT finished goods, HAWA trading goods, DIEN services, VERP packaging material or LEIH returnable packaging, controls how the number is assigned, which screens appear and which fields are mandatory, optional, hidden or display-only (S48600).</p><p>The transport-relevant attributes sit in the Sales view (Sales: General/Plant) (S48600):</p><ul><li><strong>Base Unit of Measure (BUoM):</strong> the lowest-level unit of the material.</li><li><strong>Alternative units of measure (AUoMs):</strong> multiples of the BUoM.</li><li><strong>Dimensions:</strong> Gross Weight, Net Weight and Volume. They can matter to shipping companies when deciding how to pack and ship.</li><li><strong>Transportation Group:</strong> classifies materials with similar processing conditions, for example palletized goods, refrigerated goods and dairy products.</li><li><strong>Material Freight Group:</strong> groups materials to determine their freight classification and ultimately the freight code. In TM it is transferred from the sales order item to the product item of the freight unit.</li></ul><section class="practice"><h2>Practice</h2><p>Draw a one-page business partner and organization map for a fictional logistics service provider.</p><ol><li>List its carrier, customer and driver business partners and the roles assigned to each (for example CRM010, FLCU01, FLCU00, TM0001).</li><li>Write one partner determination example for the invoicing party. Name the source type, the source function and the result the system would produce.</li><li>Sketch a small organizational model with corporate, company, sales, purchasing and forwarding house units. Show for each the documents it serves.</li></ol></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain business partner roles, partner determination and the TM organizational structure to a project stakeholder without notes?</p></section>` },
  { n:"03", title:"Locations, Zones, Trade Lanes, Modes and Resources", html:`<h2>Overview</h2><p>This session covers the transportation network: the master data that tells TM where goods can start, stop, transfer and finish, how they can move between those points, and which resources carry or handle them. Locations, zones, lanes, trade lanes, modes, means of transport and resources are all needed before planning or carrier selection can return a sensible result. Many planning errors in later sessions trace back to a missing lane, a missing resource or a mismatched capacity dimension. The session also introduces the path finder, which checks whether a connection exists.</p><h2>Transportation network building blocks: locations, transportation zones, transportation lanes, transshipment locations, default routes, schedules and trade lanes; the Transportation Network Cockpit displays locations, zones, lanes, trade lanes, schedules, default routes, connections and business partner networks on a map; planning algorithms use the network to find the most efficient path</h2><p>The transportation network defines the direct reachability between locations and transshipment locations (S48600). Advanced planning algorithms use the network definition to determine the most efficient path and to assign suitable carriers. They also consider freight and forwarding agreements that contain rates based on trade lanes (S48600).</p><p>The key terms (S48600):</p><ul><li><strong>Locations:</strong> the basic building blocks, marking start and end points of routes.</li><li><strong>Transportation zones:</strong> group multiple locations, which makes planning and optimization across larger areas easier.</li><li><strong>Transportation lanes:</strong> define the direct routes between locations and zones.</li><li><strong>Transshipment locations:</strong> let goods be transferred from one mode of transportation to another.</li><li><strong>Default routes:</strong> specific paths from source to destination through a sequence of stops. S4TM2 adds that a default route can be used in place of transshipment chains with sales orders and deliveries, forwarding orders and forwarding quotations. It can be modified manually, and is maintained in the Fiori app Define Default Routes.</li><li><strong>Schedules:</strong> recurring routes with fixed dates and times along a predefined sequence of locations.</li><li><strong>Trade lanes:</strong> an additional dimension that defines business relationships with customers and carriers.</li></ul><p>The <strong>Transportation Network Cockpit</strong> displays locations, transportation zones, transportation lanes, trade lanes, schedules, default routes, connections and business partner networks on a map (S48600).</p><p><em>What the material does not establish:</em> S4611 was not read for this guide, so the comparison with the basic scope is not covered here.</p><h2>Locations: a logical or physical place where products or resources are managed on a quantity basis; every freight unit has a source and destination location; location types (for example 1001 Production Plant, 1002 Distribution Center, 1003 Shipping Point, 1021 Business Partner, 1100 Port, 1110 Airport) are only a reference and do not control business processes; the address of a shipping point is represented as a location</h2><p>A location is a logical or physical place where products or resources are managed on a quantity basis (S48600, S4TM2). Products or freight units go from a source to a destination location, may pass through locations on the way, and are loaded and unloaded at them (S48600). To define a location, you specify its name and type.</p><p>In TM the location type categorizes locations. Location types are not used to control business processes but serve as a reference (S48600). S48600 lists these standard types: 1001 Production plant, 1002 Distribution center, 1003 Shipping point, 1005 Transportation zone, 1021 Business Partner, 1030 Terminal, 1040 Store, 1100 Port, 1110 Airport, 1120 Railway station, 1130 Container freight station, 1140 Hub, 1150 Gateway, 1160 Container yard, 1170 Warehouse, 1180 Carrier warehouse and 1200 Loading point.</p><p><em>Source difference:</em> S4TM2 lists 1190 Rail Junction and 1191 (Border Crossing Point), which S48600 does not, and does not list 1005, 1160 or 1200. Treat both lists as examples, not as complete.</p><p><strong>Integration with S/4HANA (S4TM2).</strong> Plants become location types 1001 or 1002, business partners become 1021, and shipping points become 1003. In SAP S/4HANA each inventory-relevant location can be assigned to one or more shipping points. A shipping point is an independent organizational unit at a fixed location that processes and monitors inbound and outbound deliveries. Its physical address is represented as a location in the master data. With TM in S/4HANA, no integration is needed for material master and business partners, and location master data is created on the fly or by report.</p><p>In the Fiori launchpad, the Master Data folder holds Define Location (S4TM2).</p><p><em>What the material does not establish:</em> it says location types do not control processes, but what in the master data does drive how a location is used in planning is not stated in the passages read.</p><h2>Creating locations: on the fly from sales orders, purchase orders, stock transfer orders and deliveries; with report /SAPAPO/CREATE_LOCATION for plants, shipping points and business partners; with BAdI /SAPAPO/LOC_CREATE when a business partner is saved; one-time locations are transient and used for example in forwarding orders; a business partner can have several locations, one per address</h2><p><strong>On the fly.</strong> When TM-relevant documents are created or updated, the system checks that the locations for plants, shipping points and business partners exist, and creates missing ones. The document categories are sales orders (SD), purchase orders and stock transfer orders (MM), and outbound and inbound deliveries (S48600).</p><p><strong>Report /SAPAPO/CREATE_LOCATION.</strong> It creates locations for plants, shipping points and business partners, and suits large numbers of entities. You select from plants, shipping points and business partners, and choose standard addresses only or standard plus delivery addresses. For each selected entity that lacks a location, the system creates a location from the existing address, calculates geocodes, creates a transportation zone location if necessary, and updates the location-to-zone assignment (S48600).</p><p><strong>BAdI /SAPAPO/LOC_CREATE.</strong> It creates locations as soon as a business partner is created and saved. Implementing it lets you specify the conditions for creating or updating a location. After a location exists, later address changes trigger updates (S48600).</p><p><strong>One-time locations.</strong> Locations that need not be stored permanently are one-time locations, stored as a transient master data object. They are used in processes that need locations not defined as master data, such as creating forwarding orders. The system creates them from one-time address details. A one-time location is characterized by the organization's name, address data, communication data, or a combination, and has one note per location and language (S48600).</p><p><strong>Locations of business partners.</strong> A business partner can have several standard and delivery addresses and needs one valid standard address at any time. Several locations can be assigned to one business partner, one per relevant address, and the location's address number matches that of the business partner. When TM receives a sales document or outbound delivery, it uses the address data and validity dates to find the right location (S48600).</p><p>If S/4HANA integration through the DRF is used, transportation zones are created automatically from the address of the location and the location is assigned to that zone (S4TM2).</p><h2>Geocoding: geo-coordinates (longitude, latitude, altitude) are derived from the address; standard SAP applications determine them at region level, which suffices unless distances, durations or map display are needed; the Precision field shows the granularity; two geocoding levels exist, standard (in the license) and full addresses (depends on the geocoding software)</h2><p>A location is a point on the earth's surface defined by longitude, latitude and altitude. These coordinates are determined from the address data (country, region, postal code, city, district, street, house number and more). Determining coordinates from address data is geocoding (S4TM2).</p><ul><li>Standard SAP applications determine a geo-coordinate at region level when you create or change the location address. This is enough for processes that do not work with static information or depend on distances, times or map display.</li><li>Because coordinates are the basis for distance and duration determination and map display, they must be high quality if those functions are needed.</li><li>Coordinates appear in degrees, minutes and seconds in the Geographical Data area of the Location UI and can be overwritten manually. The Precision field indicates the granularity of the geocoding result.</li><li>Two levels: standard (included in the SAP TM license) and full addresses (depending on the capabilities of the geocoding software). The program supplied by SAP determines longitude and latitude from country and region code. The material names Google, Here, Rand-McNally, PC-Miler and PTV (Karlsruhe, Germany) as companies providing geocoding products.</li></ul><h2>Transshipment locations: used to unload goods from one freight order or vehicle resource and load them onto another, for different means of transport or carriers (for example truck-ocean-truck) or for consolidation and deconsolidation; defined by assigning them to a location or transportation zone</h2><p>A transshipment location is used to unload goods from one vehicle resource (S48600) or freight order (S4TM2) and load them onto another during transportation. It applies when different means of transport or carriers are needed, for example truck-ocean-truck or truck-rail-truck, and for consolidation or deconsolidation (S4TM2, S48600).</p><p>It is defined by assigning it to another location or to a transportation zone. When assigned to a zone, it can serve as transshipment location for all locations in that zone (S48600). The assignment is made with Define Transshipment Location Assignments (H03). H03 gives two examples, both assuming the respective transportation lanes exist:</p><ul><li>Transshipment location B defined for location A, goods going A to C: either A to C directly, or A to B to C.</li><li>B defined for A and C defined for D, goods going A to D: A to D, A to B to D, or A to C to D.</li></ul><h2>Transportation zones: group locations (including one-time locations and subzones) so that zone properties pass to the locations and less master data is needed; they have no address but can have coordinates, either calculated as the center point of the included locations or entered manually; types are region, postal code, direct and mixed</h2><p>A transportation zone is a business object that aggregates multiple locations. The system can propagate properties assigned to a zone to all its locations, which minimizes the master data (S48600, S4TM2). Zones can contain individual locations, one-time locations and subzones. An example is all locations supplied by the same warehouse (S48600). Zones are typically the origin and destination of transportation lanes (S4TM2).</p><p>Zones are not physical, so they have no address, but they can have geographical coordinates. The system can estimate the center point from the coordinates of all included locations, or you can enter them manually (S48600, S4TM2). Each zone is identified by its name and type together (S48600).</p><table><thead><tr><th>Type</th><th>How locations are assigned</th><th>Remark from the material</th></tr></thead><tbody><tr><td>Direct</td><td>By entering each location</td><td>A low-volume customer can be put in a larger zone to improve optimization results (S4TM2)</td></tr><tr><td>Postal code</td><td>By a valid postal code range for a country or region</td><td>Carriers often publish rates and transit times by three-digit zip code ranges, such as 170-173 (S4TM2)</td></tr><tr><td>Region</td><td>By country/region and region. If only a country/region is entered, all its regions are included</td><td>Example: US-Illinois (S4TM2)</td></tr><tr><td>Mixed</td><td>A combination of the other types</td><td></td></tr></tbody></table><h2>Transportation zone hierarchy: properties of higher-level zones pass to lower levels; a zone cannot be assigned to itself or to a zone it already contains; a zone can be in any number of higher-level zones and a location in any number of zones; the VSR optimizer, lane determination and transshipment location determination consider the hierarchy</h2><p>A hierarchy structures zones by assigning one zone to another, so all locations of a subordinate zone become part of the superordinate zone. Zones inherit the properties of their superior zone (S48600). This reduces master data (S4TM2).</p><p>Rules (S48600, S4TM2):</p><ul><li>A zone cannot be assigned to itself.</li><li>A zone cannot be assigned to a zone that already contains it.</li><li>A zone can be assigned to any number of higher-level zones.</li><li>A location can be assigned to any number of zones.</li><li>A zone cannot be assigned to a location.</li></ul><p>The hierarchy is used (S48600) by the VSR optimizer during the optimization run, by lane determination when identifying a specific transportation lane, and by transshipment location determination to find all valid transshipment locations for a location. In the Fiori launchpad it is shown through Master Data, Define Zone Hierarchy (S4TM2).</p><h2>Transportation lanes: express direct reachability between two locations, two zones or a mix for a specific means of transport; a lane points in one direction only, so the reverse needs another lane; at least one means of transport must be assigned, carriers can be assigned per means of transport (with cost, priority, share of business or capacity), and carriers are needed for automatic carrier selection; created in the Define Transportation Lane app</h2><p>A transportation lane is a relationship between two locations, two zones, or a location and a zone. It expresses the direct reachability of the locations (or of all locations in the zones) for a specific means of transport (S48600, S4TM2, H03). Using zones as source, destination or both reduces the number of lanes to maintain. A lane points in one direction only, so the reverse direction needs another lane (S48600, S4TM2).</p><p>A lane controls which location can forward goods to another, which means of transport can be used, and which carrier can supply a vehicle for that means of transport (S48600). It is defined by source, destination, direction, available means of transport (MTr) and optionally a carrier per MTr. It can be maintained individually or by mass maintenance (S48600).</p><p><strong>Creating a lane (H03, S48600).</strong> In the Define Transportation Lane app, enter the source and destination on the Tr.Lane tab, or define an intrazone lane (by zone) or a location transportation lane (by location) on the Intra-Zone Lane/Loc. Transp. Lane tab. A location transportation lane has no impact on the reachability of locations. It can help for initializing transportation allocations, for example by limiting a carrier's freight orders from or to a location within a planning period (H03). Prerequisites: means of transport defined, at least two locations or zones, and the Carrier role on any carrier BP you want to assign.</p><p><strong>Means of transport and carriers.</strong> The creation of a lane requires at least one means of transport. Attributes such as duration, distance and costs for the means of transport must be specified. A carrier provides service along the lane for a specific means of transport and is assigned by linking it to the MTr. You can then specify attributes such as transportation costs, priority, share of business or capacity for transportation allocation. To enable automatic carrier selection, carriers must be assigned to means of transport (S48600).</p><h2>Trade lanes: abstract, context-independent classification of transport with an orientation (Inbound, Outbound, From, To, Within, Along), source and destination, optionally a mode and means of transport; they form hierarchies and can overlap; they do not replace transportation lanes and have no direct link to them</h2><p>A trade lane defines a transportation direction characterized by an orientation (Inbound, Outbound, From, To, Within, Along), a source and a destination, and can have a mode and means of transport. It is an abstract classification: an instance does not represent a connection between network nodes. Examples are all transports from Hamburg to New York, all transports within Germany, and all transports that leave Bavaria (S48600, S4TM2).</p><ul><li><strong>Hierarchy:</strong> more generic trade lanes include more specific ones, for example "Within Germany using means of transport Truck" includes "Within Bavaria using means of transport Truck for liquids". Hierarchies can combine zone hierarchies ("From Germany" includes "From Bavaria", which includes "From Plant_Munich"), MTr hierarchies and mode-to-MTr relations (S4TM2, S48600).</li><li><strong>Overlap:</strong> for example "From Germany using Airplane" and "Within Europe using Airplane" (S48600).</li><li><strong>No link to transportation lanes:</strong> trade lanes do not replace them, and there is no direct link between the two (S48600, S4TM2).</li><li><strong>Use as master data:</strong> in previous releases trade lanes were created from and associated with other business objects (business shares, allocations, freight agreements). Now they can be master data objects that you create, copy and reuse, with a worklist that includes a where-used list (S48600). S48600 also says agreements contain rates based on trade lanes.</li></ul><h2>Transportation mode and means of transport: the mode is the highest-level grouping (categories road, rail, sea, air, postal service, inland waterways); the main carriage mode holds the shipment documents in multistage shipments; a means of transport describes a vehicle type and carries mode, multi-resource, scheduled, own means of transport and GIS quality settings; UN/EDIFACT standard codes include 006 Aircraft, 011 Ship, 031 Truck, 038 Car; without a GIS, average speed and distance factor estimate transit time</h2><p><strong>Mode.</strong> The transportation mode is the highest-level transport grouping, such as road, rail, inland waterway, sea or air, and each means of transport is assigned a single mode. SAP categories: road, rail, sea, air, postal service and inland waterways. A dangerous goods transport category can be added. Category 99 (all modes) is used in the US under 49 CFR, and customers can use categories 30-89 for their own definitions (S4TM2).</p><p><strong>Main carriage.</strong> A mode can be set as the Main Carriage. In export scenarios you can have precarriage, main carriage and on-carriage. In a multimodal or multistage shipment, the main carriage stage contains all the shipment documents and allows pre- and on-carriage stages to be linked to it. Modes can also be used at a high level to determine incompatibilities (S4TM2).</p><p><strong>Means of transport.</strong> It describes the characteristics of a vehicle type or classification, for example a refrigerated truck, a 60-foot rail boxcar or a bulk container. It describes the cost structure and geographic availability of a class of vehicle. Vehicle resources assigned to it share physical characteristics such as mode, capacity, speed, cost structure, geographic availability and temperature control (S4TM2). It is defined in Customizing under Transportation Management, Master data, Resources, Define Means of Transport and Compartment, Define Means of Transport (S4TM2). Settings (S4TM2):</p><ul><li>Transportation mode</li><li>Multi-resource</li><li>Scheduled means of transport: whether the resource travels on a fixed schedule such as a sailing or rail schedule</li><li>Own means of transport: whether the resource is part of your own fleet or an external provider's</li><li>GIS quality: integration with a third-party geographical information system, which makes routes (interstate highways or county roads) and expected speeds specific</li></ul><p><strong>Standard codes (UN/EDIFACT).</strong> 006 Aircraft, 011 Ship, 031 Truck, 038 Car (S4TM2).</p><p><strong>Without a GIS.</strong> You can specify an average speed per means of transport. Speed and the distance from the transportation lane give the transit duration. The distance factor accounts for the difference between the linear distance of two locations and the actual distance covered, so you can estimate the actual distance from the linear one (S4TM2). H03 also lists a setting No Transportation Lanes Required, which activates planning with an unlimited network so a vehicle resource of that means of transport can travel between all locations, relevant for VSR optimization and scheduling.</p><h2>Multi-resource: a means of transport can be flagged so that the system assumes a defined number of resources (unlimited if none given) instead of individual resources; the number is the maximum of parallel freight orders per resource and it can model an external fleet in one step</h2><p>Instead of creating individual resources for a means of transport, you select the Multi-Resource checkbox. During planning the system assumes the number of resources you define, and unlimited if you give no number. During vehicle scheduling and preprocessing, the number is the maximum of parallel freight orders the system may create for each resource (S4TM2). Multiresources can model an external fleet in one step (S4TM2). H03 states the use case: an unlimited number of resources is available for a means of transport but you want to define the settings only once. For container resources you can also set single resource or multiresource (H03).</p><h2>Path finder: searches legs in the network over locations, transshipment locations, transportation lanes, schedules and zones to show whether a connection exists and master data is correct; it runs in the transportation network cockpit (Find Path To Location) or on the transportation proposals UI, and as report /SCMTMS/FIND_TN_PATH; it does not consider incompatibilities</h2><p>The path finder searches for legs in the network, considering locations, transshipment locations, transportation lanes, schedules and transportation zones. It shows whether a connection exists between two locations and so whether master data is correctly configured. The planner must establish that all network elements are maintained correctly so the optimizer can find a valid solution (S4TM2, S48600).</p><p><strong>Where it runs (S4TM2, S48600).</strong></p><ul><li><strong>Transportation Network Cockpit:</strong> from the context menu of a location, choose Find Path To Location and enter a destination. The system shows all available connections on the map, and the color indicates whether a valid transportation lane or schedule exists.</li><li><strong>Transportation proposals UI:</strong> a button shows or hides the available connections on the map, with the same color logic.</li><li><strong>Explanation tool:</strong> with freight units selected, Show Network Path analyzes the network considered when planning them. Its request is source and destination, options Determine path and Determine connections, and restrictions are outbound, inbound or implicit hub, transportation mode and means of transport.</li><li><strong>Report /SCMTMS/FIND_TN_PATH:</strong> input is a start and destination location. Using assigned transshipment locations and existing connections (lanes, schedules and booking), it tries to find all paths and states for each stage whether a valid connection exists. It shows, for example, a transshipment location that is assigned but cannot be reached from the start location.</li></ul><p><strong>Limits.</strong> The path finder does not take incompatibilities into consideration (S4TM2). The report cannot search within a time frame or respect the validity of connections, and its mode and means-of-transport filters are not available (S4TM2).</p><h2>Resource types: vehicle, handling, calendar and transportation unit resource (H03 also lists driver); a vehicle resource is a unit load with up to eight capacity dimensions that planning only uses if they match a freight unit building rule, and can be active or passive; Factory Calendar, Continuous Dimension, Capacity and Unit of Measure are mandatory</h2><p>Resources are central to planning and execution. Their data is relevant to planning order dates, taking working times and available capacities into account. With bookings, resources provide the capacity for transportation, loading and unloading of freight units (S4TM2, S48600).</p><table><thead><tr><th>Resource type</th><th>What it models</th></tr></thead><tbody><tr><td>Vehicle resource</td><td>Moving resources such as trucks, rail cars, planes and ships. Each is a unit load: one trailer, container or rail car of a certain capacity</td></tr><tr><td>Handling resource</td><td>Handling capacity to load and unload vehicle resources (for example door, loading ramp, forklift)</td></tr><tr><td>Calendar resource</td><td>Operating hours of locations</td></tr><tr><td>Transportation unit resource</td><td>An individual container with its capacity and availability</td></tr></tbody></table><p>H03 also lists Driver in its resource types (see Session 02 for the driver data).</p><p><strong>Vehicle resource details (S4TM2, H03).</strong></p><ul><li>Up to eight dimensions and units of measurement define capacity, for example 40,000 lb, 2200 cu ft or 24 pallets. Mass and volume are predefined by default. Planning can only take the vehicle capacity into account if the dimensions and units correspond to those in a freight unit building rule.</li><li>The available capacity cannot depend on time. A time-dependent availability can be defined using shift sequences (H03).</li><li>A vehicle resource is assigned to a means of transport, which is assigned a mode. Vehicle group and vehicle type specify physical properties and can serve as a template for resources or be requested in a forwarding or booking order (H03).</li><li>Active vehicle resources travel by themselves (a truck with a motor). Passive ones do not (an empty trailer with no tractor) (S4TM2). In Customizing this comes from the Passive Means of Transport checkbox (H03).</li><li>Define the means of transport and factory calendar before creating the resource. Recommended input: resource name, calendar and time zone, capacity. Mandatory fields: Factory Calendar, Continuous Dimension, Capacity and Unit of Measure (S4TM2).</li><li>In the planning profile you can specify whether manual overload of capacity is allowed (H03).</li></ul><p><strong>Transportation unit resource (S4TM2, H03).</strong> Up to eight dimensions, mass and volume predefined, same freight unit building rule condition as for vehicles. It can be created with reference to an equipment group and type, requested in a forwarding or booking order, and has parameters such as capacity, minimum number of seals, physical properties, downtimes, grouping attributes and alternative names.</p><h2>Other resource objects: compartments divide a vehicle resource and support incompatibilities (for example dangerous goods areas); means-of-transport combinations model truck and trailer; handling resources (door, loading ramp, forklift) give loading and unloading capacity; calendar resources set location operating hours; transportation unit resources represent containers; resource classes are determined from the means of transport or equipment group</h2><p><strong>Compartments (S4TM2).</strong> They divide a vehicle resource (truck or trailer) into smaller units, with capacity constraints, in flexible or fixed form. Incompatibilities can restrict freight units from certain compartments, for example for temperature reasons. Compartments let you assign dangerous goods to certain areas of the truck.</p><p><strong>Means-of-transport combinations (S4TM2, H03).</strong> They model truck and trailer combinations. You specify the number of objects of each MTr, for example one truck and two trailers, the maximum capacities of the combination, free attributes for compatibilities and incompatibilities, and coupling/uncoupling durations per passive MTr. H03 states a combination consists of one means of transport that can move independently and can move at least one passive MTr. With your own fleet, vehicle-resource combinations let VSR optimization couple and uncouple dynamically. Without your own fleet, combination resources let VSR optimization work on the combination level.</p><p><strong>Handling resources.</strong> They offer handling capacity for loading and unloading vehicle resources. They maintain downtimes, restrictions on simultaneous activities, availability, qualification and equipment requirements. Availability is maintained through capacity variants and shift sequences (S4TM2). The consumed capacity per loading and unloading operation is kept in the location master data, with the (MTr-specific) handling resource assignment, and the available capacity is kept in the resource master data (S4TM2). S48600 adds parameters such as resource template, capacity profile (for example a dock with 50 doors in the morning and evening and fewer during the day), availability, downtimes, qualifications, attached equipment and grouping attributes.</p><p><strong>Calendar resources.</strong> They determine the operating hours of locations, and loading and unloading can only happen in operating hours. They can be assigned to several locations as inbound or outbound operating hours, plus means-of-transport specific inbound and outbound hours (S4TM2). A calendar resource is assigned to a calendar and optionally to a shift, mainly for scheduling goods receipt and goods issue processing time (S48600, H03). A capacity profile cannot be defined for it (H03).</p><p><strong>Resource classes (H03).</strong> Classes group resources with the same characteristics. You assign a resource class to a means of transport or equipment group, and the system assigns it automatically to the resource. Without an assignment, the defaults for vehicle resources are by mode and passive flag (road: truck, or trailer if passive; rail: locomotive or rail car; sea: vessel; air: airplane). Handling resources default to Doors and transportation unit resources default to Container.</p><h2>Incompatibilities for resources in the exercise: incompatibilities define objects that must not be combined, for example ice cream and vehicles without a cooling unit; INC_S4TM1_VEH_FU links freight units to vehicle resources/types, and violations can be allowed or forbidden separately for manual planning and VSR optimization</h2><p>In the Review Incompatibility simulation (E01), you open the Edit Incompatibility app from the Profiles and Settings group. Incompatibilities specify which objects should not be combined during transportation, for example ice cream and vehicles that lack a cooling unit.</p><ul><li><strong>Incompatibility INC_S4TM1_VEH_FU:</strong> it is defined between freight units and vehicle resources or vehicle types (incompatibility type 04).</li><li><strong>Area 01:</strong> the incompatibility is checked in all automatic planning applications (VSR optimization, load planning, load consolidation, creation of transportation proposals) and in all manual planning activities. Other areas exist.</li><li><strong>Violation settings:</strong> you can specify separately whether the system may violate the incompatibility in manual planning or in VSR optimization. For example, violations can be forbidden in automatic planning while manual overrides are allowed with only a warning.</li><li><strong>Conditions:</strong> freight units for which condition INC_S4TM1_FU returns X (for example those containing ice cream) are incompatible with vehicle resources or types for which the second condition INC_S4TM2_RES returns T (for example those without a cooling unit).</li></ul><p>Incompatibilities can be quite complex in real business environments (E01).</p><section class="practice"><h2>Practice</h2><p>Create a network design sheet for a small example flow: a plant, a port and a customer zone.</p><ol><li>List the locations with their types and the geocoding approach you would use for each.</li><li>Describe the zone and its type.</li><li>List the transportation lanes in both directions, with means of transport and carrier for each.</li><li>Add one trade lane.</li><li>List the vehicle, handling and calendar resources needed.</li><li>Add a note on how the path finder would confirm the connection, and what it would not check.</li></ol></section><section class="selfcheck"><h2>Self-check</h2><p>Can I explain how locations, zones, lanes, trade lanes, modes and resources fit together in the transportation network to a project stakeholder without notes?</p></section>` },
